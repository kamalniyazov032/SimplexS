spring.application.name=SImplexS

server.port=9099
server.address=0.0.0.0

spring.datasource.url=${SIMPLEXS_DB_URL:jdbc:postgresql://REMOVED_DB_HOST:5432/Carelix}
spring.datasource.username=${SIMPLEXS_DB_USERNAME:REMOVED_DB_USER}
spring.datasource.password=${SIMPLEXS_DB_PASSWORD:REMOVED_SECRET}
spring.datasource.driver-class-name=org.postgresql.Driver

# Uzaq PostgreSQL bağlantılarının şəbəkə tərəfindən səssiz bağlanmasının qarşısını alır.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=30
