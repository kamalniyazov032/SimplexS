spring.application.name=SImplexS

server.port=9099
server.address=0.0.0.0

spring.datasource.url=${SIMPLEXS_DB_URL:jdbc:postgresql://REMOVED_DB_HOST:5432/Carelix}
spring.datasource.username=${SIMPLEXS_DB_USERNAME:REMOVED_DB_USER}
spring.datasource.password=${SIMPLEXS_DB_PASSWORD:REMOVED_SECRET}
spring.datasource.driver-class-name=org.postgresql.Driver

# Wi-Fi dəyişəndə köhnə PostgreSQL socket-lərini tez kənarlaşdırır və yeni bağlantı açır.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=90000
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=5
# Sistem qurulma mərhələsində migration-lar avtomatik işləmir.
# Yalnız açıq razılıq olduqda SIMPLEXS_FLYWAY_ENABLED=true ilə aktivləşdirilməlidir.
spring.flyway.enabled=${SIMPLEXS_FLYWAY_ENABLED:false}
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=3
spring.flyway.connect-retries-interval=5s
