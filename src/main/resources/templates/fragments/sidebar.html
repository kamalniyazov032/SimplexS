<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="sidebar" id="sidebar" th:fragment="sidebar">
    <div class="sidebar-logo">
        <div>
            <a th:href="@{/dashboard}" class="logo logo-normal"><img src="/custom/logo/LogosSVG/SS-White-logo.svg" alt="SimplexS" style="width:140px"></a>
            <a th:href="@{/dashboard}" class="logo-small"><img src="/custom/logo/LogosSVG/SS-White-logo.svg" alt="SimplexS"></a>
            <a th:href="@{/dashboard}" class="dark-logo"><img src="/custom/logo/LogosSVG/SS-Black-logo.svg" alt="SimplexS"></a>
        </div>
        <button class="sidenav-toggle-btn btn border-0 p-0 active" id="toggle_btn"><i class="ti ti-arrow-bar-to-left"></i></button>
        <button class="sidebar-close"><i class="ti ti-x align-middle"></i></button>
    </div>

    <div class="sidebar-inner" data-simplebar>
        <div id="sidebar-menu" class="sidebar-menu">
            <ul role="menu" aria-label="Əsas naviqasiya menyusu">
                <li>
                    <a th:href="@{/dashboard}" th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''">
                        <i class="ti ti-layout-board"></i><span>Dashboard</span>
                    </a>
                </li>

                <th:block th:each="modul : ${userModules}">
                    <li class="submenu" th:if="${!#lists.isEmpty(modul.children)}">
                        <a href="javascript:void(0);" th:classappend="${#strings.startsWith(currentRequestUri, modul.route ?: '__no_route__')} ? 'active subdrop' : ''">
                            <i th:class="${modul.icon ?: 'ti ti-category'}"></i>
                            <span th:text="${modul.name}">Modul</span><span class="menu-arrow"></span>
                        </a>
                        <ul>
                            <li th:each="child : ${modul.children}">
                                <a th:if="${child.route != null}" th:href="@{${child.route}}"
                                   th:classappend="${#strings.startsWith(currentRequestUri, child.route)} ? 'active' : ''">
                                    <i th:class="${child.icon ?: 'ti ti-point'}"></i><span th:text="${child.name}">Alt modul</span>
                                </a>
                                <span th:unless="${child.route != null}" class="text-muted px-3 py-2 d-block" th:text="${child.name}"></span>
                            </li>
                        </ul>
                    </li>
                    <li th:if="${#lists.isEmpty(modul.children) and modul.route != null}">
                        <a th:href="@{${modul.route}}" th:classappend="${#strings.startsWith(currentRequestUri, modul.route)} ? 'active' : ''">
                            <i th:class="${modul.icon ?: 'ti ti-apps'}"></i><span th:text="${modul.name}">Modul</span>
                        </a>
                    </li>
                </th:block>

                <li th:if="${#lists.isEmpty(userModules)}" class="px-3 py-4 text-center text-muted">
                    <i class="ti ti-shield-off fs-3 d-block mb-2"></i><small>Bu klinika üçün modul icazəsi verilməyib.</small>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
