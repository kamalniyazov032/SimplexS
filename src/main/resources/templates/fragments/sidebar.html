<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="sidebar" id="sidebar" th:fragment="sidebar">
    <div class="sidebar-logo">
        <div>
            <a th:href="@{/dashboard}" class="logo logo-normal"><img src="/custom/logo/LogosSVG/SS-White-logo.svg" alt="SimplexS" style="width:140px"></a>
            <a th:href="@{/dashboard}" class="logo-small"><img src="/custom/logo/LogosSVG/SS-White-logo.svg" alt="SimplexS"></a>
            <a th:href="@{/dashboard}" class="dark-logo"><img src="/custom/logo/LogosSVG/SS-Black-logo.svg" alt="SimplexS"></a>
        </div>
        <button class="sidenav-toggle-btn btn border-0 p-0 active" id="toggle_btn"><i class="ti ti-arrow-bar-to-left"></i></button>
        <button class="sidebar-close"><i class="ti ti-x align-middle"></i></button>
    </div>

    <div class="sidebar-inner" data-simplebar>
        <div id="sidebar-menu" class="sidebar-menu">
            <ul role="menu" aria-label="Əsas naviqasiya menyusu" th:aria-label="#{common.esas_naviqasiya_menyusu}">
                <li class="menu-dashboard">
                    <a th:href="@{/dashboard}" th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''">
                        <i class="ti ti-layout-board"></i><span th:text="#{common.dashboard}">Dashboard</span>
                    </a>
                </li>

                <th:block th:each="sistem : ${userMenuSystems}">
                <li class="menu-title menu-system-title">
                    <i th:class="${sistem.icon ?: 'ti ti-apps'}"></i>
                    <span th:text="${sistem.name}">Sistem</span>
                </li>
                <th:block th:each="modul : ${sistem.modules}">
                    <li class="submenu menu-module" th:if="${!#lists.isEmpty(modul.children)}">
                        <a href="javascript:void(0);" th:classappend="${modul.containsRoute(currentRequestUri)} ? 'active subdrop' : ''">
                            <i th:class="${modul.icon ?: 'ti ti-category'}"></i>
                            <span th:text="${modul.name}">Modul</span><span class="menu-arrow"></span>
                        </a>
                        <ul th:style="${modul.containsRoute(currentRequestUri)} ? 'display:block' : ''">
                            <li th:each="child : ${modul.children}" class="menu-leaf"
                                th:class="${!#lists.isEmpty(child.children)} ? 'submenu submenu-two' : ''">
                                <a th:if="${!#lists.isEmpty(child.children)}" href="javascript:void(0);"
                                   th:classappend="${child.containsRoute(currentRequestUri)} ? 'active subdrop' : ''">
                                    <i th:class="${child.icon ?: 'ti ti-folder'}"></i>
                                    <span th:text="${child.name}">Alt modul qrupu</span><span class="menu-arrow inside-submenu"></span>
                                </a>
                                <ul th:if="${!#lists.isEmpty(child.children)}"
                                    th:style="${child.containsRoute(currentRequestUri)} ? 'display:block' : ''">
                                    <li th:each="grandchild : ${child.children}">
                                        <a th:if="${grandchild.route != null}" th:href="@{${grandchild.route}}"
                                           th:classappend="${grandchild.containsRoute(currentRequestUri)} ? 'active' : ''">
                                            <i th:class="${grandchild.icon ?: 'ti ti-point'}"></i>
                                            <span th:text="${grandchild.name}">Submodul</span>
                                        </a>
                                        <span th:unless="${grandchild.route != null}" class="text-muted px-3 py-2 d-block"
                                              th:text="${grandchild.name}"></span>
                                    </li>
                                </ul>
                                <a th:if="${#lists.isEmpty(child.children) and child.route != null}" th:href="@{${child.route}}"
                                   th:classappend="${#strings.startsWith(currentRequestUri, child.route)} ? 'active' : ''">
                                    <i th:class="${child.icon ?: 'ti ti-point'}"></i><span th:text="${child.name}">Alt modul</span>
                                </a>
                                <span th:if="${#lists.isEmpty(child.children) and child.route == null}" class="text-muted px-3 py-2 d-block" th:text="${child.name}"></span>
                            </li>
                        </ul>
                    </li>
                    <li class="menu-module menu-module-link" th:if="${#lists.isEmpty(modul.children) and modul.route != null}">
                        <a th:href="@{${modul.route}}" th:classappend="${#strings.startsWith(currentRequestUri, modul.route)} ? 'active' : ''">
                            <i th:class="${modul.icon ?: 'ti ti-apps'}"></i><span th:text="${modul.name}">Modul</span>
                        </a>
                    </li>
                    <li class="menu-module menu-module-link" th:if="${#lists.isEmpty(modul.children) and modul.route == null}">
                        <a href="javascript:void(0);" class="menu-route-pending" aria-disabled="true">
                            <i th:class="${modul.icon ?: 'ti ti-apps'}"></i><span th:text="${modul.name}">Modul</span>
                        </a>
                    </li>
                </th:block>
                </th:block>

                <li th:if="${#lists.isEmpty(userMenuSystems)}" class="px-3 py-4 text-center text-muted">
                    <i class="ti ti-shield-off fs-3 d-block mb-2"></i><small th:text="#{common.bu_klinika_ucun_modul_icazesi_ver}">Bu klinika üçün modul icazəsi verilməyib.</small>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
