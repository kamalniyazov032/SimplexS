<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header class="navbar-header" th:fragment="header">
    <div class="page-container topbar-menu">

        <!-- LEFT -->
        <div class="d-flex align-items-center gap-2">

            <a id="mobile_btn" class="mobile-btn" href="#sidebar">
                <i class="ti ti-menu-deep fs-24"></i>
            </a>

            <a th:href="@{/dashboard}" class="logo">
                <span class="logo-light">
                    <span class="logo-lg">
                        <img src="/assets/img/logo.svg" alt="logo">
                    </span>
                </span>

                <span class="logo-dark">
                    <span class="logo-lg">
                        <img src="/assets/img/logo-dark.svg" alt="dark logo">
                    </span>
                </span>

                <span class="logo-small">
                    <span class="logo-lg">
                        <img src="/assets/img/logo-small.svg" alt="small logo">
                    </span>
                </span>
            </a>

            <button class="sidenav-toggle-btn btn border-0 p-0 active" id="toggle_btn2">
                <i class="ti ti-arrow-bar-to-right"></i>
            </button>

            <div class="me-auto d-flex align-items-center d-lg-flex d-none ms-3">
                <div class="d-flex align-items-center bg-soft-primary rounded-pill px-3 py-1" style="border: 1px solid rgba(61, 94, 225, 0.2);">

                    <i class="ti ti-building-hospital text-primary fs-18 me-2"></i>

                    <select class="form-select form-select-sm border-0 bg-transparent shadow-none fw-bold p-0"
                            style="font-size: 13px; color: #3d5ee1; width: auto; min-width: 150px; cursor: pointer;">
                        <option value="1">Caspian Hospital</option>
                        <option value="2">Baku Medical Center</option>
                        <option value="3">Medera Hospital</option>
                    </select>

                    <div class="vr mx-2 text-primary opacity-25" style="height: 15px;"></div>

                    <span class="badge badge-dot bg-success"></span>
                </div>
            </div>

        </div>

        <!-- RIGHT -->
        <div class="d-flex align-items-center">

            <div class="me-auto d-flex align-items-center header-search d-lg-none d-sm-flex d-none">
                <div class="input-icon position-relative me-2">
                    <input type="text" class="form-control" placeholder="Search Keyword">
                    <span class="input-icon-addon d-inline-flex p-0 header-search-icon">
                        <i class="ti ti-command"></i>
                    </span>
                </div>
            </div>

            <!-- Fullscreen -->
            <div class="header-item">
                <div class="dropdown me-2">
                    <a href="javascript:void(0);" class="btn topbar-link btnFullscreen">
                        <i class="ti ti-minimize"></i>
                    </a>
                </div>
            </div>

            <!-- Language -->
            <div class="header-item">
                <div class="dropdown me-2">
                    <button class="topbar-link btn" data-bs-toggle="dropdown" data-bs-offset="0,24" type="button">
                        <img src="/assets/img/flags/us.svg" alt="flags" height="16">
                    </button>

                    <div class="dropdown-menu dropdown-menu-end p-2">
                        <a href="javascript:void(0);" class="dropdown-item">
                            <img src="/assets/img/flags/us.svg" class="me-1" height="16">
                            <span class="align-middle">English</span>
                        </a>
                        <a href="javascript:void(0);" class="dropdown-item">
                            <img src="/assets/img/flags/de.svg" class="me-1" height="16">
                            <span class="align-middle">German</span>
                        </a>
                        <a href="javascript:void(0);" class="dropdown-item">
                            <img src="/assets/img/flags/fr.svg" class="me-1" height="16">
                            <span class="align-middle">French</span>
                        </a>
                        <a href="javascript:void(0);" class="dropdown-item">
                            <img src="/assets/img/flags/ae.svg" class="me-1" height="16">
                            <span class="align-middle">Arabic</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Notification -->
            <div class="header-item">
                <div class="dropdown me-2">
                    <button class="topbar-link btn topbar-link dropdown-toggle drop-arrow-none"
                            data-bs-toggle="dropdown"
                            data-bs-offset="0,24"
                            type="button">
                        <i class="ti ti-bell-check fs-16 animate-ring"></i>
                        <span class="notification-badge"></span>
                    </button>

                    <div class="dropdown-menu p-0 dropdown-menu-end dropdown-menu-lg" style="min-height: 300px;">
                        <div class="p-2 border-bottom">
                            <h6 class="m-0 fs-16 fw-semibold">Notifications</h6>
                        </div>

                        <div class="notification-body position-relative z-2 rounded-0" data-simplebar>
                            <div class="dropdown-item notification-item py-3 text-wrap border-bottom">
                                <div class="d-flex">
                                    <div class="flex-grow-1">
                                        <p class="mb-0 fw-medium text-dark">SimplexS</p>
                                        <p class="mb-1 text-wrap">Yeni bildiriş nümunəsi</p>
                                        <span class="fs-12">
                                            <i class="ti ti-clock me-1"></i>Now
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Theme -->
            <div class="header-item">
                <div class="me-2">
                    <a href="javascript:void(0);" class="btn topbar-link">
                        <i class="ti ti-moon"></i>
                    </a>
                </div>
            </div>

        </div>

    </div>
</header>

</body>
</html>
