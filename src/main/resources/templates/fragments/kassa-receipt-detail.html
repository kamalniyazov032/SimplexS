<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="detail"><link rel="stylesheet" th:href="@{/custom/css/kassa-receipt-detail.css}"><div class="receipt-detail-grid"><section class="rd-card"><h3><i class="ti ti-file-description" aria-hidden="true"></i><span th:text="#{kassa.receiptMainInfo}"></span></h3><dl class="rd-fields"><div><dt th:text="#{kassa.date}"></dt><dd th:text="${#strings.isEmpty(receipt['emeliyyat_tarixi']) ? '—' : receipt['emeliyyat_tarixi']}"></dd></div><div><dt th:text="#{kassa.receiptDirection}"></dt><dd><span class="rd-badge" th:classappend="${receipt['istiqamet'] == 'GIRIS'} ? 'rd-in' : 'rd-out'" th:text="${receipt['istiqamet']}"></span></dd></div><div><dt th:text="#{kassa.receiptOperation}"></dt><dd th:text="${#strings.isEmpty(receipt['emeliyyat_kodu']) ? '—' : receipt['emeliyyat_kodu']}"></dd></div><div><dt th:text="#{kassa.account}"></dt><dd th:text="${#strings.isEmpty(receipt['muhasibat_kodu_adi']) ? '—' : receipt['muhasibat_kodu_adi']}"></dd></div><div><dt th:text="#{kassa.receiptAmount}"></dt><dd><strong th:text="${#numbers.formatDecimal(receipt['mebleg'],1,2)}"></strong> <strong th:text="#{kassa.currency}"></strong></dd></div><div><dt th:text="#{kassa.status}"></dt><dd><span class="rd-badge" th:classappend="${paper['status'] == 'TAMAMLANIB'} ? '' : 'rd-out'" th:text="${paper['status']}"></span></dd></div><div><dt th:text="#{kassa.note}"></dt><dd th:text="${#strings.isEmpty(receipt['aciqlama']) ? '—' : receipt['aciqlama']}"></dd></div><div><dt th:text="#{kassa.receiptCancelReason}"></dt><dd th:text="${#strings.isEmpty(paper['legv_sebebi']) ? '—' : paper['legv_sebebi']}"></dd></div></dl></section><div class="rd-middle"><section class="rd-card"><h3><i class="ti ti-user" aria-hidden="true"></i><span th:text="#{kassa.receiptPatientInfo}"></span></h3><dl class="rd-fields"><div><dt th:text="#{kassa.receiptPatient}"></dt><dd th:text="${#strings.isEmpty(receipt['xeste_adi_soyadi']) ? '—' : receipt['xeste_adi_soyadi']}"></dd></div><div><dt th:text="#{kassa.patientCard}"></dt><dd th:text="${#strings.isEmpty(receipt['gelis_id']) ? '—' : receipt['gelis_id']}"></dd></div><div><dt th:text="#{kassa.receiptProtocol}"></dt><dd th:text="${#strings.isEmpty(receipt['protokol_kodu']) ? '—' : receipt['protokol_kodu']}"></dd></div><div><dt th:text="#{kassa.receiptReference}"></dt><dd th:text="${#strings.isEmpty(receipt['istinad_emeliyyat_id']) ? '—' : receipt['istinad_emeliyyat_id']}"></dd></div></dl></section><section class="rd-card"><h3><i class="ti ti-cash" aria-hidden="true"></i><span th:text="#{kassa.receiptCashInfo}"></span></h3><dl class="rd-fields"><div><dt th:text="#{kassa.transferSender}"></dt><dd th:text="${#strings.isEmpty(receipt['gonderen_kassa_adi']) ? '—' : receipt['gonderen_kassa_adi']}"></dd></div><div><dt th:text="#{kassa.transferRecipient}"></dt><dd th:text="${#strings.isEmpty(receipt['qebul_eden_kassa_adi']) ? '—' : receipt['qebul_eden_kassa_adi']}"></dd></div><div><dt th:text="#{kassa.receiptCashier}"></dt><dd th:text="${#strings.isEmpty(receipt['yaradan_personal_adi']) ? '—' : receipt['yaradan_personal_adi']}"></dd></div></dl></section></div><section class="rd-card"><h3><i class="ti ti-coins" aria-hidden="true"></i><span th:text="#{kassa.paymentTypes}"></span></h3><div class="rd-table-scroll"><table><thead><tr><th th:text="#{kassa.receiptRowNumber}"></th><th th:text="#{kassa.paymentTypes}"></th><th th:text="#{kassa.receiptAmount}"></th></tr></thead><tbody><tr th:each="r,it:${receiptPayments}"><td th:text="${it.count}"></td><td th:text="${r['odenis_novu_adi'] != null ? r['odenis_novu_adi'] : r['ad']}"></td><td class="rd-money" th:text="${#numbers.formatDecimal(r['mebleg'],1,2)}"></td></tr></tbody><tfoot><tr><th colspan="2" th:text="#{kassa.receiptTotal}"></th><td class="rd-money" th:text="${#numbers.formatDecimal(receiptPaymentTotal,1,2)}"></td></tr></tfoot></table></div></section></div>
<div class="rd-lines"><section class="rd-card"><h3><i class="ti ti-stethoscope" aria-hidden="true"></i><span th:text="|#{kassa.receiptServices} (${#lists.size(receiptServices)})|"></span><small class="rd-total"><span th:text="#{kassa.receiptTotal}"></span> <strong th:text="${#numbers.formatDecimal(receiptServiceTotal,1,2)}"></strong> <span th:text="#{kassa.currency}"></span></small></h3><div class="rd-table-scroll"><table><thead><tr><th th:text="#{kassa.receiptRowNumber}"></th><th th:text="#{kassa.receiptCode}"></th><th th:text="#{kassa.service}"></th><th th:text="#{kassa.receiptAmount}"></th></tr></thead><tbody><tr th:each="r,it:${receiptServices}"><td th:text="${it.count}"></td><td th:text="${r['xidmet_kodu']}"></td><td th:text="${r['xidmet_adi']}"></td><td class="rd-money" th:text="${#numbers.formatDecimal(r['mebleg'],1,2)}"></td></tr></tbody></table></div></section>
<section class="rd-card"><h3><i class="ti ti-pill" aria-hidden="true"></i><span th:text="#{kassa.receiptMedicines}"></span></h3><div class="rd-empty"><i class="ti ti-pill" aria-hidden="true"></i><span th:text="#{kassa.receiptMedicinesUnavailable}"></span></div></section></div>
<form th:if="${canCancel or cancelMode == true}" id="receipt-cancel-form" method="post" th:action="@{/kassa/qebzler/{id}/legv(id=${receiptId})}" class="kassa-panel p-4"><input type="hidden" name="kassaId" th:value="${cashId}"><input type="hidden" name="paymentToken" th:value="${cancelToken}"><div class="receipt-cancel-intro"><h3 th:text="#{kassa.receiptCancelConfirm}"></h3><p th:text="${receipt.transfer_id != null} ? #{kassa.receiptCancelTransferHint} : #{kassa.receiptCancelHint}"></p><strong th:text="|${receipt.emeliyyat_no} · ${receipt.mebleg}|"></strong></div><label for="receipt-reason" class="form-label" th:text="#{kassa.receiptCancelReason}"></label><select id="receipt-reason" th:disabled="${!canCancel}" name="reasonId" class="form-select select2 mb-3" required><option value="" th:text="#{kassa.receiptCancelReasonSelect}"></option><option th:each="r:${cancelReasons}" th:value="${r.id}" th:text="${r.ad}"></option></select><div th:if="${#lists.isEmpty(cancelReasons)}" class="alert alert-warning mt-3" th:text="#{kassa.receiptCancelReasonsEmpty}"></div><button th:if="${cancelMode != true}" id="receipt-cancel-submit" th:disabled="${!canCancel or #lists.isEmpty(cancelReasons)}" type="submit" class="btn btn-danger" th:text="#{kassa.confirmAction}"></button>
<dialog id="receipt-cancel-dialog" class="kassa-confirmation" aria-labelledby="receipt-cancel-title"><h2 id="receipt-cancel-title" th:text="#{kassa.receiptCancelConfirm}"></h2><p th:text="${receipt.transfer_id != null} ? #{kassa.receiptCancelTransferHint} : #{kassa.receiptCancelHint}"></p><strong th:text="|${receipt.emeliyyat_no} · ${receipt.mebleg}|"></strong><p id="receipt-confirm-reason" class="text-break mt-3"></p><div class="d-flex gap-2"><button id="receipt-cancel-no" type="button" class="btn btn-light" autofocus th:text="#{common.imtina}"></button><button id="receipt-cancel-yes" type="button" class="btn btn-danger" th:text="#{kassa.confirmAction}"></button></div></dialog></form>
</th:block></body></html>
