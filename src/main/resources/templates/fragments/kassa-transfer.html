<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="popup">
<div id="transfer-modal" class="modal fade" tabindex="-1" aria-labelledby="transfer-title" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><form id="transfer-form" class="modal-content" method="post" th:action="@{/kassa/transfer}">
<input type="hidden" name="kassaId" th:value="${cashId}"><input type="hidden" name="paymentToken" th:value="${transferToken}">
<div class="modal-header"><h2 id="transfer-title" class="modal-title fs-5" th:text="#{kassa.transfer}"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{common.bagla}"></button></div>
<div class="modal-body"><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
<label class="form-label" th:text="#{kassa.transferSender}"></label><p class="fw-semibold" th:text="|${transferCash.kassa_adi} (${transferCash.kassa_kodu})|"></p>
<div class="alert alert-primary py-2"><span th:text="#{kassa.balanceCurrent}"></span>: <strong><span th:text="${#numbers.formatDecimal(transferBalance,1,2)}"></span> <span th:text="#{kassa.currency}"></span></strong><small class="d-block mt-1" th:text="#{kassa.transferBalanceHint}"></small></div>
<label for="transfer-recipient" class="form-label" th:text="#{kassa.transferRecipient}"></label><select id="transfer-recipient" name="recipientId" class="form-select select2" required><option value="" th:text="#{kassa.selectTransferRecipient}"></option><option th:each="r:${transferRecipients}" th:value="${r.kassa_id}" th:text="|${r.kassa_adi} (${r.kassa_kodu})|" th:selected="${transferRecipientId == r.kassa_id}"></option></select>
<div th:if="${#lists.isEmpty(transferRecipients)}" class="text-danger small mt-2" th:text="#{kassa.noTransferRecipients}"></div>
<label for="transfer-account" class="form-label mt-3" th:text="#{kassa.account}"></label><select id="transfer-account" name="accountId" class="form-select select2" required><option value="" th:text="#{kassa.selectAccount}"></option><option th:each="a:${transferAccounts}" th:value="${a.muhasibat_kodu_id}" th:text="${a.ad}" th:selected="${transferAccountId == a.muhasibat_kodu_id}"></option></select>
<div th:if="${#lists.isEmpty(transferAccounts)}" class="text-danger small mt-2" th:text="#{kassa.noTransferAccounts}"></div>
<label for="transfer-amount" class="form-label mt-3" th:text="#{kassa.transferAmount}"></label><input id="transfer-amount" type="number" class="form-control" name="amount" min="0.01" th:max="${transferMax}" step="0.01" required th:value="${transferAmount}">
<label for="transfer-note" class="form-label mt-3" th:text="#{kassa.note}"></label><textarea id="transfer-note" class="form-control" rows="2" maxlength="1000" name="note" th:text="${transferNote}"></textarea><div id="transfer-feedback" class="text-danger small mt-2" role="status"></div></div>
<div class="modal-footer"><button class="btn btn-light" type="button" data-bs-dismiss="modal" th:text="#{common.imtina}"></button><button id="transfer-submit" type="submit" class="btn btn-primary" th:disabled="${transferMax <= 0 or #lists.isEmpty(transferRecipients) or #lists.isEmpty(transferAccounts)}"><span th:text="#{kassa.transferSubmit}"></span></button></div>
<dialog id="transfer-confirmation" class="kassa-confirmation" aria-labelledby="transfer-confirm-title"><h2 id="transfer-confirm-title" th:text="#{kassa.transferConfirm}"></h2><p th:text="#{kassa.confirmHint}"></p><div class="kassa-confirmation-totals">
<div><span th:text="#{kassa.transferSender}"></span><strong th:text="${transferCash.kassa_adi}"></strong></div>
<div><span th:text="#{kassa.transferRecipient}"></span><strong id="transfer-confirm-recipient"></strong></div><div><span th:text="#{kassa.account}"></span><strong id="transfer-confirm-account"></strong></div><div><span th:text="#{kassa.transferAmount}"></span><strong><span id="transfer-confirm-amount"></span> <span th:text="#{kassa.currency}"></span></strong></div></div>
<div class="d-flex gap-2 mt-4"><button id="transfer-cancel" type="button" class="btn btn-light flex-fill" autofocus th:text="#{common.imtina}"></button><button id="transfer-confirm" type="button" class="btn btn-primary flex-fill" th:text="#{kassa.confirmAction}"></button></div></dialog>
</form></div></div><script th:inline="javascript">window.KassaTransferI18n = {invalidRecipient: /*[[#{kassa.invalidTransferRecipient}]]*/ '', invalidAccount: /*[[#{kassa.invalidAccount}]]*/ '', invalidAmount: /*[[#{kassa.invalidPayment}]]*/ '', insufficientBalance: /*[[#{kassa.transferInsufficientBalance}]]*/ '', processing: /*[[#{kassa.processing}]]*/ ''};</script><script th:src="@{/custom/js/kassa-transfer.js}" defer></script>
</th:block></body></html>
