<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body><div layout:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><div><h4 class="mb-1"><i class="ti ti-list-details text-primary me-2"></i><span th:text="#{routines.title}">Rutinlər</span></h4><p class="text-muted mb-0" th:text="#{routines.subtitle}">Tez-tez istifadə edilən xidmət siyahılarını hazırlayın</p></div><button class="btn btn-primary px-3" data-bs-toggle="modal" data-bs-target="#newRoutine"><i class="ti ti-plus me-1"></i><span th:text="#{routines.new}">Yeni rutin</span></button></div>
<div th:if="${successMessage}" class="alert alert-success border-0 routine-alert"><i class="ti ti-circle-check me-2"></i><span th:text="${successMessage}"></span></div><div th:if="${errorMessage}" class="alert alert-danger border-0 routine-alert"><i class="ti ti-alert-circle me-2"></i><span th:text="${errorMessage}"></span></div>
<div class="row g-3 align-items-start"><div class="col-xl-4 col-lg-5">
<div class="routine-sidebar"><form method="get" th:action="@{/parametrler/rutinler}" class="routine-filter"><div class="row g-2"><div class="col-8"><div class="input-group"><span class="input-group-text bg-white border-end-0"><i class="ti ti-search text-muted"></i></span><input class="form-control border-start-0 ps-0" name="q" th:value="${q}" th:placeholder="#{routines.search}" autocomplete="off"></div></div><div class="col-4"><select class="form-select" name="status" onchange="this.form.submit()"><option value="aktiv" th:selected="${selectedStatus=='aktiv'}" th:text="#{common.aktiv}"></option><option value="passiv" th:selected="${selectedStatus=='passiv'}" th:text="#{common.passiv}"></option><option value="" th:selected="${selectedStatus==''}" th:text="#{common.all}"></option></select></div></div></form>
<div class="routine-list"><a th:each="r:${rutinler}" class="routine-card" th:classappend="${selectedRutin!=null and selectedRutin.id==r.id}?' active':''" th:href="@{/parametrler/rutinler(rutinId=${r.id},q=${q},status=${selectedStatus})}"><div class="routine-card-copy"><div class="fw-semibold text-truncate" th:text="${r.ad}"></div><small class="text-muted" th:text="${r.kod}"></small></div><span class="routine-card-stats"><span class="routine-count" th:text="#{routines.service_count(${r.xidmetSayi})}"></span><span th:if="${r.rutinQiymetlerindenIstifadeEt and r.umumiQiymet!=null}" class="routine-count routine-price-total" th:text="#{routines.price_total(${#numbers.formatDecimal(r.umumiQiymet,1,2)})}"></span></span></a><div th:if="${#lists.isEmpty(rutinler)}" class="routine-empty"><i class="ti ti-list-search fs-2 d-block mb-2"></i><span th:text="#{routines.empty}"></span></div></div></div></div>
<div class="col-xl-8 col-lg-7"><div th:if="${selectedRutin}" class="card border-0 routine-detail"><div class="card-header bg-white routine-detail-header"><div><div class="d-flex align-items-center gap-2 flex-wrap"><h5 class="mb-0" th:text="${selectedRutin.ad}"></h5><span class="routine-status" th:classappend="${selectedRutin.aktiv}?' active':' inactive'"><i class="ti ti-point-filled"></i><span th:text="${selectedRutin.aktiv}?#{common.aktiv}:#{common.passiv}"></span></span></div><small class="text-muted d-block mt-1" th:text="${selectedRutin.kod}"></small><small th:if="${selectedRutin.aciqlama}" class="text-muted d-block mt-1" th:text="${selectedRutin.aciqlama}"></small></div><div class="d-flex gap-2 flex-shrink-0"><button class="btn btn-sm btn-outline-primary routine-action" data-bs-toggle="modal" data-bs-target="#editRoutine" th:title="#{routines.edit}"><i class="ti ti-edit"></i></button><button class="btn btn-sm btn-primary px-3" data-bs-toggle="modal" data-bs-target="#contents"><i class="ti ti-list-details me-1"></i><span th:text="#{routines.manage_contents}">Tərkibi idarə et</span></button></div></div>
<div class="table-responsive"><table class="table table-hover align-middle mb-0 routine-table"><thead><tr><th class="ps-3"><i class="ti ti-stethoscope me-1"></i><span th:text="#{routines.service}">Xidmət</span></th><th><i class="ti ti-folders me-1"></i><span th:text="#{routines.group}">Qrup</span></th><th><i class="ti ti-category me-1"></i><span th:text="#{routines.type}">Tip</span></th><th th:if="${selectedRutin.rutinQiymetlerindenIstifadeEt}"><i class="ti ti-currency-manat me-1"></i><span th:text="#{routines.price}">Qiymət</span></th></tr></thead><tbody><tr th:each="x:${terkib}"><td class="ps-3"><div class="fw-semibold" th:text="${x.xidmetAdi}"></div><small class="text-muted" th:text="${x.xidmetKodu}"></small></td><td th:text="${x.xidmetQrupuAdi}"></td><td th:text="${x.xidmetTipiAdi}"></td><td th:if="${selectedRutin.rutinQiymetlerindenIstifadeEt}" class="fw-semibold"><span th:text="${x.qiymet!=null?#numbers.formatDecimal(x.qiymet,1,2):'—'}"></span><span th:if="${x.qiymet!=null}" class="text-muted fw-normal ms-1">₼</span></td></tr><tr th:if="${#lists.isEmpty(terkib)}"><td th:colspan="${selectedRutin.rutinQiymetlerindenIstifadeEt?4:3}" class="text-center text-muted py-5"><i class="ti ti-list-check fs-2 d-block mb-2"></i><span th:text="#{routines.no_services}"></span></td></tr></tbody></table></div></div>
<div th:unless="${selectedRutin}" class="card border-0 routine-detail"><div class="card-body text-center text-muted py-5"><i class="ti ti-list-search fs-1 d-block mb-2"></i><span th:text="#{routines.select_hint}"></span></div></div></div></div>

<div class="modal fade" id="newRoutine" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/parametrler/rutinler/yeni}">
<div class="modal-header border-0 pb-0"><div class="d-flex gap-3 align-items-center"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-list-check fs-24"></i></span><div><h5 class="mb-1" th:text="#{routines.new}">Yeni rutin</h5><small class="text-muted" th:text="#{routines.new_hint}">Rutin məlumatlarını daxil edin</small></div></div><button class="btn-close" type="button" data-bs-dismiss="modal" th:aria-label="#{common.bagla}"></button></div>
<div class="modal-body pt-4"><div class="row g-3">
<div class="col-md-4"><label class="form-label"><i class="ti ti-code text-primary me-1"></i><span th:text="#{routines.code}">Rutin kodu</span></label><div class="input-group"><span class="input-group-text bg-light"><i class="ti ti-hash"></i></span><input class="form-control" name="kod" required maxlength="100" th:placeholder="#{routines.code_placeholder}" autocomplete="off"></div><small class="text-muted" th:text="#{routines.code_hint}"></small></div>
<div class="col-md-8"><label class="form-label"><i class="ti ti-list-details text-primary me-1"></i><span th:text="#{routines.name}">Rutin adı</span></label><div class="input-group"><span class="input-group-text bg-light"><i class="ti ti-notes"></i></span><input class="form-control" name="ad" required maxlength="250" th:placeholder="#{routines.name_placeholder}" autocomplete="off"></div></div>
<div class="col-12"><label class="form-label"><i class="ti ti-align-left text-primary me-1"></i><span th:text="#{routines.description}">Açıqlama</span></label><textarea class="form-control" name="aciqlama" rows="3" maxlength="1000" th:placeholder="#{routines.description_placeholder}"></textarea></div>
<div class="col-12"><label class="border rounded p-3 d-flex justify-content-between align-items-center gap-3 mb-0"><span class="d-flex align-items-center gap-3"><span class="avatar avatar-sm bg-success-subtle text-success rounded-circle flex-shrink-0"><i class="ti ti-currency-manat"></i></span><span><span class="fw-semibold d-block" th:text="#{routines.use_prices}">Rutin qiymətlərindən istifadə et</span><small class="text-muted" th:text="#{routines.use_prices_hint}"></small></span></span><span class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" name="rutinQiymetlerindenIstifadeEt" value="true" role="switch"></span></label></div>
</div></div><div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal"><i class="ti ti-x me-1"></i><span th:text="#{common.legv_et}">Ləğv et</span></button><button class="btn btn-primary"><i class="ti ti-plus me-1"></i><span th:text="#{routines.create}">Yarat</span></button></div></form></div></div></div>

<div th:if="${selectedRutin}" class="modal fade" id="editRoutine" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/parametrler/rutinler/yenile}"><input type="hidden" name="rutinId" th:value="${selectedRutin.id}">
<div class="modal-header border-0 pb-0"><div class="d-flex gap-3 align-items-center"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-edit fs-24"></i></span><div><h5 class="mb-1" th:text="#{routines.edit}">Rutini yenilə</h5><small class="text-muted" th:text="|${selectedRutin.kod} · ${selectedRutin.ad}|"></small></div></div><button class="btn-close" type="button" data-bs-dismiss="modal" th:aria-label="#{common.bagla}"></button></div>
<div class="modal-body pt-4"><div class="row g-3"><div class="col-md-4"><label class="form-label"><i class="ti ti-code text-primary me-1"></i><span th:text="#{routines.code}"></span></label><input class="form-control" name="kod" th:value="${selectedRutin.kod}" required maxlength="100"></div><div class="col-md-8"><label class="form-label"><i class="ti ti-list-details text-primary me-1"></i><span th:text="#{routines.name}"></span></label><input class="form-control" name="ad" th:value="${selectedRutin.ad}" required maxlength="250"></div><div class="col-12"><label class="form-label"><i class="ti ti-align-left text-primary me-1"></i><span th:text="#{routines.description}"></span></label><textarea class="form-control" name="aciqlama" rows="3" maxlength="1000" th:text="${selectedRutin.aciqlama}"></textarea></div>
<div class="col-md-6"><label class="border rounded p-3 d-flex justify-content-between align-items-center gap-2 h-100 mb-0"><span class="d-flex align-items-center gap-2"><span class="avatar avatar-sm bg-success-subtle text-success rounded-circle"><i class="ti ti-currency-manat"></i></span><span class="fw-semibold" th:text="#{routines.use_prices}"></span></span><span class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" name="rutinQiymetlerindenIstifadeEt" value="true" role="switch" th:checked="${selectedRutin.rutinQiymetlerindenIstifadeEt}"></span></label></div>
<div class="col-md-6"><label class="border rounded p-3 d-flex justify-content-between align-items-center gap-2 h-100 mb-0"><span class="d-flex align-items-center gap-2"><span class="avatar avatar-sm bg-primary-subtle text-primary rounded-circle"><i class="ti ti-power"></i></span><span class="fw-semibold" th:text="#{routines.active_routine}">Aktiv rutin</span></span><span class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" name="aktiv" value="true" role="switch" th:checked="${selectedRutin.aktiv}"></span></label></div></div></div>
<div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal"><i class="ti ti-x me-1"></i><span th:text="#{common.legv_et}"></span></button><button class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i><span th:text="#{common.yadda_saxla}"></span></button></div></form></div></div></div>

<div th:if="${selectedRutin}" class="modal fade" id="contents" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><form method="post" th:action="@{/parametrler/rutinler/xidmetler}" id="contentsForm"><input type="hidden" name="rutinId" th:value="${selectedRutin.id}" id="routineId"><input type="hidden" name="xidmetlerJson" id="contentsJson"><div class="modal-header"><div><h5 class="mb-0" th:text="#{routines.manage_contents}"></h5><small class="text-muted" th:text="${selectedRutin.ad}"></small></div><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3"><div class="col-lg-7"><div class="border rounded overflow-hidden"><div class="p-3 bg-light row g-2"><div class="col-md-7"><input id="serviceSearch" class="form-control" th:placeholder="#{routines.service_search}" autocomplete="off"></div><div class="col-md-5"><select id="serviceGroup" class="form-select"><option value="" th:text="#{routines.all_groups}"></option><option th:each="g:${qruplar}" th:value="${g.id}" th:text="${g.tamYol}"></option></select></div></div><div id="candidates" class="routine-services"></div><div class="p-2 border-top text-center"><button id="more" type="button" class="btn btn-sm btn-light" hidden th:text="#{routines.more}"></button></div></div></div><div class="col-lg-5"><div class="border rounded overflow-hidden"><div class="p-3 bg-light d-flex justify-content-between"><strong th:text="#{routines.selected_services}"></strong><span id="selectedCount" class="badge bg-primary">0</span></div><div id="selected" class="routine-services"></div></div></div></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal" th:text="#{common.legv_et}"></button><button class="btn btn-primary" th:text="#{common.yadda_saxla}"></button></div></form></div></div></div>
<div id="routineI18n" hidden th:data-add="#{routines.add}" th:data-remove="#{routines.remove}" th:data-price="#{routines.price}" th:data-empty="#{routines.no_services}" th:data-no-results="#{routines.not_found}" th:data-error="#{routines.load_error}" th:data-use-prices="${selectedRutin!=null and selectedRutin.rutinQiymetlerindenIstifadeEt}"></div>
<style>
.routine-alert{box-shadow:0 5px 16px rgba(30,110,70,.06)}
.routine-sidebar{position:sticky;top:84px}
.routine-filter{padding:12px;background:var(--bs-body-bg);border:1px solid var(--bs-border-color);border-radius:10px;box-shadow:0 5px 18px rgba(25,55,85,.07);margin-bottom:12px}
.routine-list{max-height:650px;overflow:auto;padding:1px 3px 8px 1px}
.routine-card{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:70px;margin-bottom:10px;padding:14px 15px;color:var(--bs-body-color);text-decoration:none;background:var(--bs-body-bg);border:1px solid var(--bs-border-color);border-radius:10px;box-shadow:0 4px 14px rgba(25,55,85,.055);transition:border-color .18s,box-shadow .18s,transform .18s}
.routine-card:hover{color:var(--bs-body-color);border-color:rgba(var(--bs-primary-rgb),.45);box-shadow:0 7px 20px rgba(25,55,85,.09);transform:translateY(-1px)}
.routine-card.active{border-color:var(--bs-primary);background:rgba(var(--bs-primary-rgb),.045);box-shadow:0 0 0 1px rgba(var(--bs-primary-rgb),.12),0 7px 20px rgba(var(--bs-primary-rgb),.1)}
.routine-card-copy{min-width:0}.routine-card-stats{display:flex;flex-direction:column;align-items:flex-end;gap:5px}.routine-count{white-space:nowrap;padding:5px 9px;font-size:.75rem;color:var(--bs-primary);background:rgba(var(--bs-primary-rgb),.1);border-radius:20px}.routine-price-total{color:var(--bs-success);background:rgba(var(--bs-success-rgb),.1)}.routine-empty{text-align:center;color:var(--bs-secondary-color);padding:48px 12px}
.routine-detail{overflow:hidden;box-shadow:0 7px 24px rgba(25,55,85,.09)}
.routine-detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:15px 16px;border-bottom:1px solid var(--bs-border-color)}
.routine-status{display:inline-flex;align-items:center;font-size:.75rem;font-weight:600;border-radius:16px;padding:2px 7px 2px 3px}.routine-status.active{color:var(--bs-success);background:rgba(var(--bs-success-rgb),.1)}.routine-status.inactive{color:var(--bs-danger);background:rgba(var(--bs-danger-rgb),.1)}
.routine-action{width:34px}.routine-table thead th{padding-top:11px;padding-bottom:11px;color:var(--bs-secondary-color);font-size:.78rem;font-weight:600;background:var(--bs-tertiary-bg);border-bottom-color:var(--bs-border-color)}.routine-table tbody td{padding-top:12px;padding-bottom:12px}
.routine-services{height:430px;overflow:auto}.routine-service{display:flex;gap:.75rem;align-items:center;padding:.75rem 1rem;border-bottom:1px solid var(--bs-border-color)}.routine-service-info{flex:1;min-width:0}.routine-price{width:100px}
@media(max-width:991.98px){.routine-sidebar{position:static}.routine-detail-header{flex-direction:column}.routine-detail-header>div:last-child{align-self:flex-end}}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{const modal=document.getElementById('contents');if(!modal)return;const t=document.getElementById('routineI18n').dataset,usePrices=t.usePrices==='true',id=document.getElementById('routineId'),q=document.getElementById('serviceSearch'),group=document.getElementById('serviceGroup'),cbox=document.getElementById('candidates'),sbox=document.getElementById('selected'),count=document.getElementById('selectedCount'),more=document.getElementById('more'),chosen=new Map();let candidates=[],page=0,timer,request,initialized=false;
const empty=(box,msg)=>{const d=document.createElement('div');d.className='text-center text-muted py-5';d.textContent=msg;box.replaceChildren(d)};const info=x=>{const d=document.createElement('div');d.className='routine-service-info';const a=document.createElement('div');a.className='fw-semibold text-truncate';a.textContent=x.ad??x.xidmetAdi;const m=document.createElement('small');m.className='text-muted';m.textContent=[x.kod??x.xidmetKodu,x.qrupAdi??x.xidmetQrupuAdi,x.tipAdi??x.xidmetTipiAdi].filter(Boolean).join(' · ');d.append(a,m);return d};
const renderSelected=()=>{sbox.replaceChildren();count.textContent=chosen.size;if(!chosen.size)return empty(sbox,t.empty);chosen.forEach(x=>{const row=document.createElement('div');row.className='routine-service';const remove=document.createElement('button');remove.type='button';remove.className='btn btn-sm btn-outline-danger';remove.title=t.remove;remove.innerHTML='<i class="ti ti-trash"></i>';remove.addEventListener('click',()=>{chosen.delete(String(x.xidmetId));renderSelected();renderCandidates()});row.append(info(x));if(usePrices){const price=document.createElement('input');price.type='number';price.min='0';price.step='0.01';price.required=true;price.className='form-control form-control-sm routine-price';price.placeholder=t.price;price.value=x.qiymet??'';price.addEventListener('input',()=>x.qiymet=price.value===''?null:Number(price.value));row.append(price)}row.append(remove);sbox.append(row)})};
const renderCandidates=()=>{cbox.replaceChildren();if(!candidates.length)return empty(cbox,t.noResults);candidates.forEach(x=>{const row=document.createElement('div');row.className='routine-service';const add=document.createElement('button');add.type='button';add.className='btn btn-sm btn-outline-primary';add.disabled=chosen.has(String(x.id));add.title=t.add;add.innerHTML=`<i class="ti ${add.disabled?'ti-check':'ti-plus'}"></i>`;add.addEventListener('click',()=>{chosen.set(String(x.id),{xidmetId:x.id,xidmetKodu:x.kod,xidmetAdi:x.ad,xidmetQrupuAdi:x.qrupAdi,xidmetTipiAdi:x.tipAdi,qiymet:null});renderSelected();renderCandidates()});row.append(info(x),add);cbox.append(row)})};
const load=async(append=false)=>{if(!append){page=0;candidates=[];cbox.innerHTML='<div class="text-center py-5"><span class="spinner-border spinner-border-sm"></span></div>'}request?.abort();request=new AbortController();const p=new URLSearchParams({rutinId:id.value,page:String(page)});if(q.value.trim())p.set('q',q.value.trim());if(group.value)p.set('qrupId',group.value);try{const response=await fetch(`/parametrler/rutinler/xidmetler?${p}`,{signal:request.signal,headers:{Accept:'application/json'}});if(!response.ok)throw new Error();const data=await response.json();if(!append){chosen.clear();data.terkib.forEach(x=>chosen.set(String(x.xidmetId),x));renderSelected()}candidates=append?candidates.concat(data.xidmetler):data.xidmetler;more.hidden=!data.hasMore;renderCandidates()}catch(e){if(e.name!=='AbortError')empty(cbox,t.error)}};
modal.addEventListener('shown.bs.modal',()=>{if(!initialized){initialized=true;load()}});q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>load(),300)});group.addEventListener('change',()=>load());more.addEventListener('click',()=>{page++;load(true)});document.getElementById('contentsForm').addEventListener('submit',()=>document.getElementById('contentsJson').value=JSON.stringify([...chosen.values()].map(x=>({xidmet_id:Number(x.xidmetId),qiymet:x.qiymet==null?null:Number(x.qiymet)}))))});
</script></div></body></html>
