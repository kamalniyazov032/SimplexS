<!DOCTYPE html><html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><div><h4 class="mb-1"><i class="ti ti-message-question text-primary me-2"></i><span th:text="#{reasons.title}">Səbəblər</span></h4><p class="text-muted mb-0" th:text="#{reasons.subtitle}"></p></div><button th:if="${selectedNov}" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newReason"><i class="ti ti-plus me-1"></i><span th:text="#{reasons.new}"></span></button></div>
<div th:if="${successMessage}" class="alert alert-success border-0 shadow-sm"><i class="ti ti-circle-check me-2"></i><span th:text="${successMessage}"></span></div><div th:if="${errorMessage}" class="alert alert-danger border-0 shadow-sm"><i class="ti ti-alert-circle me-2"></i><span th:text="${errorMessage}"></span></div>
<div class="row g-3 align-items-start"><div class="col-xl-3 col-lg-4"><div class="card border-0 shadow-sm reason-types"><div class="card-header bg-white"><h6 class="mb-1"><i class="ti ti-category text-primary me-2"></i><span th:text="#{reasons.types}"></span></h6><small class="text-muted" th:text="#{reasons.types_hint}"></small></div><div class="list-group list-group-flush p-2"><a th:each="n:${novler}" class="list-group-item list-group-item-action border-0 rounded mb-1 reason-type" th:classappend="${selectedNov!=null and selectedNov.id==n.id}?' active':''" th:href="@{/parametrler/sebebler(novId=${n.id},status=${selectedStatus})}"><span class="reason-type-icon"><i class="ti ti-tag"></i></span><span class="min-w-0"><span class="fw-semibold d-block text-truncate" th:text="${n.ad}"></span><small class="opacity-75" th:text="${n.kod}"></small></span></a><div th:if="${#lists.isEmpty(novler)}" class="text-center text-muted py-5" th:text="#{reasons.no_types}"></div></div></div></div>
<div class="col-xl-9 col-lg-8"><div class="card border-0 shadow-sm overflow-hidden"><div class="card-header bg-white d-flex justify-content-between align-items-center gap-3 flex-wrap"><div><h5 class="mb-1" th:text="${selectedNov!=null?selectedNov.ad:#messages.msg('reasons.title')}"></h5><small class="text-muted" th:text="${selectedNov!=null?selectedNov.aciqlama:#messages.msg('reasons.select_type')}"></small></div><form th:if="${selectedNov}" method="get" th:action="@{/parametrler/sebebler}" class="d-flex gap-2"><input type="hidden" name="novId" th:value="${selectedNov.id}"><div class="input-group"><span class="input-group-text bg-light"><i class="ti ti-search"></i></span><input class="form-control" name="q" th:value="${q}" th:placeholder="#{reasons.search}"></div><select class="form-select reason-status" name="status" onchange="this.form.submit()"><option value="aktiv" th:selected="${selectedStatus=='aktiv'}" th:text="#{common.aktiv}"></option><option value="passiv" th:selected="${selectedStatus=='passiv'}" th:text="#{common.passiv}"></option><option value="" th:selected="${selectedStatus==''}" th:text="#{common.all}"></option></select></form></div>
<div class="table-responsive"><table class="table table-hover align-middle mb-0 reason-table"><thead><tr><th class="ps-3" th:text="#{reasons.code}"></th><th th:text="#{reasons.name}"></th><th th:text="#{reasons.description}"></th><th th:text="#{common.status}"></th><th></th></tr></thead><tbody><tr th:each="s:${sebebler}"><td class="ps-3"><span class="badge bg-light text-dark border" th:text="${s.kod}"></span></td><td class="fw-semibold" th:text="${s.ad}"></td><td class="text-muted" th:text="${s.aciqlama?:'—'}"></td><td><span class="badge" th:classappend="${s.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${s.aktiv}?#{common.aktiv}:#{common.passiv}"></span></td><td class="text-end pe-3"><button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="|#editReason${s.id}|" th:title="#{reasons.edit}"><i class="ti ti-edit"></i></button></td></tr><tr th:if="${#lists.isEmpty(sebebler)}"><td colspan="5" class="text-center text-muted py-5"><i class="ti ti-message-question fs-2 d-block mb-2"></i><span th:text="#{reasons.empty}"></span></td></tr></tbody></table></div></div></div></div>
<div th:if="${selectedNov}" class="modal fade" id="newReason" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/parametrler/sebebler/yeni}"><input type="hidden" name="novId" th:value="${selectedNov.id}"><div class="modal-header border-0 pb-0"><div class="d-flex gap-3 align-items-center"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-message-plus fs-24"></i></span><div><h5 class="mb-1" th:text="#{reasons.new}"></h5><small class="text-muted" th:text="|${selectedNov.ad} · ${selectedNov.kod}|"></small></div></div><button class="btn-close" type="button" data-bs-dismiss="modal" th:aria-label="#{common.bagla}"></button></div><div class="modal-body pt-4"><div class="row g-3"><div class="col-md-4"><label class="form-label"><i class="ti ti-code text-primary me-1"></i><span th:text="#{reasons.code}"></span></label><input class="form-control" name="kod" required maxlength="100" th:placeholder="#{reasons.code_placeholder}"></div><div class="col-md-8"><label class="form-label"><i class="ti ti-message text-primary me-1"></i><span th:text="#{reasons.name}"></span></label><input class="form-control" name="ad" required maxlength="250" th:placeholder="#{reasons.name_placeholder}"></div><div class="col-12"><label class="form-label"><i class="ti ti-align-left text-primary me-1"></i><span th:text="#{reasons.description}"></span></label><textarea class="form-control" name="aciqlama" rows="3" maxlength="1000" th:placeholder="#{reasons.description_placeholder}"></textarea></div></div></div><div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal"><i class="ti ti-x me-1"></i><span th:text="#{common.legv_et}"></span></button><button class="btn btn-primary"><i class="ti ti-plus me-1"></i><span th:text="#{reasons.create}"></span></button></div></form></div></div></div>
<div th:each="s:${sebebler}" class="modal fade" th:id="|editReason${s.id}|" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/parametrler/sebebler/yenile}"><input type="hidden" name="sebebId" th:value="${s.id}"><input type="hidden" name="novId" th:value="${s.novId}"><div class="modal-header border-0 pb-0"><div class="d-flex gap-3 align-items-center"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-edit fs-24"></i></span><div><h5 class="mb-1" th:text="#{reasons.edit}"></h5><small class="text-muted" th:text="|${s.kod} · ${s.ad}|"></small></div></div><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body pt-4"><div class="row g-3"><div class="col-md-4"><label class="form-label" th:text="#{reasons.code}"></label><input class="form-control" name="kod" th:value="${s.kod}" required></div><div class="col-md-8"><label class="form-label" th:text="#{reasons.name}"></label><input class="form-control" name="ad" th:value="${s.ad}" required></div><div class="col-12"><label class="form-label" th:text="#{reasons.description}"></label><textarea class="form-control" name="aciqlama" rows="3" th:text="${s.aciqlama}"></textarea></div><div class="col-12"><label class="border rounded p-3 d-flex justify-content-between align-items-center mb-0"><span class="d-flex align-items-center gap-2"><span class="avatar avatar-sm bg-success-subtle text-success rounded-circle"><i class="ti ti-power"></i></span><span class="fw-semibold" th:text="#{reasons.active}"></span></span><span class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" name="aktiv" value="true" th:checked="${s.aktiv}"></span></label></div></div></div><div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal" th:text="#{common.legv_et}"></button><button class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i><span th:text="#{common.yadda_saxla}"></span></button></div></form></div></div></div>
<style>.reason-types{position:sticky;top:84px;overflow:hidden}.reason-type{display:flex;align-items:center;gap:10px;min-height:58px}.reason-type-icon{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;border-radius:8px;color:var(--bs-primary);background:rgba(var(--bs-primary-rgb),.1)}.reason-type.active .reason-type-icon{color:var(--bs-primary);background:#fff}.reason-status{width:120px}.reason-table thead th{font-size:.78rem;color:var(--bs-secondary-color);background:var(--bs-tertiary-bg)}@media(max-width:991.98px){.reason-types{position:static}}</style>
</div></body></html>
