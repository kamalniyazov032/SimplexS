<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body><div layout:fragment="content">
  <div class="d-flex justify-content-between mb-4">
    <div><h4><i class="ti ti-currency-manat text-primary me-2"></i>Xidmət qiymətləri</h4><p class="text-muted mb-0">Qiymət başlıqları, qrupları və xidmət tarifləri</p></div>
    <div class="d-flex gap-2" th:if="${@access.hasPermission(#authentication, selectedKlinikaId, 'QIYMET_YARAT')}"><button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#newHeading"><i class="ti ti-file-plus me-1"></i>Başlıq</button><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newGroup" th:disabled="${selectedBasliqId==null}"><i class="ti ti-tag-plus me-1"></i>Yeni qiymət qrupu</button></div>
  </div>
  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
  <div class="row g-3 mb-4">
    <div class="col-lg-4"><div class="card shadow-sm border-0 h-100"><div class="card-header"><h6 class="mb-0">Qiymət başlıqları</h6></div><div class="list-group list-group-flush">
      <a th:each="b:${basliqlar}" class="list-group-item list-group-item-action d-flex justify-content-between" th:classappend="${b.id==selectedBasliqId}?'active':''" th:href="@{/xidmetQiymetleri(basliqId=${b.id})}"><span th:text="${b.ad}"></span><span th:text="${b.siraNo}"></span></a>
      <div th:if="${#lists.isEmpty(basliqlar)}" class="text-muted text-center py-4">Başlıq yoxdur.</div>
    </div></div></div>
    <div class="col-lg-8"><div class="card shadow-sm border-0 h-100"><div class="card-header d-flex justify-content-between"><h6 class="mb-0">Qiymət qrupları</h6><span class="badge bg-primary-subtle text-primary" th:text="|${#lists.size(qruplar)} qrup|"></span></div><div class="card-body"><div class="row g-2">
      <div th:each="g:${qruplar}" class="col-md-6"><div class="card border h-100"><div class="card-body py-3">
        <div class="d-flex justify-content-between"><strong th:text="${g.ad}"></strong><div><span th:if="${g.standartdir}" class="badge bg-warning-subtle text-warning me-1">Standart</span><span class="badge" th:classappend="${g.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${g.aktiv}?'Aktiv':'Passiv'"></span></div></div>
        <small class="text-muted" th:text="|${#temporals.format(g.baslamaTarixi,'dd.MM.yyyy')} — ${#temporals.format(g.bitmeTarixi,'dd.MM.yyyy')}|"></small>
        <div class="small text-muted mt-2" th:text="|Xəstə/Sığorta payı: ${g.xestePayi ?: 0}/${g.sigortaPayi ?: 0}|"></div>
        <div class="d-flex gap-2 mt-3"><a class="btn btn-sm btn-outline-primary flex-grow-1" th:href="@{/xidmetQiymetleri/qrup/{id}(id=${g.id})}">Tariflər</a><button th:if="${@access.hasPermission(#authentication, selectedKlinikaId, 'QIYMET_YENILE')}" type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" th:data-bs-target="|#editGroup${g.id}|">Redaktə et</button></div>
      </div></div></div>
      <div th:if="${#lists.isEmpty(qruplar)}" class="text-muted text-center py-4">Bu başlıqda qiymət qrupu yoxdur.</div>
    </div></div></div></div>
  </div>

  <div th:each="g:${qruplar}" class="modal fade" th:id="|editGroup${g.id}|"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><form method="post" th:action="@{/xidmetQiymetleri/qrup/yenile}">
    <input type="hidden" name="id" th:value="${g.id}"><input type="hidden" name="basliqId" th:value="${g.basliqId}">
    <div class="modal-header"><h5>Qiymət qrupunu redaktə et</h5><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-12"><label class="form-label">Qrupun adı</label><input class="form-control" name="ad" th:value="${g.ad}" required></div>
      <div class="col-md-6"><label class="form-label">Başlama tarixi</label><input class="form-control" type="date" name="baslamaTarixi" th:value="${g.baslamaTarixi}" required></div>
      <div class="col-md-6"><label class="form-label">Bitmə tarixi</label><input class="form-control" type="date" name="bitmeTarixi" th:value="${g.bitmeTarixi}" required></div>
      <div class="col-md-3"><label class="form-label">Xəstə payı</label><input class="form-control" type="number" step="0.01" min="0" name="xestePayi" th:value="${g.xestePayi}"></div>
      <div class="col-md-3"><label class="form-label">Sığorta payı</label><input class="form-control" type="number" step="0.01" min="0" name="sigortaPayi" th:value="${g.sigortaPayi}"></div>
      <div class="col-md-3"><label class="form-label">Xəstə endirimi</label><input class="form-control" type="number" step="0.01" min="0" name="xesteEndirimi" th:value="${g.xesteEndirim}"></div>
      <div class="col-md-3"><label class="form-label">Sığorta endirimi</label><input class="form-control" type="number" step="0.01" min="0" name="sigortaEndirimi" th:value="${g.sigortaEndirim}"></div>
      <div class="col-12"><label class="form-label">Təşkilatlar</label><select class="form-select select2" name="teskilatIds" multiple><option th:each="t:${teskilatlar}" th:value="${t.id}" th:text="${t.qisaAd != null ? t.ad+' ('+t.qisaAd+')' : t.ad}" th:selected="${qrupTeskilatIds[g.id] != null and qrupTeskilatIds[g.id].contains(t.id)}"></option></select></div>
      <div class="col-12"><label class="form-label">Açıqlama</label><textarea class="form-control" name="aciqlama" rows="3" th:text="${g.aciqlama}"></textarea></div>
      <div class="col-md-6 form-check form-switch ms-2"><input class="form-check-input" type="checkbox" name="standartdir" value="true" th:checked="${g.standartdir}"><label class="form-check-label">Standart qiymət qrupudur</label></div>
      <div class="col-md-5 form-check form-switch"><input class="form-check-input" type="checkbox" name="aktiv" value="true" th:checked="${g.aktiv}"><label class="form-check-label">Aktivdir</label></div>
    </div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">İmtina</button><button class="btn btn-primary">Yadda saxla</button></div>
  </form></div></div></div>

  <div class="modal fade" id="newHeading"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/xidmetQiymetleri/basliq/yeni}">
    <div class="modal-header"><h5>Yeni qiymət başlığı</h5><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Ad</label><input class="form-control mb-3" name="ad" required><label class="form-label">Açıqlama</label><textarea class="form-control" name="aciqlama"></textarea></div><div class="modal-footer"><button class="btn btn-primary">Yarat</button></div>
  </form></div></div></div>

  <div class="modal fade" id="newGroup"><div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><form method="post" th:action="@{/xidmetQiymetleri/qrup/yeni}">
    <input type="hidden" name="basliqId" th:value="${selectedBasliqId}"><div class="modal-header border-0 pb-0"><div class="d-flex align-items-center gap-3"><span class="avatar avatar-lg rounded-circle bg-primary-subtle text-primary"><i class="ti ti-tag-plus fs-24"></i></span><div><h5 class="mb-1">Yeni qiymət qrupu</h5><small class="text-muted">Tarix, ödəniş payları və tətbiq sahəsini təyin edin</small></div></div><button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Bağla"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-12"><label class="form-label"><i class="ti ti-tag text-primary me-1"></i>Qrupun adı</label><div class="input-group"><span class="input-group-text bg-light"><i class="ti ti-pencil"></i></span><input class="form-control" name="ad" placeholder="Məsələn, Standart tarif" required></div></div>
      <div class="col-md-6"><label class="form-label"><i class="ti ti-calendar-event text-primary me-1"></i>Başlama tarixi</label><input class="form-control" type="date" name="baslamaTarixi" required></div><div class="col-md-6"><label class="form-label"><i class="ti ti-calendar-check text-primary me-1"></i>Bitmə tarixi</label><input class="form-control" type="date" name="bitmeTarixi" required></div>
      <div class="col-md-3"><label class="form-label"><i class="ti ti-user-dollar text-primary me-1"></i>Xəstə payı</label><div class="input-group"><input class="form-control" type="number" step="0.01" min="0" name="xestePayi"><span class="input-group-text">%</span></div></div><div class="col-md-3"><label class="form-label"><i class="ti ti-shield-dollar text-primary me-1"></i>Sığorta payı</label><div class="input-group"><input class="form-control" type="number" step="0.01" min="0" name="sigortaPayi"><span class="input-group-text">%</span></div></div><div class="col-md-3"><label class="form-label"><i class="ti ti-discount-2 text-primary me-1"></i>Xəstə endirimi</label><div class="input-group"><input class="form-control" type="number" step="0.01" min="0" name="xesteEndirimi"><span class="input-group-text">%</span></div></div><div class="col-md-3"><label class="form-label"><i class="ti ti-rosette-discount text-primary me-1"></i>Sığorta endirimi</label><div class="input-group"><input class="form-control" type="number" step="0.01" min="0" name="sigortaEndirimi"><span class="input-group-text">%</span></div></div>
      <div class="col-12"><label class="form-label"><i class="ti ti-building-hospital text-primary me-1"></i>Təşkilatlar</label><select class="form-select select2" name="teskilatIds" multiple><option th:each="t:${teskilatlar}" th:value="${t.id}" th:text="${t.qisaAd != null ? t.ad+' ('+t.qisaAd+')' : t.ad}"></option></select></div>
      <div class="col-12"><label class="form-label"><i class="ti ti-notes text-primary me-1"></i>Açıqlama</label><textarea class="form-control" name="aciqlama" rows="3" placeholder="Qiymət qrupu haqqında əlavə məlumat"></textarea></div>
      <div class="col-md-6"><label class="form-label"><i class="ti ti-copy text-primary me-1"></i>Qiymətləri klonla</label><select class="form-select" name="klonQrupId"><option value="">Klonlama yoxdur</option><option th:each="g:${qruplar}" th:value="${g.id}" th:text="${g.ad}"></option></select></div>
      <div class="col-md-6 d-flex align-items-end"><div class="d-flex justify-content-between align-items-center border rounded bg-light p-3 w-100"><label class="form-check-label" for="newGroupStandard"><i class="ti ti-star text-warning me-2"></i>Standart qiymət qrupu</label><div class="form-check form-switch mb-0"><input id="newGroupStandard" class="form-check-input" type="checkbox" name="standartdir" value="true"></div></div></div>
    </div></div><div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal"><i class="ti ti-x me-1"></i>İmtina</button><button class="btn btn-primary"><i class="ti ti-circle-plus me-1"></i>Qiymət qrupu yarat</button></div>
  </form></div></div></div>
</div></body></html>
