<!DOCTYPE html><html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content">
<div class="d-flex justify-content-between mb-4"><div><h4><i class="ti ti-currency-manat text-primary me-2"></i>Xidmət qiymətləri</h4><p class="text-muted mb-0">Qiymət başlıqları, qrupları və xidmət tarifləri</p></div><div class="d-flex gap-2"><button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#newHeading"><i class="ti ti-plus"></i> Başlıq</button><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newGroup" th:disabled="${selectedBasliqId==null}"><i class="ti ti-plus"></i> Qiymət qrupu</button></div></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<div class="row g-3 mb-4"><div class="col-lg-4"><div class="card shadow-sm border-0 h-100"><div class="card-header"><h6 class="mb-0"><i class="ti ti-tags text-primary me-2"></i>Qiymət başlıqları</h6></div><div class="list-group list-group-flush"><a th:each="b:${basliqlar}" class="list-group-item list-group-item-action d-flex justify-content-between" th:classappend="${b.id==selectedBasliqId}?'active':''" th:href="@{/xidmetQiymetleri(basliqId=${b.id})}"><span th:text="${b.ad}"></span><span th:text="${b.siraNo}"></span></a><div th:if="${#lists.isEmpty(basliqlar)}" class="text-muted text-center py-4">Başlıq yoxdur.</div></div></div></div>
<div class="col-lg-8"><div class="card shadow-sm border-0 h-100"><div class="card-header"><h6 class="mb-0"><i class="ti ti-calendar-dollar text-primary me-2"></i>Qiymət qrupları</h6></div><div class="card-body"><div class="row g-2"><div th:each="g:${qruplar}" class="col-md-6"><a class="card border mb-0 text-decoration-none" th:href="@{/xidmetQiymetleri/qrup/{id}(id=${g.id})}"><div class="card-body py-3"><div class="d-flex justify-content-between"><strong th:text="${g.ad}"></strong><span class="badge" th:classappend="${g.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${g.aktiv}?'Aktiv':'Passiv'"></span></div><small class="text-muted" th:text="|${g.baslamaTarixi} — ${g.bitmeTarixi}|"></small><div class="text-primary small mt-2">Tariflərə bax <i class="ti ti-arrow-right"></i></div></div></a></div><div th:if="${#lists.isEmpty(qruplar)}" class="text-muted text-center py-4">Qiymət qrupu yoxdur.</div></div></div></div></div></div>
<div class="modal fade" id="newHeading"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/xidmetQiymetleri/basliq/yeni}"><div class="modal-header"><h5><i class="ti ti-tag-plus text-primary me-2"></i>Yeni qiymət başlığı</h5><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body"><input class="form-control" name="ad" placeholder="Başlığın adı" required></div><div class="modal-footer"><button class="btn btn-primary">Yarat</button></div></form></div></div></div>
<div class="modal fade" id="newGroup"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/xidmetQiymetleri/qrup/yeni}"><input type="hidden" name="basliqId" th:value="${selectedBasliqId}"><div class="modal-header"><h5><i class="ti ti-calendar-plus text-primary me-2"></i>Yeni qiymət qrupu</h5><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body"><input class="form-control mb-3" name="ad" placeholder="Qiymət qrupunun adı" required><div class="row g-3"><div class="col-6"><label>Başlama tarixi</label><input class="form-control" type="date" name="baslamaTarixi" required></div><div class="col-6"><label>Bitmə tarixi</label><input class="form-control" type="date" name="bitmeTarixi" required></div></div><textarea class="form-control my-3" name="aciqlama" placeholder="Açıqlama"></textarea><input class="form-control mb-3" type="number" min="0" name="siraNo" value="1" required><select class="form-select" name="klonQrupId"><option value="">Qiymətləri klonlama</option><option th:each="g:${qruplar}" th:value="${g.id}" th:text="${g.ad}"></option></select></div><div class="modal-footer"><button class="btn btn-primary">Yarat</button></div></form></div></div></div>
</div></body></html>
