<!DOCTYPE html><html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><div><h4 class="mb-1"><i class="ti ti-calculator text-primary me-2"></i>Mühasibat kodları</h4><p class="text-muted mb-0">Xidmətlərin mühasibat kateqoriyalarını idarə edin</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newCode"><i class="ti ti-plus me-1"></i>Yeni mühasibat kodu</button></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<div class="row g-3 mb-4"><div class="col-md-6"><div class="card border-0 shadow-sm mb-0"><div class="card-body d-flex gap-3 align-items-center py-3"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-list-numbers fs-24"></i></span><div><small class="text-muted">Ümumi mühasibat kodu</small><h4 class="mb-0" th:text="${#lists.size(kodlar)}">0</h4></div></div></div></div><div class="col-md-6"><div class="card border-0 shadow-sm mb-0"><div class="card-body d-flex gap-3 align-items-center py-3"><span class="avatar avatar-lg bg-info-subtle text-info rounded-circle"><i class="ti ti-category fs-24"></i></span><div><small class="text-muted">Mühasibat tipi</small><h4 class="mb-0" th:text="${#lists.size(tipler)}">0</h4></div></div></div></div></div>
<div class="card border-0 shadow-sm"><div class="card-header"><h5 class="mb-0">Kod siyahısı</h5></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="bg-light"><tr><th class="ps-3">Ad</th><th>Tip</th><th>Açıqlama</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="k:${kodlar}"><td class="ps-3"><div class="d-flex gap-2 align-items-center"><span class="avatar avatar-sm bg-primary-subtle text-primary rounded"><i class="ti ti-receipt"></i></span><span class="fw-semibold" th:text="${k.ad}"></span></div></td><td><span class="badge bg-info-subtle text-info" th:text="${k.tipAdi}"></span></td><td class="text-muted" th:text="${k.aciqlama?:'—'}"></td><td><span class="badge" th:classappend="${k.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${k.aktiv}?'Aktiv':'Passiv'"></span></td><td class="text-end pe-3"><button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="|#editK${k.id}|"><i class="ti ti-edit"></i></button></td></tr><tr th:if="${#lists.isEmpty(kodlar)}"><td colspan="5" class="text-center text-muted py-5"><i class="ti ti-receipt-off fs-2 d-block"></i>Mühasibat kodu tapılmadı.</td></tr></tbody></table></div></div></div>
<div class="modal fade" id="newCode" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/muhasibatKodu/yeni}"><div class="modal-header border-0 pb-0"><div class="d-flex gap-3"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-receipt fs-24"></i></span><div><h5 class="mb-1">Yeni mühasibat kodu</h5><small class="text-muted">Tip və kod adını daxil edin</small></div></div><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body pt-4"><div class="input-group mb-3"><span class="input-group-text"><i class="ti ti-category"></i></span><select class="form-select" name="tipId" required><option value="" disabled selected>Mühasibat tipini seçin</option><option th:each="t:${tipler}" th:value="${t.id}" th:text="${t.ad}"></option></select></div><div class="input-group"><span class="input-group-text"><i class="ti ti-receipt"></i></span><input class="form-control" name="ad" placeholder="Mühasibat kodunun adı" required></div></div><div class="modal-footer border-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal">İmtina</button><button class="btn btn-primary"><i class="ti ti-plus me-1"></i>Yarat</button></div></form></div></div></div>
<div th:each="k:${kodlar}" class="modal fade" th:id="|editK${k.id}|" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/muhasibatKodu/yenile}"><input type="hidden" name="muhasibatKoduId" th:value="${k.id}"><div class="modal-header"><h5><i class="ti ti-edit text-primary me-2"></i>Mühasibat kodunu redaktə et</h5><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Ad</label><input class="form-control mb-3" name="ad" th:value="${k.ad}" required><label class="form-label">Açıqlama</label><textarea class="form-control mb-3" name="aciqlama" rows="3" th:text="${k.aciqlama}"></textarea><label class="form-label">Sıra nömrəsi</label><input class="form-control mb-3" type="number" min="0" name="siraNo" placeholder="Dəyişməsin"><div class="d-flex justify-content-between border rounded bg-light p-3"><span><i class="ti ti-power text-primary me-2"></i>Aktiv mühasibat kodu</span><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="aktiv" value="true" th:checked="${k.aktiv}"></div></div></div><div class="modal-footer"><button class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i>Yadda saxla</button></div></form></div></div></div>
</div></body></html>
