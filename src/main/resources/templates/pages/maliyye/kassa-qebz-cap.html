<!DOCTYPE html><html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${paper.emeliyyat_no}"></title><link rel="stylesheet" th:href="@{/custom/css/kassa-receipt-print.css}"></head><body><div class="print-actions"><button id="receipt-print" type="button" th:text="#{kassa.receiptPrint}"></button><a th:href="@{/kassa/qebzler(kassaId=${cashId},receiptId=${receiptId})}" th:text="#{kassa.receiptBack}"></a></div>
<main class="print-sheet"><header class="print-header"><div class="print-brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="2" width="20" height="60" rx="5" fill="#246ed0"/><rect x="2" y="22" width="60" height="20" rx="5" fill="#14b9d0"/><rect x="22" y="22" width="20" height="20" rx="5" fill="#174b8e"/></svg><div><h1 th:text="${paper.klinika_adi}"></h1><p th:text="#{kassa.receipts}"></p></div></div><div class="print-reference"><span th:text="#{kassa.receiptNumber}"></span><strong th:text="${paper.emeliyyat_no}"></strong><time th:text="${paper.emeliyyat_tarixi}"></time></div></header>
<div class="print-overview"><section class="print-panel print-general"><h2 th:text="#{kassa.receiptMainInfo}"></h2><dl><div><dt th:text="#{kassa.date}"></dt><dd th:text="${#strings.isEmpty(paper['emeliyyat_tarixi']) ? '—' : paper['emeliyyat_tarixi']}"></dd></div><div><dt th:text="#{kassa.receiptDirection}"></dt><dd th:text="${#strings.isEmpty(paper['istiqamet']) ? '—' : paper['istiqamet']}"></dd></div><div><dt th:text="#{kassa.receiptOperation}"></dt><dd th:text="${#strings.isEmpty(paper['emeliyyat_kodu']) ? '—' : paper['emeliyyat_kodu']}"></dd></div><div><dt th:text="#{kassa.account}"></dt><dd th:text="${#strings.isEmpty(paper['muhasibat_kodu_adi']) ? '—' : paper['muhasibat_kodu_adi']}"></dd></div><div><dt th:text="#{kassa.receiptProtocol}"></dt><dd th:text="${#strings.isEmpty(paper['protokol_kodu']) ? '—' : paper['protokol_kodu']}"></dd></div><div><dt th:text="#{kassa.receiptNumber}"></dt><dd th:text="${#strings.isEmpty(paper['emeliyyat_no']) ? '—' : paper['emeliyyat_no']}"></dd></div><div><dt th:text="#{kassa.note}"></dt><dd th:text="${#strings.isEmpty(paper['aciqlama']) ? '—' : paper['aciqlama']}"></dd></div><div><dt th:text="#{kassa.status}"></dt><dd th:text="${#strings.isEmpty(paper['status']) ? '—' : paper['status']}"></dd></div><div><dt th:text="#{kassa.receiptCancelReason}"></dt><dd th:text="${#strings.isEmpty(paper['legv_sebebi']) ? '—' : paper['legv_sebebi']}"></dd></div></dl></section><section class="print-panel "><h2 th:text="#{kassa.receiptPatientInfo}"></h2><dl><div><dt th:text="#{kassa.receiptPatient}"></dt><dd th:text="${#strings.isEmpty(paper['xeste_adi_soyadi']) ? '—' : paper['xeste_adi_soyadi']}"></dd></div><div><dt th:text="#{kassa.patientCard}"></dt><dd th:text="${#strings.isEmpty(receipt['gelis_id']) ? '—' : receipt['gelis_id']}"></dd></div></dl></section><section class="print-panel "><h2 th:text="#{kassa.receiptCashInfo}"></h2><dl><div><dt th:text="#{kassa.cash}"></dt><dd th:text="${#strings.isEmpty(paper['kassa_adi']) ? '—' : paper['kassa_adi']}"></dd></div><div><dt th:text="#{kassa.transferSender}"></dt><dd th:text="${#strings.isEmpty(receipt['gonderen_kassa_adi']) ? '—' : receipt['gonderen_kassa_adi']}"></dd></div><div><dt th:text="#{kassa.transferRecipient}"></dt><dd th:text="${#strings.isEmpty(receipt['qebul_eden_kassa_adi']) ? '—' : receipt['qebul_eden_kassa_adi']}"></dd></div><div><dt th:text="#{kassa.receiptCashier}"></dt><dd th:text="${#strings.isEmpty(paper['kassir_adi']) ? '—' : paper['kassir_adi']}"></dd></div></dl></section><section class="print-panel print-payments"><h2 th:text="#{kassa.paymentTypes}"></h2><table><thead><tr><th th:text="#{kassa.receiptRowNumber}"></th><th th:text="#{kassa.paymentTypes}"></th><th th:text="#{kassa.receiptAmount}"></th></tr></thead><tbody><tr th:each="r,it:${receiptPayments}"><td th:text="${it.count}"></td><td th:text="${r['ad'] != null ? r['ad'] : r['odenis_novu_adi']}"></td><td class="money" th:text="${#numbers.formatDecimal(r['mebleg'],1,2)}"></td></tr></tbody><tfoot><tr><th colspan="2" th:text="#{kassa.receiptTotal}"></th><td class="money" th:text="${#numbers.formatDecimal(receiptPaymentTotal,1,2)}"></td></tr></tfoot></table></section></div>
<div class="print-lines"><section class="print-panel"><h2 th:text="#{kassa.receiptServices}"></h2><table><thead><tr><th th:text="#{kassa.receiptRowNumber}"></th><th th:text="#{kassa.receiptCode}"></th><th th:text="#{kassa.service}"></th><th th:text="#{kassa.receiptAmount}"></th></tr></thead><tbody><tr th:each="r,it:${receiptServices}"><td th:text="${it.count}"></td><td th:text="${r['xidmet_kodu']}"></td><td th:text="${r['xidmet_adi']}"></td><td class="money" th:text="${#numbers.formatDecimal(r['mebleg'],1,2)}"></td></tr></tbody><tfoot><tr><th colspan="3" th:text="#{kassa.receiptTotal}"></th><td class="money" th:text="${#numbers.formatDecimal(receiptServiceTotal,1,2)}"></td></tr></tfoot></table></section><section class="print-panel print-medicines"><h2 th:text="#{kassa.receiptMedicines}"></h2><div class="print-empty" th:text="#{kassa.receiptMedicinesUnavailable}"></div></section></div>
<div class="print-grand-total"><strong th:text="#{kassa.receiptGrandTotal}"></strong><strong><span th:text="${#numbers.formatDecimal(paper.mebleg,1,2)}"></span> <span th:text="#{kassa.currency}"></span></strong></div>
<footer class="print-footer"><div><h3 th:text="#{kassa.note}"></h3><p th:text="#{kassa.receiptThanks}"></p><p th:text="${paper.klinika_adi}"></p></div><div class="print-signatures"><div><span th:text="#{kassa.receiptCashier}"></span><span class="signature-line" th:text="${paper.kassir_adi}"></span></div><div><span th:text="#{kassa.receiptSignature}"></span><span class="signature-line"></span></div></div></footer>
</main><script th:src="@{/custom/js/kassa-receipts.js}" defer></script></body></html>
