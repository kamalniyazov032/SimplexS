<!DOCTYPE html><html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${paper.emeliyyat_no}"></title><link rel="stylesheet" th:href="@{/custom/css/kassa-receipt-print.css}"></head><body><div class="print-actions"><button id="receipt-print" type="button" th:text="#{kassa.receiptPrint}"></button><a th:href="@{/kassa/qebzler/{id}(id=${receiptId},kassaId=${cashId})}" th:text="#{kassa.receiptBack}"></a></div><main><h1 th:text="${paper.klinika_adi}"></h1><h2 th:text="${paper.kassa_adi}"></h2><dl><dt th:text="#{kassa.receiptNumber}"></dt><dd th:text="${paper['emeliyyat_no']}"></dd><dt th:text="#{kassa.date}"></dt><dd th:text="${paper['emeliyyat_tarixi']}"></dd><dt th:text="#{kassa.receiptDirection}"></dt><dd th:text="${paper['istiqamet']}"></dd><dt th:text="#{kassa.receiptOperation}"></dt><dd th:text="${paper['emeliyyat_kodu']}"></dd><dt th:text="#{kassa.account}"></dt><dd th:text="${paper['muhasibat_kodu_adi']}"></dd><dt th:text="#{kassa.receiptPatient}"></dt><dd th:text="${paper['xeste_adi_soyadi']}"></dd><dt th:text="#{kassa.patientCard}"></dt><dd th:text="${paper['xeste_kodu']}"></dd><dt th:text="#{kassa.receiptProtocol}"></dt><dd th:text="${paper['protokol_kodu']}"></dd><dt th:text="#{kassa.receiptCashier}"></dt><dd th:text="${paper['kassir_adi']}"></dd><dt th:text="#{kassa.receiptAmount}"></dt><dd th:text="${paper['mebleg']}"></dd><dt th:text="#{kassa.note}"></dt><dd th:text="${paper['aciqlama']}"></dd><dt th:text="#{kassa.status}"></dt><dd th:text="${paper['status']}"></dd><dt th:text="#{kassa.receiptCancelReason}"></dt><dd th:text="${paper['legv_sebebi']}"></dd></dl><div th:replace="~{fragments/kassa-receipt-lines :: lines}"></div><p th:text="#{kassa.currency}"></p></main><script th:src="@{/custom/js/kassa-receipts.js}" defer></script></body></html>
