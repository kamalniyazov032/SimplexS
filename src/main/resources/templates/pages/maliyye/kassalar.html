<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body><div layout:fragment="content">
  <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-4">
    <div><h4 class="mb-1"><i class="ti ti-cash-register text-primary me-2"></i><span th:text="#{common.kassalar}">Kassalar</span></h4><p class="text-muted mb-0" th:text="#{cash_registers.secilmis_klinikanin_kassa}">Seçilmiş klinikanın kassalarının idarəsi</p></div>
    <span class="badge bg-primary-subtle text-primary px-3 py-2" th:text="|${#lists.size(kassalar)} kassa|"></span>
  </div>
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible"><span th:text="${successMessage}"></span><button class="btn-close" data-bs-dismiss="alert"></button></div><div th:if="${errorMessage}" class="alert alert-danger alert-dismissible"><span th:text="${errorMessage}"></span><button class="btn-close" data-bs-dismiss="alert"></button></div>

  <div class="row g-3 mb-4">
    <div class="col-md-4"><div class="card border-0 shadow-sm"><div class="card-body d-flex align-items-center gap-3"><span class="avatar bg-primary-subtle text-primary rounded-circle"><i class="ti ti-cash-register"></i></span><div><small class="text-muted" th:text="#{cash_registers.siyahidaki_kassalar}">Siyahıdakı kassalar</small><h4 class="mb-0" th:text="${#lists.size(kassalar)}"></h4></div></div></div></div>
    <div class="col-md-4"><div class="card border-0 shadow-sm"><div class="card-body d-flex align-items-center gap-3"><span class="avatar bg-success-subtle text-success rounded-circle"><i class="ti ti-circle-check"></i></span><div><small class="text-muted" th:text="#{common.aktiv}">Aktiv</small><h4 class="mb-0" th:text="${aktivKassaSayi}"></h4></div></div></div></div>
    <div class="col-md-4"><div class="card border-0 shadow-sm"><div class="card-body d-flex align-items-center gap-3"><span class="avatar bg-danger-subtle text-danger rounded-circle"><i class="ti ti-circle-x"></i></span><div><small class="text-muted" th:text="#{common.passiv}">Passiv</small><h4 class="mb-0" th:text="${passivKassaSayi}"></h4></div></div></div></div>
  </div>

  <div class="card border-0 shadow-sm"><div class="card-header bg-white d-flex justify-content-between align-items-end gap-3 flex-wrap"><div><h5 class="mb-1" th:text="#{cash_registers.kassa_siyahisi}">Kassa siyahısı</h5><small class="text-muted" th:text="#{cash_registers.kassa_kodu_adi_aciqlamasi}">Kassa kodu, adı, açıqlaması və statusu</small></div><form method="get" th:action="@{/kassalar}" class="d-flex gap-2"><select class="form-select" name="status"><option value="aktiv" th:selected="${status=='aktiv'}" th:text="#{common.aktiv}">Aktiv</option><option value="passiv" th:selected="${status=='passiv'}" th:text="#{common.passiv}">Passiv</option><option value="hamisi" th:selected="${status=='hamisi'}" th:text="#{common.hamisi}">Hamısı</option></select><button class="btn btn-primary"><i class="ti ti-filter me-1"></i><span th:text="#{common.filter}">Filter</span></button></form></div>
    <div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th class="ps-3" th:text="#{common.sira}">Sıra</th><th th:text="#{common.kod}">Kod</th><th th:text="#{common.kassa}">Kassa</th><th th:text="#{common.aciqlama}">Açıqlama</th><th th:text="#{common.status}">Status</th><th th:text="#{common.yaranma_tarixi}">Yaranma tarixi</th><th th:text="#{common.son_yenilenme}">Son yenilənmə</th><th></th></tr></thead><tbody>
      <tr th:each="k:${kassalar}"><td class="ps-3" th:text="${k.siraNo ?: '—'}"></td><td><span class="badge bg-light text-dark border" th:text="${k.kod}"></span></td><td><strong th:text="${k.ad}"></strong></td><td th:text="${k.aciqlama ?: '—'}"></td><td><span class="badge" th:classappend="${k.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${k.aktiv}?'Aktiv':'Passiv'"></span></td><td th:text="${k.yaranmaTarixi != null ? #temporals.format(k.yaranmaTarixi,'dd.MM.yyyy HH:mm') : '—'}"></td><td th:text="${k.yenilenmeTarixi != null ? #temporals.format(k.yenilenmeTarixi,'dd.MM.yyyy HH:mm') : '—'}"></td><td class="text-end"><button th:if="${@access.hasPermission(#authentication, selectedKlinikaId, 'KASSA_YENILE')}" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="|#editCash${k.id}|"><i class="ti ti-edit me-1"></i><span th:text="#{common.redakte_et}">Redaktə et</span></button></td></tr>
      <tr th:if="${#lists.isEmpty(kassalar)}"><td colspan="8" class="text-center text-muted py-5"><i class="ti ti-cash-off fs-2 d-block mb-2"></i><span th:text="#{cash_registers.filtere_uygun_kassa_tapil}">Filterə uyğun kassa tapılmadı</span></td></tr>
    </tbody></table></div>
  </div>

  <div th:each="k:${kassalar}" class="modal fade" th:id="|editCash${k.id}|" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/kassalar/yenile}"><input type="hidden" name="kassaId" th:value="${k.id}"><div class="modal-header"><div><h5 class="mb-1" th:text="#{cash_registers.kassani_redakte_et}">Kassanı redaktə et</h5><small class="text-muted" th:text="${k.ad}"></small></div><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label" th:text="#{cash_registers.kassa_kodu}">Kassa kodu</label><input class="form-control mb-3" name="kod" th:value="${k.kod}" required maxlength="100"><label class="form-label" th:text="#{cash_registers.kassa_adi}">Kassa adı</label><input class="form-control mb-3" name="ad" th:value="${k.ad}" required maxlength="200"><label class="form-label" th:text="#{common.aciqlama}">Açıqlama</label><textarea class="form-control mb-3" name="aciqlama" rows="3" th:text="${k.aciqlama}"></textarea><div class="d-flex justify-content-between align-items-center border rounded bg-light p-3"><div><strong th:text="#{cash_registers.aktiv_kassa}">Aktiv kassa</strong><small class="d-block text-muted" th:text="#{cash_registers.passiv_kassa_standart_siy}">Passiv kassa standart siyahıda görünməyəcək</small></div><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="aktiv" value="true" th:id="|cashActive${k.id}|" th:checked="${k.aktiv}"></div></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal" th:text="#{common.imtina}">İmtina</button><button class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i><span th:text="#{common.yadda_saxla}">Yadda saxla</span></button></div></form></div></div></div>
</div></body></html>
