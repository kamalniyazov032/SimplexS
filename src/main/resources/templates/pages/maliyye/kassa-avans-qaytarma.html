<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body><div layout:fragment="content" class="content kassa-page">
<link rel="stylesheet" th:href="@{/custom/css/kassa-center.css}">
<div class="kassa-work-heading"><div><a th:href="@{/kassa(kassaId=${cashId})}"><i class="ti ti-arrow-left me-1" aria-hidden="true"></i><span th:text="#{kassa.back}"></span></a><h1 th:text="#{kassa.advanceRefund}"></h1><p th:text="|${cash.kassa_adi} (${cash.kassa_kodu})|"></p></div><span class="badge bg-danger-subtle text-danger p-3" th:text="#{kassa.advanceRefundHint}"></span></div>
<div class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
<div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
<section class="kassa-panel">
<div class="kassa-panel-head"><h2 th:text="#{kassa.advanceRefundPatients}"></h2></div>
<form method="get" th:action="@{/kassa/avans-qaytarma}" class="row g-2 p-3 align-items-end">
<input type="hidden" name="kassaId" th:value="${cashId}">
<div class="col-md-6"><label for="refund-query" class="form-label small" th:text="#{kassa.advanceQuery}"></label><input id="refund-query" name="q" type="search" class="form-control" maxlength="200" th:value="${query}" th:placeholder="#{kassa.advanceQueryHint}"></div>
<div class="col-md-4"><label for="refund-card-type" class="form-label small" th:text="#{kassa.cardType}"></label><select id="refund-card-type" name="cardType" class="form-select select2"><option value="" th:text="#{kassa.allCardTypes}"></option><option th:each="c:${cardTypes}" th:value="${c.kod}" th:text="${c.ad}" th:selected="${c.kod == cardType}"></option></select></div>
<div class="col-md-2"><button class="btn btn-primary w-100" type="submit" th:text="#{kassa.search}"></button></div>
</form>
<div class="kassa-table-scroll" tabindex="0" role="region" th:aria-label="#{kassa.advanceRefundPatients}"><table class="table"><thead><tr>
<th th:text="#{kassa.patientCard}"></th><th th:text="#{kassa.visitCard}"></th><th th:text="#{kassa.cardType}"></th><th th:text="#{kassa.firstName}"></th><th th:text="#{kassa.lastName}"></th><th th:text="#{kassa.fatherName}"></th><th th:text="#{kassa.birthDate}"></th><th th:text="#{kassa.visitDate}"></th><th th:text="#{kassa.action}"></th>
</tr></thead><tbody><tr th:each="r:${patients}" data-patient-row th:classappend="${r.gelis_id == targetId} ? 'is-selected'">
<td th:text="${r.l_kart}"></td><td th:text="${r.gelis_karti}"></td><td th:text="${r.kart_novu_adi}"></td><td th:text="${r.ad}"></td><td th:text="${r.soyad}"></td><td th:text="${r.ata_adi}"></td><td th:text="${r.dogum_tarixi}"></td><td th:text="${r.gelis_tarixi}"></td>
<td><a class="btn btn-sm btn-outline-danger" th:href="@{/kassa/avans-qaytarma(kassaId=${cashId},targetId=${r.gelis_id},q=${query},cardType=${cardType},page=${page})}" th:text="#{kassa.open}"></a></td>
</tr></tbody></table></div>
<div class="kassa-empty" th:if="${#lists.isEmpty(patients)}" th:text="#{kassa.noAdvanceRefundPatients}"></div>
<nav class="p-3 d-flex align-items-center justify-content-between gap-2" th:aria-label="#{kassa.patientPages}"><span class="text-muted small" th:text="#{kassa.advancePageSummary(${page},${#lists.size(patients)})}"></span><div class="d-flex gap-2">
<a class="btn btn-sm btn-outline-primary" th:if="${page > 1}" th:href="@{/kassa/avans-qaytarma(kassaId=${cashId},q=${query},cardType=${cardType},page=${page - 1})}" th:text="#{kassa.previousPage}"></a>
<a class="btn btn-sm btn-outline-primary" th:if="${hasMore}" th:href="@{/kassa/avans-qaytarma(kassaId=${cashId},q=${query},cardType=${cardType},page=${page + 1})}" th:text="#{kassa.nextPage}"></a>
</div></nav></section>

<div th:if="${selected != null}" id="advance-refund-modal" class="modal fade kassa-payment-modal" tabindex="-1" aria-labelledby="advance-refund-title" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-lg-down"><div class="modal-content">
<div class="modal-header"><h2 id="advance-refund-title" class="modal-title fs-5" th:text="#{kassa.advanceRefund}"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{common.bagla}"></button></div>
<div class="modal-body"><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<div class="kassa-patient-context mb-3"><i class="ti ti-user-circle" aria-hidden="true"></i><div><strong th:text="${selected.xeste_adi_soyadi}"></strong><small th:text="|${selected.xeste_kodu} · ${selected.protokol_kodu}|"></small></div></div>
<form id="advance-refund-form" method="post" th:action="@{/kassa/avans-qaytarma}"><input type="hidden" name="kassaId" th:value="${cashId}"><input type="hidden" name="targetId" th:value="${targetId}"><input type="hidden" name="paymentToken" th:value="${paymentToken}">
<fieldset th:disabled="${!canWrite}"><div class="kassa-payment-layout"><section class="kassa-panel"><div class="kassa-panel-head"><h2 th:text="#{kassa.advanceRefundList}"></h2></div><div class="kassa-table-scroll"><table class="table"><thead><tr><th th:text="#{kassa.select}"></th><th th:text="#{kassa.advanceNumber}"></th><th th:text="#{kassa.date}"></th><th th:text="#{kassa.advanceInitial}"></th><th th:text="#{kassa.advanceUsed}"></th><th th:text="#{kassa.refunded}"></th><th th:text="#{kassa.advanceRemaining}"></th><th th:text="#{kassa.status}"></th></tr></thead><tbody><tr th:each="r:${advances}"><td><input class="form-check-input advance-refund-choice" type="radio" name="advanceId" required th:value="${r.avans_id}" th:data-balance="${r.qalan_mebleg}" th:data-number="${r.avans_no}" th:checked="${refundAdvanceId == r.avans_id}" th:disabled="${r.qalan_mebleg <= 0}" th:aria-label="${r.avans_no}"></td><td th:text="${r.avans_no}"></td><td th:text="${r.avans_tarixi}"></td><td th:text="${#numbers.formatDecimal(r.ilk_mebleg,1,2)}"></td><td th:text="${#numbers.formatDecimal(r.istifade_edilen_mebleg,1,2)}"></td><td th:text="${#numbers.formatDecimal(r.qaytarilan_mebleg,1,2)}"></td><td th:text="${#numbers.formatDecimal(r.qalan_mebleg,1,2)}"></td><td th:text="${r.status}"></td></tr></tbody></table></div></section>
<aside class="kassa-checkout"><h2 th:text="#{kassa.refundSummary}"></h2><div class="kassa-total-row primary"><span th:text="#{kassa.advanceRemaining}"></span><strong><span id="advance-refund-balance">—</span> <span th:text="#{kassa.currency}"></span></strong></div>
<label for="advance-refund-account" class="form-label" th:text="#{kassa.account}"></label><select id="advance-refund-account" class="form-select select2" name="accountId" required><option value="" th:text="#{kassa.selectAccount}"></option><option th:each="a:${refundAccounts}" th:value="${a.muhasibat_kodu_id}" th:text="${a.ad}" th:selected="${refundAccountId == a.muhasibat_kodu_id}"></option></select>
<div th:if="${#lists.isEmpty(refundAccounts)}" class="text-danger small mt-2" th:text="#{kassa.noRefundAccounts}"></div>
<label for="advance-refund-type" class="form-label mt-3" th:text="#{kassa.paymentTypes}"></label><select id="advance-refund-type" class="form-select select2" name="typeId" required><option value="" th:text="#{kassa.selectPaymentType}"></option><option th:each="t:${paymentTypes}" th:value="${t.odenis_novu_id}" th:text="${t.ad}" th:selected="${refundTypeId == t.odenis_novu_id}"></option></select>
<label for="advance-refund-amount" class="form-label mt-3" th:text="#{kassa.refundTotal}"></label><input id="advance-refund-amount" name="amount" type="number" class="form-control" min="0.01" max="0" step="0.01" required th:value="${refundAmount}">
<label for="advance-refund-note" class="form-label mt-3" th:text="#{kassa.note}"></label><textarea id="advance-refund-note" name="note" class="form-control" rows="2" maxlength="1000" th:text="${refundNote}"></textarea><div id="advance-refund-feedback" class="text-danger small my-3" role="status"></div><button id="advance-refund-submit" class="btn btn-danger w-100" type="submit" th:disabled="${#lists.isEmpty(refundAccounts) or #lists.isEmpty(paymentTypes)}" th:text="#{kassa.acceptRefund}"></button></aside></div></fieldset>
<p th:unless="${canWrite}" class="text-muted" th:text="#{kassa.readOnly}"></p>
<dialog id="advance-refund-dialog" class="kassa-confirmation" aria-labelledby="advance-refund-confirm-title"><h2 id="advance-refund-confirm-title" th:text="#{kassa.refundConfirmTitle}"></h2><p th:text="#{kassa.advanceRefundConfirmHint}"></p><strong th:text="|${selected.xeste_adi_soyadi} · ${selected.protokol_kodu}|"></strong><div class="kassa-confirmation-totals mt-3"><div><span th:text="#{kassa.cash}"></span><strong th:text="${cash.kassa_adi}"></strong></div><div><span th:text="#{kassa.advanceNumber}"></span><strong id="advance-refund-confirm-number"></strong></div><div><span th:text="#{kassa.account}"></span><strong id="advance-refund-confirm-account"></strong></div><div><span th:text="#{kassa.paymentTypes}"></span><strong id="advance-refund-confirm-type"></strong></div><div><span th:text="#{kassa.refundTotal}"></span><strong id="advance-refund-confirm-amount"></strong></div></div><div class="d-flex gap-2 mt-4"><button id="advance-refund-no" type="button" class="btn btn-light flex-fill" autofocus th:text="#{common.imtina}"></button><button id="advance-refund-yes" type="button" class="btn btn-danger flex-fill" th:text="#{kassa.confirmAction}"></button></div></dialog>
</form></div></div></div></div>
<script th:inline="javascript">window.AdvanceRefundI18n={select:/*[[#{kassa.advanceRefundStale}]]*/'',amount:/*[[#{kassa.invalidPayment}]]*/'',over:/*[[#{kassa.advanceRefundOver}]]*/'',account:/*[[#{kassa.invalidAccount}]]*/'',currency:/*[[#{kassa.currency}]]*/''};</script><script th:src="@{/custom/js/kassa-advance-refund.js}" defer></script>
</div></body></html>
