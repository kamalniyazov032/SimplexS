<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body>
<div layout:fragment="content" class="content kassa-page kassa-home">
<link rel="stylesheet" th:href="@{/custom/css/kassa-center.css}">
<header class="kassa-hero">
<div class="kassa-hero-copy">
<nav class="kassa-breadcrumb">
<a th:href="@{/dashboard}" th:text="#{kassa.home}">
</a>
<i class="ti ti-chevron-right" aria-hidden="true">
</i>
<span th:text="#{kassa.cash}">
</span>
</nav>
<h1 th:text="#{kassa.title}">
</h1>
<p th:text="#{kassa.subtitle}">
</p>
</div>
<div class="kassa-hero-art" aria-hidden="true">
<svg viewBox="0 0 260 190" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="cash-body" x2="0.8" y2="1">
<stop stop-color="#fff"/>
<stop offset="1" stop-color="#b8d7f8"/>
</linearGradient>
<linearGradient id="cash-blue" x2="1" y2="1">
<stop stop-color="#40a8ff"/>
<stop offset="1" stop-color="#075ce0"/>
</linearGradient>
</defs>
<ellipse cx="133" cy="174" rx="113" ry="12" fill="#b9d7f5" opacity=".4"/>
<path d="M76 47 Q76 33 90 33 H187 Q203 33 199 50 L182 122 H62Z" fill="url(#cash-blue)"/>
<path d="M100 8H166L156 86H88Z" fill="white"/>
<path d="M109 25h39m-42 12h37m-40 12h36m-39 12h33" stroke="#c4d9ee" stroke-width="4"/>
<path d="M58 86Q61 76 73 76H164Q177 76 183 90L216 152H30Z" fill="url(#cash-body)"/>
<rect x="29" y="144" width="188" height="30" rx="8" fill="url(#cash-body)"/>
<path d="M81 87H147L140 109H72Z" fill="#65b9ef" stroke="white" stroke-width="4"/>
<path d="M68 119h18m8 0h18m8 0h18" stroke="#91b8d9" stroke-width="9"/>
<rect x="61" y="150" width="114" height="9" rx="3" fill="#1062d8"/>
</svg>
</div>
</header>
<form method="get" th:action="@{/kassa}" class="kassa-selector">
<div class="kassa-selector-label">
<span class="kassa-wallet">
<i class="ti ti-wallet" aria-hidden="true">
</i>
</span>
<div>
<label for="cash-register" th:text="#{kassa.selectCash}">
</label>
<p th:text="#{kassa.selectCashHint}">
</p>
</div>
</div>
<div class="w-100" style="min-width:0">
<select id="cash-register" name="kassaId" class="form-select select2" th:data-placeholder="#{kassa.selectCash}" th:disabled="${#lists.isEmpty(registers)}" onchange="this.form.requestSubmit()">
<option th:if="${#lists.isEmpty(registers)}" value="" th:text="#{kassa.noCash}">
</option>
<option th:each="c:${registers}" th:value="${c.kassa_id}" th:selected="${c.kassa_id == cashId}" th:text="|${c.kassa_adi} (${c.kassa_kodu})|">
</option>
</select>
</div>
<div class="kassa-selector-note">
<i class="ti ti-info-circle" aria-hidden="true">
</i>
<span th:text="#{kassa.scopeHint}">
</span>
</div>
</form>
<div class="alert alert-warning" th:if="${#lists.isEmpty(registers)}" th:text="#{kassa.noCashHint}">
</div>
<div class="kassa-operation-grid">
<section class="kassa-group kassa-income">
<div class="kassa-group-heading">
<span class="kassa-group-icon">
<i class="ti ti-arrow-down" aria-hidden="true">
</i>
</span>
<div>
<h2 th:text="#{kassa.income}">
</h2>
<p th:text="#{kassa.incomeSubtitle}">
</p>
</div>
</div>
<div class="kassa-actions">
<a class="kassa-action" th:if="${cashId != null}" th:href="@{/kassa/odenis(kassaId=${cashId})}">
<i class="ti ti-users kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.patientPayment}">
</strong>
<small th:text="#{kassa.patientPaymentHint}">
</small>
</span>
<i class="ti ti-chevron-right" aria-hidden="true">
</i>
</a>
<button type="button" class="kassa-action" disabled th:if="${cashId == null}">
<i class="ti ti-users kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.patientPayment}">
</strong>
<small th:text="#{kassa.patientPaymentHint}">
</small>
</span>
</button>
<a class="kassa-action" th:if="${cashId != null}" th:href="@{/kassa/borc(kassaId=${cashId})}">
<i class="ti ti-coins kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.debtPayment}">
</strong>
<small th:text="#{kassa.debtPaymentHint}">
</small>
</span>
<i class="ti ti-chevron-right" aria-hidden="true">
</i>
</a>
<button type="button" class="kassa-action" disabled th:if="${cashId == null}">
<i class="ti ti-coins kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.debtPayment}">
</strong>
<small th:text="#{kassa.debtPaymentHint}">
</small>
</span>
</button>
<button type="button" class="kassa-action" disabled th:title="#{kassa.soon}">
<i class="ti ti-user-plus kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.advance}">
</strong>
<small th:text="#{kassa.advanceHint}">
</small>
</span>
<span class="kassa-soon" th:text="#{kassa.soon}">
</span>
</button>
<button type="button" class="kassa-action" disabled th:title="#{kassa.soon}">
<i class="ti ti-dots kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.otherIncome}">
</strong>
<small th:text="#{kassa.otherIncomeHint}">
</small>
</span>
<span class="kassa-soon" th:text="#{kassa.soon}">
</span>
</button>
</div>
<div class="kassa-group-footer">
<i class="ti ti-info-circle" aria-hidden="true">
</i>
<span th:text="#{kassa.incomeFooter}">
</span>
</div>
</section>
<section class="kassa-group kassa-internal">
<div class="kassa-group-heading">
<span class="kassa-group-icon">
<i class="ti ti-arrows-exchange" aria-hidden="true">
</i>
</span>
<div>
<h2 th:text="#{kassa.internal}">
</h2>
<p th:text="#{kassa.internalSubtitle}">
</p>
</div>
</div>
<div class="kassa-actions">
<button type="button" class="kassa-action" disabled th:title="#{kassa.soon}">
<i class="ti ti-arrows-exchange kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.transfer}">
</strong>
<small th:text="#{kassa.transferHint}">
</small>
</span>
<span class="kassa-soon" th:text="#{kassa.soon}">
</span>
</button>
<button type="button" class="kassa-action" disabled th:title="#{kassa.soon}">
<i class="ti ti-file-invoice kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.receipts}">
</strong>
<small th:text="#{kassa.receiptsHint}">
</small>
</span>
<span class="kassa-soon" th:text="#{kassa.soon}">
</span>
</button>
<button type="button" class="kassa-action" disabled th:title="#{kassa.soon}">
<i class="ti ti-chart-bar kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.reports}">
</strong>
<small th:text="#{kassa.reportsHint}">
</small>
</span>
<span class="kassa-soon" th:text="#{kassa.soon}">
</span>
</button>
</div>
<div class="kassa-group-footer">
<i class="ti ti-info-circle" aria-hidden="true">
</i>
<span th:text="#{kassa.internalFooter}">
</span>
</div>
</section>
<section class="kassa-group kassa-expense">
<div class="kassa-group-heading">
<span class="kassa-group-icon">
<i class="ti ti-arrow-up" aria-hidden="true">
</i>
</span>
<div>
<h2 th:text="#{kassa.expense}">
</h2>
<p th:text="#{kassa.expenseSubtitle}">
</p>
</div>
</div>
<div class="kassa-actions">
<button type="button" class="kassa-action" disabled th:title="#{kassa.soon}">
<i class="ti ti-rotate-2 kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.refund}">
</strong>
<small th:text="#{kassa.refundHint}">
</small>
</span>
<span class="kassa-soon" th:text="#{kassa.soon}">
</span>
</button>
<button type="button" class="kassa-action" disabled th:title="#{kassa.soon}">
<i class="ti ti-user-minus kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.advanceRefund}">
</strong>
<small th:text="#{kassa.advanceRefundHint}">
</small>
</span>
<span class="kassa-soon" th:text="#{kassa.soon}">
</span>
</button>
<button type="button" class="kassa-action" disabled th:title="#{kassa.soon}">
<i class="ti ti-circle-minus kassa-action-icon" aria-hidden="true">
</i>
<span class="kassa-action-copy">
<strong th:text="#{kassa.otherExpense}">
</strong>
<small th:text="#{kassa.otherExpenseHint}">
</small>
</span>
<span class="kassa-soon" th:text="#{kassa.soon}">
</span>
</button>
</div>
<div class="kassa-group-footer">
<i class="ti ti-info-circle" aria-hidden="true">
</i>
<span th:text="#{kassa.expenseFooter}">
</span>
</div>
</section>
</div>
</div>
</body>
</html>
