<!DOCTYPE html><html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content" class="content kassa-page"><link rel="stylesheet" th:href="@{/custom/css/kassa-center.css}"><div class="kassa-work-heading"><div><a th:href="@{/kassa/qebzler(kassaId=${cashId})}" th:text="#{kassa.receiptBack}"></a><h1 th:text="${receipt.emeliyyat_no}"></h1><p th:text="${cash.kassa_adi}"></p></div><a class="btn btn-primary" target="_blank" rel="noopener" th:href="@{/kassa/qebzler/{id}/cap(id=${receiptId},kassaId=${cashId})}" th:text="#{kassa.receiptPrint}"></a></div><div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div><section class="kassa-panel p-4"><dl class="row"><dt class="col-sm-4" th:text="#{kassa.date}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['emeliyyat_tarixi']}"></dd><dt class="col-sm-4" th:text="#{kassa.receiptDirection}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['istiqamet']}"></dd><dt class="col-sm-4" th:text="#{kassa.receiptOperation}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['emeliyyat_kodu']}"></dd><dt class="col-sm-4" th:text="#{kassa.account}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['muhasibat_kodu_adi']}"></dd><dt class="col-sm-4" th:text="#{kassa.receiptAmount}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['mebleg']}"></dd><dt class="col-sm-4" th:text="#{kassa.receiptPatient}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['xeste_adi_soyadi']}"></dd><dt class="col-sm-4" th:text="#{kassa.patientCard}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['xeste_kodu']}"></dd><dt class="col-sm-4" th:text="#{kassa.receiptProtocol}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['protokol_kodu']}"></dd><dt class="col-sm-4" th:text="#{kassa.transferSender}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['gonderen_kassa_adi']}"></dd><dt class="col-sm-4" th:text="#{kassa.transferRecipient}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['qebul_eden_kassa_adi']}"></dd><dt class="col-sm-4" th:text="#{kassa.receiptReference}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['istinad_emeliyyat_id']}"></dd><dt class="col-sm-4" th:text="#{kassa.receiptCashier}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['yaradan_personal_adi']}"></dd><dt class="col-sm-4" th:text="#{kassa.note}"></dt><dd class="col-sm-8 text-break" th:text="${receipt['aciqlama']}"></dd><dt class="col-sm-4" th:text="#{kassa.status}"></dt><dd class="col-sm-8" th:text="${paper.status}"></dd><dt class="col-sm-4" th:text="#{kassa.receiptCancelReason}"></dt><dd class="col-sm-8" th:text="${paper.legv_sebebi}"></dd></dl><div th:replace="~{fragments/kassa-receipt-lines :: lines}"></div></section>
<form th:if="${canCancel}" id="receipt-cancel-form" method="post" th:action="@{/kassa/qebzler/{id}/legv(id=${receiptId})}" class="kassa-panel p-4"><input type="hidden" name="kassaId" th:value="${cashId}"><input type="hidden" name="paymentToken" th:value="${cancelToken}"><label for="receipt-reason" class="form-label" th:text="#{kassa.receiptCancelReason}"></label><textarea id="receipt-reason" name="reason" class="form-control mb-3" maxlength="1000" required rows="2"></textarea><button id="receipt-cancel-submit" type="submit" class="btn btn-danger" th:text="#{kassa.receiptCancel}"></button>
<dialog id="receipt-cancel-dialog" class="kassa-confirmation" aria-labelledby="receipt-cancel-title"><h2 id="receipt-cancel-title" th:text="#{kassa.receiptCancelConfirm}"></h2><p th:text="${receipt.transfer_id != null} ? #{kassa.receiptCancelTransferHint} : #{kassa.receiptCancelHint}"></p><strong th:text="|${receipt.emeliyyat_no} · ${receipt.mebleg}|"></strong><p id="receipt-confirm-reason" class="text-break mt-3"></p><div class="d-flex gap-2"><button id="receipt-cancel-no" type="button" class="btn btn-light" autofocus th:text="#{common.imtina}"></button><button id="receipt-cancel-yes" type="button" class="btn btn-danger" th:text="#{kassa.confirmAction}"></button></div></dialog></form>
<script th:src="@{/custom/js/kassa-receipts.js}" defer></script></div></body></html>
