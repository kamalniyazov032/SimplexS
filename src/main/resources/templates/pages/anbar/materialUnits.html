<!DOCTYPE html><html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content" class="content">
<div class="d-flex align-items-center gap-3 mb-3"><a class="btn btn-light" th:href="@{/anbar/materiallar}" th:text="#{warehouse.back}"></a><h4 class="mb-0" th:text="${pageTitle}"></h4></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><section class="card"><div class="card-body"><h5 th:text="#{warehouse.materialUnits}"></h5><form method="post" th:action="@{/anbar/materiallar/{id}/vahidler(id=${id})}"><div class="table-responsive"><table class="table table-bordered align-middle"><thead><tr><th th:text="#{common.select}"></th><th th:text="#{warehouse.unit}"></th><th th:text="#{warehouse.mainFactor}"></th><th th:text="#{warehouse.order_number}"></th></tr></thead><tbody><tr th:each="u:${units}" th:with="e=${existing[u.id]},locked=${e!=null and (e.ana_vahiddir or !e.deyisdirile_biler)}"><td><input type="checkbox" class="form-check-input" th:name="'unit_'+${u.id}" value="true" th:checked="${e!=null and e.aktiv}" th:disabled="${locked}" th:aria-label="${u.ad}"></td><td><span th:text="${u.ad}"></span> <span th:if="${e!=null and e.ana_vahiddir}" class="badge bg-primary-subtle text-primary" th:text="#{warehouse.mainUnit}"></span></td><td><input class="form-control" type="number" min="0.00000001" step="any" th:name="'factor_'+${u.id}" th:value="${e!=null?e.ana_vahide_emsal:1}" th:disabled="${locked}" th:aria-label="#{warehouse.mainFactor}"></td><td><input class="form-control" type="number" th:name="'order_'+${u.id}" th:value="${e!=null?e.sira_no:null}" th:disabled="${locked}" th:aria-label="#{warehouse.order_number}"></td></tr></tbody></table></div><button class="btn btn-primary mt-3" th:text="#{qaime.save}"></button></form></div></section></div></body></html>
