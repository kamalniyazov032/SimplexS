<!DOCTYPE html><html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content" class="content">
<div class="d-flex align-items-center gap-3 mb-3"><a class="btn btn-light" th:href="@{/anbar/anbarlar}" th:text="#{warehouse.back}"></a><h4 class="mb-0" th:text="${pageTitle}"></h4></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><section class="card"><div class="card-body"><h5 th:text="#{warehouse.groups}"></h5><form method="post" th:action="@{/anbar/anbarlar/{id}/settings/groups(id=${id})}"><input type="hidden" name="il" th:value="${il}"><div class="row g-2"><div class="col-md-4" th:each="row:${groups}"><label class="form-check"><input class="form-check-input" type="checkbox" th:name="'group_'+${row.mehsul_qrupu_id}" value="true" th:checked="${row.secilib}"><span class="form-check-label" th:text="${row.qrup_adi}"></span></label></div></div><button class="btn btn-primary mt-3" th:text="#{qaime.save}"></button></form></div></section><section class="card"><div class="card-body"><h5 th:text="#{warehouse.responsible}"></h5><form method="post" th:action="@{/anbar/anbarlar/{id}/settings/people(id=${id})}"><input type="hidden" name="il" th:value="${il}"><div class="row g-2"><div class="col-md-4" th:each="row:${people}"><label class="form-check"><input class="form-check-input" type="checkbox" th:name="'person_'+${row.personal_id}" value="true" th:checked="${row.secilib}"><span class="form-check-label" th:text="${row.personal_adi}"></span></label></div></div><button class="btn btn-primary mt-3" th:text="#{qaime.save}"></button></form></div></section><section class="card"><div class="card-body"><h5 th:text="#{warehouse.monthLocks}"></h5><form method="get" class="d-flex gap-2 mb-3"><label class="form-label" th:text="#{qaime.year}"></label><input class="form-control w-auto" type="number" min="1900" max="9999" name="il" th:value="${il}" required><button class="btn btn-light" th:text="#{qaime.search}"></button></form>
<form method="post" th:action="@{/anbar/anbarlar/{id}/settings/months(id=${id})}"><input type="hidden" name="il" th:value="${il}"><div class="row g-2"><div class="col-md-3" th:each="row:${months}"><label class="form-check"><input class="form-check-input" type="checkbox" th:name="'month_'+${row.ay}" value="true" th:checked="${row.kilidlidir}"><span class="form-check-label" th:text="${row.ay_adi}"></span></label></div></div><button class="btn btn-primary mt-3" th:text="#{qaime.save}"></button></form></div></section>
<section class="card"><div class="card-body"><h5 th:text="#{warehouse.bulkLocks}"></h5><form method="post" th:action="@{/anbar/anbarlar/bulk-month}" th:data-confirm="#{warehouse.bulkConfirm}"><div class="row g-2"><div class="col-md-3"><label class="form-label" th:text="#{qaime.year}"></label><input class="form-control" type="number" name="il" min="1900" max="9999" th:value="${il}" required></div><div class="col-md-3"><label class="form-label" th:text="#{warehouse.month}"></label><select class="form-select" name="ay"><option th:each="row:${months}" th:value="${row.ay}" th:text="${row.ay_adi}"></option></select></div><div class="col-md-3"><label class="form-label" th:text="#{common.status}"></label><select class="form-select" name="kilidlidir"><option value="true" th:text="#{warehouse.lock}"></option><option value="false" th:text="#{warehouse.unlock}"></option></select></div></div><button class="btn btn-primary mt-3" th:text="#{qaime.save}"></button></form></div></section></div></body></html>
