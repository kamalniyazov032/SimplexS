<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body><div layout:fragment="content">
  <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-4">
    <div><h4 class="mb-1"><i class="ti ti-bed text-primary me-2"></i>Yataqlar</h4><p class="text-muted mb-0">Bina, mərtəbə, palata və yataqların idarəsi</p></div>
    <div class="d-flex gap-2">
      <button th:if="${@access.hasPermission(#authentication, selectedKlinikaId, 'MERTEBE_YARAT')}" th:disabled="${selectedBinaId == null}" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newFloor" title="Əvvəl bina seçin"><i class="ti ti-layers-intersect me-1"></i>Yeni mərtəbə</button>
      <button th:if="${@access.hasPermission(#authentication, selectedKlinikaId, 'PALATA_YARAT')}" th:disabled="${selectedMertebeId == null}" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newRoom" title="Əvvəl mərtəbə seçin"><i class="ti ti-door-enter me-1"></i>Yeni palata</button>
      <button th:if="${@access.hasPermission(#authentication, selectedKlinikaId, 'YATAQ_YARAT')}" th:disabled="${selectedPalataId == null}" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#newBed" title="Əvvəl palata seçin"><i class="ti ti-bed me-1"></i>Yeni yataq</button>
    </div>
  </div>
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible"><span th:text="${successMessage}"></span><button class="btn-close" data-bs-dismiss="alert"></button></div><div th:if="${errorMessage}" class="alert alert-danger alert-dismissible"><span th:text="${errorMessage}"></span><button class="btn-close" data-bs-dismiss="alert"></button></div>

  <div class="card border-0 shadow-sm mb-3"><div class="card-body"><form method="get" th:action="@{/yataqlar}" class="row g-2 align-items-end">
    <div class="col-md-5"><label class="form-label">Bina</label><select class="form-select" name="binaId" required><option value="">Bina seçin</option><option th:each="b:${binalar}" th:value="${b.binaId}" th:text="${b.binaAdi}" th:selected="${b.binaId==selectedBinaId}"></option></select></div>
    <div class="col-md-3"><label class="form-label">Status</label><select class="form-select" name="status"><option value="aktiv" th:selected="${status=='aktiv'}">Aktiv</option><option value="passiv" th:selected="${status=='passiv'}">Passiv</option><option value="hamisi" th:selected="${status=='hamisi'}">Hamısı</option></select></div>
    <div class="col-md-2"><label class="form-label">Şöbə filtri</label><select class="form-select" name="sobeId"><option value="">Bütün şöbələr</option><option th:each="s:${sobeler}" th:value="${s.sobeId}" th:text="${s.sobeAdi}" th:selected="${s.sobeId==selectedSobeId}"></option></select></div>
    <div class="col-md-2"><button class="btn btn-primary w-100"><i class="ti ti-filter me-1"></i>Tətbiq et</button></div>
  </form></div></div>

  <div class="row g-3">
    <div class="col-xl-3"><div class="card border-0 shadow-sm h-100"><div class="card-header d-flex justify-content-between"><h6 class="mb-0">1. Mərtəbələr</h6><span class="badge bg-primary-subtle text-primary" th:text="${#lists.size(mertebeler)}"></span></div><div class="list-group list-group-flush">
      <a th:each="m:${mertebeler}" class="list-group-item list-group-item-action" th:classappend="${m.id==selectedMertebeId}?'active':''" th:href="@{/yataqlar(binaId=${selectedBinaId},mertebeId=${m.id},status=${status},sobeId=${selectedSobeId})}"><div class="d-flex justify-content-between"><strong th:text="${m.ad}"></strong><span th:text="|№ ${m.nomre}|"></span></div><small th:text="${m.aktiv}?'Aktiv':'Passiv'"></small></a>
      <div th:if="${#lists.isEmpty(mertebeler)}" class="text-center text-muted py-5">Mərtəbə yoxdur</div>
    </div><div th:if="${selectedMertebe != null and @access.hasPermission(#authentication, selectedKlinikaId, 'MERTEBE_YENILE')}" class="card-footer"><button class="btn btn-sm btn-outline-primary w-100" data-bs-toggle="modal" data-bs-target="#editFloor">Mərtəbəni redaktə et</button></div></div></div>

    <div class="col-xl-4"><div class="card border-0 shadow-sm h-100"><div class="card-header d-flex justify-content-between"><h6 class="mb-0">2. Palatalar</h6><span class="badge bg-info-subtle text-info" th:text="${#lists.size(palatalar)}"></span></div><div class="list-group list-group-flush">
      <a th:each="p:${palatalar}" class="list-group-item list-group-item-action" th:classappend="${p.id==selectedPalataId}?'active':''" th:href="@{/yataqlar(binaId=${selectedBinaId},mertebeId=${selectedMertebeId},palataId=${p.id},status=${status},sobeId=${selectedSobeId})}"><div class="d-flex justify-content-between"><strong th:text="${p.ad}"></strong><span class="badge bg-light text-dark" th:text="|Otaq ${p.otaqNomresi}|"></span></div><small th:text="${p.aciqlama ?: (p.aktiv?'Aktiv':'Passiv')}"></small></a>
      <div th:if="${#lists.isEmpty(palatalar)}" class="text-center text-muted py-5">Palata yoxdur</div>
    </div><div th:if="${selectedPalata != null and @access.hasPermission(#authentication, selectedKlinikaId, 'PALATA_YENILE')}" class="card-footer"><button class="btn btn-sm btn-outline-primary w-100" data-bs-toggle="modal" data-bs-target="#editRoom">Palatanı redaktə et</button></div></div></div>

    <div class="col-xl-5"><div class="card border-0 shadow-sm h-100"><div class="card-header d-flex justify-content-between"><h6 class="mb-0">3. Yataqlar</h6><span class="badge bg-success-subtle text-success" th:text="${#lists.size(yataqlar)}"></span></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th class="ps-3">Kod</th><th>Yataq</th><th>Şöbə</th><th>Status</th><th></th></tr></thead><tbody>
      <tr th:each="y:${yataqlar}"><td class="ps-3"><span class="badge bg-light text-dark" th:text="${y.kod}"></span></td><td><strong th:text="${y.ad}"></strong><small class="d-block text-muted" th:text="|${y.palataAdi} · ${y.otaqNomresi}|"></small></td><td th:text="${y.sobeAdi}"></td><td><span class="badge" th:classappend="${y.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${y.aktiv}?'Aktiv':'Passiv'"></span></td><td><button th:if="${@access.hasPermission(#authentication, selectedKlinikaId, 'YATAQ_YENILE')}" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="|#editBed${y.id}|"><i class="ti ti-edit"></i></button></td></tr>
      <tr th:if="${#lists.isEmpty(yataqlar)}"><td colspan="5" class="text-center text-muted py-5">Yataq yoxdur</td></tr>
    </tbody></table></div></div></div></div>
  </div>

  <div class="modal fade" id="newFloor"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/yataqlar/mertebe/yeni}"><input type="hidden" name="binaId" th:value="${selectedBinaId}"><div class="modal-header"><h5>Yeni mərtəbə</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Mərtəbə nömrəsi</label><input class="form-control mb-3" type="number" name="mertebeNo" required><label class="form-label">Mərtəbənin adı</label><input class="form-control" name="ad" placeholder="Məsələn, 2-ci mərtəbə" required></div><div class="modal-footer"><button class="btn btn-primary">Yarat</button></div></form></div></div></div>
  <div th:if="${selectedMertebe != null}" class="modal fade" id="editFloor"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/yataqlar/mertebe/yenile}"><input type="hidden" name="binaId" th:value="${selectedBinaId}"><input type="hidden" name="mertebeId" th:value="${selectedMertebe.id}"><div class="modal-header"><h5>Mərtəbəni redaktə et</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Nömrə</label><input class="form-control mb-3" type="number" name="mertebeNo" th:value="${selectedMertebe.nomre}" required><label class="form-label">Ad</label><input class="form-control mb-3" name="ad" th:value="${selectedMertebe.ad}" required><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="aktiv" value="true" id="floorActive" th:checked="${selectedMertebe.aktiv}"><label class="form-check-label" for="floorActive">Aktiv</label></div></div><div class="modal-footer"><button class="btn btn-primary">Yadda saxla</button></div></form></div></div></div>

  <div class="modal fade" id="newRoom"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/yataqlar/palata/yeni}"><input type="hidden" name="binaId" th:value="${selectedBinaId}"><input type="hidden" name="mertebeId" th:value="${selectedMertebeId}"><div class="modal-header"><h5>Yeni palata</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Otaq nömrəsi</label><input class="form-control mb-3" name="otaqNomresi" required><label class="form-label">Palatanın adı</label><input class="form-control mb-3" name="ad" required><label class="form-label">Açıqlama</label><textarea class="form-control" name="aciqlama"></textarea></div><div class="modal-footer"><button class="btn btn-primary">Yarat</button></div></form></div></div></div>
  <div th:if="${selectedPalata != null}" class="modal fade" id="editRoom"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/yataqlar/palata/yenile}"><input type="hidden" name="binaId" th:value="${selectedBinaId}"><input type="hidden" name="mertebeId" th:value="${selectedMertebeId}"><input type="hidden" name="palataId" th:value="${selectedPalata.id}"><div class="modal-header"><h5>Palatanı redaktə et</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Otaq nömrəsi</label><input class="form-control mb-3" name="otaqNomresi" th:value="${selectedPalata.otaqNomresi}" required><label class="form-label">Ad</label><input class="form-control mb-3" name="ad" th:value="${selectedPalata.ad}" required><label class="form-label">Açıqlama</label><textarea class="form-control mb-3" name="aciqlama" th:text="${selectedPalata.aciqlama}"></textarea><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="aktiv" value="true" id="roomActive" th:checked="${selectedPalata.aktiv}"><label class="form-check-label" for="roomActive">Aktiv</label></div></div><div class="modal-footer"><button class="btn btn-primary">Yadda saxla</button></div></form></div></div></div>

  <div class="modal fade" id="newBed"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/yataqlar/yeni}"><input type="hidden" name="binaId" th:value="${selectedBinaId}"><input type="hidden" name="mertebeId" th:value="${selectedMertebeId}"><input type="hidden" name="palataId" th:value="${selectedPalataId}"><div class="modal-header"><h5>Yeni yataq</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Şöbə</label><select class="form-select mb-3" name="sobeId" required><option value="">Şöbə seçin</option><option th:each="s:${sobeler}" th:value="${s.sobeId}" th:text="${s.sobeAdi}"></option></select><label class="form-label">Kod</label><input class="form-control mb-3" name="kod" required><label class="form-label">Ad</label><input class="form-control mb-3" name="ad" required><label class="form-label">Açıqlama</label><textarea class="form-control" name="aciqlama"></textarea></div><div class="modal-footer"><button class="btn btn-success">Yarat</button></div></form></div></div></div>
  <div th:each="y:${yataqlar}" class="modal fade" th:id="|editBed${y.id}|"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/yataqlar/yenile}"><input type="hidden" name="yataqId" th:value="${y.id}"><input type="hidden" name="binaId" th:value="${selectedBinaId}"><input type="hidden" name="mertebeId" th:value="${selectedMertebeId}"><input type="hidden" name="palataId" th:value="${selectedPalataId}"><div class="modal-header"><h5>Yatağı redaktə et</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Şöbə</label><select class="form-select mb-3" name="sobeId" required><option th:each="s:${sobeler}" th:value="${s.sobeId}" th:text="${s.sobeAdi}" th:selected="${s.sobeId==y.sobeId}"></option></select><label class="form-label">Kod</label><input class="form-control mb-3" name="kod" th:value="${y.kod}" required><label class="form-label">Ad</label><input class="form-control mb-3" name="ad" th:value="${y.ad}" required><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="aktiv" value="true" th:id="|bedActive${y.id}|" th:checked="${y.aktiv}"><label class="form-check-label" th:for="|bedActive${y.id}|">Aktiv</label></div></div><div class="modal-footer"><button class="btn btn-primary">Yadda saxla</button></div></form></div></div></div>
</div></body></html>
