<!doctype html>
<html
  lang="az"
  th:lang="${#locale.language}"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <body>
    <div layout:fragment="content">
      <form
        class="ambulatory-form"
        method="post"
        th:action="${gelis==null?'/ambulatorQebul/yarat':'/ambulatorQebul/yenile'}"
      >
        <input
          th:if="${gelis}"
          type="hidden"
          name="gelisId"
          th:value="${gelis.id}"
        />
        <div class="ambulatory-page-header">
          <div class="ambulatory-heading">
            <a class="ambulatory-back" th:href="@{/ambulatorQebul/siyahi}" th:title="#{common.back}">
              <i class="ti ti-arrow-left"></i>
            </a>
            <div>
            <h4 class="mb-1"
              th:text="${gelis==null?#messages.msg('visits.new'):#messages.msg('patients.edit')}"
            ></h4>
            <p class="mb-0" th:text="#{visits.form_subtitle}"></p>
            </div>
          </div>
          <div class="ambulatory-actions">
            <a
              class="btn btn-outline-primary"
              th:href="@{/ambulatorQebul/siyahi}"
            ><i class="ti ti-list-details"></i><span th:text="#{visits.list}"></span></a
            ><button
              class="btn btn-primary"
            ><i class="ti ti-device-floppy"></i><span th:text="#{common.yadda_saxla}"></span></button>
          </div>
        </div>
        <div class="card ambulatory-card mb-4">
          <div class="card-body">
            <h6 class="ambulatory-section-title">
              <span class="ambulatory-step">1</span><span th:text="#{visits.choose_patient}"></span>
            </h6>
            <div class="input-group ambulatory-input-group">
              <span class="input-group-text"><i class="ti ti-user-search"></i></span>
              <input
                id="ambulatorSelectedPatient"
                class="form-control"
                readonly
                th:placeholder="#{visits.select_patient}"
                th:value="${gelis!=null?gelis.xesteAd+' '+gelis.xesteSoyad+' · '+gelis.xesteKodu:(selectedXeste!=null?selectedXeste.ad+' · '+selectedXeste.kod+(selectedXeste.meta!=null?' · '+selectedXeste.meta:''):'')}"
              /><button
                th:if="${gelis==null}"
                class="btn btn-outline-primary"
                type="button"
                data-bs-toggle="modal"
                data-bs-target="#patientSelectionModal"
              >
                <i class="ti ti-search"></i>
                <span th:text="#{common.search}"></span>
              </button>
            </div>
            <input
              id="ambulatorPatientId"
              type="hidden"
              name="xesteId"
              th:value="${gelis!=null?gelis.xesteId:(selectedXeste!=null?selectedXeste.id:null)}"
              required
            />
            <div id="ambulatoryPatientCard" class="ambulatory-patient-card" th:classappend="${selectedXeste==null} ? ' d-none'">
              <div class="ambulatory-patient-avatar"><i class="ti ti-user"></i></div>
              <div class="ambulatory-patient-content">
                <div class="ambulatory-patient-name-row">
                  <strong id="ambulatoryPatientName" th:text="${selectedXeste?.ad}"></strong>
                  <span id="ambulatoryPatientStatus" class="badge bg-success-subtle text-success" th:text="${selectedXeste?.aktiv==false} ? #{common.passive} : #{common.active}"></span>
                </div>
                <div class="ambulatory-patient-grid">
                  <div><i class="ti ti-id"></i><span><small th:text="#{patients.document_number}"></small><b id="ambulatoryPatientDocument" th:text="${selectedXeste?.vesiqeNomresi} ?: '-'"></b></span></div>
                  <div><i class="ti ti-calendar"></i><span><small th:text="#{patients.birth_date}"></small><b id="ambulatoryPatientBirthDate" th:text="${selectedXeste?.dogumTarixi} ?: '-'"></b></span></div>
                  <div><i class="ti ti-gender-bigender"></i><span><small th:text="#{patients.gender}"></small><b id="ambulatoryPatientGender" th:text="${selectedXeste?.cinsAdi} ?: '-'"></b></span></div>
                  <div><i class="ti ti-droplet"></i><span><small th:text="#{patients.blood_group}"></small><b id="ambulatoryPatientBlood" th:text="${selectedXeste?.qanQrupuAdi} ?: '-'"></b></span></div>
                  <div><i class="ti ti-phone"></i><span><small th:text="#{patients.mobile}"></small><b id="ambulatoryPatientPhone" th:text="${selectedXeste?.mobilNomre} ?: '-'"></b></span></div>
                  <div><i class="ti ti-building-hospital"></i><span><small th:text="#{patients.organization}"></small><b id="ambulatoryPatientOrganization" th:text="${selectedXeste?.teskilatAdi} ?: '-'"></b></span></div>
                  <div><i class="ti ti-card"></i><span><small th:text="#{patients.social_card}"></small><b id="ambulatoryPatientSocialCard" th:text="${selectedXeste?.sosialKartNomresi} ?: '-'"></b></span></div>
                  <div><i class="ti ti-map-pin"></i><span><small th:text="#{patients.address}"></small><b id="ambulatoryPatientAddress" th:text="${selectedXeste?.unvan} ?: '-'"></b></span></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card ambulatory-card">
          <div class="card-body">
            <h6 class="ambulatory-section-title">
              <span class="ambulatory-step">2</span><span th:text="#{visits.title}"></span>
            </h6>
            <div class="row g-3">
              <div class="col-md-6 ambulatory-field ambulatory-field-select" data-icon="clipboard-text">
                <label class="form-label" th:text="#{visits.type}"></label
                ><i class="ti ti-stethoscope ambulatory-field-icon"></i><select class="form-select select2" name="gelisNovuId" required>
                  <option
                    th:each="o:${gelisNovleri}"
                    th:value="${o.id}"
                    th:text="${o.ad}"
                    th:selected="${gelis!=null and gelis.gelisNovuId==o.id}"
                  ></option>
                </select>
              </div>
              <div class="col-md-6 ambulatory-field ambulatory-field-select" data-icon="building-hospital">
                <label
                  class="form-label"
                  th:text="#{patients.organization}"
                ></label
                ><i class="ti ti-building-bank ambulatory-field-icon"></i><select class="form-select select2" name="teskilatId">
                  <option
                    value=""
                    th:text="#{patients.default_organization}"
                  ></option>
                  <option
                    th:each="o:${teskilatlar}"
                    th:value="${o.id}"
                    th:text="${o.ad}"
                    th:selected="${(gelis!=null and gelis.teskilatId==o.id) or (gelis==null and selectedXeste!=null and selectedXeste.teskilatId==o.id)}"
                  ></option>
                </select>
              </div>
              <div class="col-md-6">
                <div class="row g-3">
                  <div class="col-6 ambulatory-field" data-icon="calendar-event">
                    <label class="form-label" th:text="#{visits.date}"></label>
                    <i class="ti ti-calendar-event ambulatory-field-icon"></i>
                    <input
                            class="form-control"
                            type="date"
                            name="gelisTarixi"
                            required
                            th:value="${gelis!=null?gelis.gelisTarixi:today}"
                    />
                  </div>

                  <div class="col-6 ambulatory-field" data-icon="clock">
                    <label class="form-label" th:text="#{visits.time}"></label>
                    <i class="ti ti-clock ambulatory-field-icon"></i>
                    <input
                            class="form-control"
                            type="time"
                            name="gelisSaati"
                            required
                            th:value="${gelis!=null?gelis.gelisSaati:now}"
                    />
                  </div>
                </div>
              </div>

              <div class="col-md-6 ambulatory-field ambulatory-field-select" data-icon="coin">
                <label class="form-label">Qiymət qrupu</label>
                <i class="ti ti-coin ambulatory-field-icon"></i>
                <select id="qiymetQrupu" class="form-select select2">
                  <option value="">Qiymət qrupu seçin</option>
                </select>
              </div>
              <div class="col-md-6 ambulatory-field ambulatory-field-select" data-icon="user-search">
                <label
                  class="form-label"
                  th:text="#{visits.referring_doctor}"
                ></label
                ><i class="ti ti-user-search ambulatory-field-icon"></i><select class="form-select select2" name="gonderenHekimId">
                  <option value="" th:text="#{common.select}"></option>
                  <option
                    th:each="o:${hekimler}"
                    th:value="${o.id}"
                    th:text="${o.ad}"
                    th:selected="${gelis!=null and gelis.gonderenHekimId==o.id}"
                  ></option>
                </select>
              </div>
              <div class="col-md-6 ambulatory-field">
                <label
                  class="ambulatory-check w-100 d-flex justify-content-between"
                  ><span><i class="ti ti-calendar-check"></i><span th:text="#{visits.appointment}"></span></span
                  ><input
                    class="form-check-input"
                    type="checkbox"
                    name="randevudur"
                    value="true"
                    th:checked="${gelis!=null and gelis.randevudur}"
                /></label>
              </div>
              <div class="col-md-6 ambulatory-field ambulatory-textarea" data-icon="message-circle">
                <label class="form-label" th:text="#{visits.message}"></label
                ><i class="ti ti-message-circle ambulatory-field-icon"></i><textarea
                  class="form-control"
                  name="mesaj"
                  rows="3"
                  maxlength="500"
                  th:placeholder="#{visits.message_placeholder}"
                  th:text="${gelis?.mesaj}"
                ></textarea>
              </div>
              <div class="col-md-6 ambulatory-field ambulatory-textarea" data-icon="note">
                <label
                  class="form-label"
                  th:text="#{visits.description}"
                ></label
                ><i class="ti ti-notes ambulatory-field-icon"></i><textarea
                  class="form-control"
                  name="aciqlama"
                  rows="3"
                  maxlength="1000"
                  th:placeholder="#{visits.description_placeholder}"
                  th:text="${gelis?.aciqlama}"
                ></textarea>
              </div>
              <div th:if="${gelis}" class="col-12">
                <label class="border rounded p-3 d-flex justify-content-between"
                  ><span th:text="#{common.aktiv}"></span
                  ><input
                    class="form-check-input"
                    type="checkbox"
                    name="aktiv"
                    value="true"
                    th:checked="${gelis.aktiv}"
                /></label>
              </div>
            </div>
          </div>
        </div>
        <div class="ambulatory-note" th:if="${gelis==null}">
          <div class="ambulatory-note-icon"><i class="ti ti-info-circle-filled"></i></div>
          <div><h6 th:text="#{common.note}"></h6><p th:text="#{visits.patient_autofill_note}"></p></div>
          <i class="ti ti-medical-cross ambulatory-note-art" aria-hidden="true"></i>
        </div>
      </form>
      <div class="modal fade" id="patientSelectionModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" th:text="#{patients.patient_list}"></h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <div class="row g-2 mb-3">
                <div class="col-md-8">
                  <label
                    class="form-label"
                    th:text="#{patients.search_label}"
                  ></label
                  ><input
                    id="patientModalSearch"
                    class="form-control"
                    th:placeholder="#{patients.search}"
                  />
                </div>
                <div class="col-md-2">
                  <label class="form-label" th:text="#{patients.status}"></label
                  ><select id="patientModalStatus" class="form-select select2">
                    <option value="aktiv" th:text="#{common.active}"></option>
                    <option value="" th:text="#{common.all}"></option>
                    <option value="passiv" th:text="#{common.passive}"></option>
                  </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                  <button
                    id="patientModalSearchButton"
                    type="button"
                    class="btn btn-primary w-100"
                    th:text="#{common.search}"
                  ></button>
                </div>
              </div>
              <div
                id="patientModalHint"
                class="ambulatory-search-hint"
                th:text="#{visits.patient_search_hint}"
                th:data-initial="#{visits.patient_search_hint}"
                th:data-empty="#{patients.empty}"
                th:data-error="#{visits.patient_search_error}"
              ></div>
              <div id="patientModalTable" class="table-responsive ambulatory-patient-results d-none">
                <table class="table table-hover">
                  <thead>
                    <tr>
                      <th th:text="#{patients.patient_code}"></th>
                      <th th:text="#{patients.full_name}"></th>
                      <th th:text="#{patients.document_fin}"></th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="patientModalResults"></tbody>
                </table>
              </div>
              <div id="patientModalPagination" class="ambulatory-search-pagination d-none" th:data-template="#{visits.patient_page_info}">
                <span id="patientModalPageInfo"></span>
                <div class="btn-group">
                  <button id="patientModalPrevious" type="button" class="btn btn-outline-primary btn-sm">
                    <i class="ti ti-arrow-left me-1"></i><span th:text="#{common.previous}"></span>
                  </button>
                  <button id="patientModalNext" type="button" class="btn btn-outline-primary btn-sm">
                    <span th:text="#{common.next}"></span><i class="ti ti-arrow-right ms-1"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
