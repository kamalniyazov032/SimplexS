<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body><div layout:fragment="content">
<div id="patientServiceWorkspace" class="patient-service-workspace" th:data-gelis-id="${gelis.id}">
  <div class="psw-header">
    <div class="d-flex align-items-center gap-3 flex-wrap">
      <a class="btn btn-light psw-close" th:href="@{/ambulatorQebul/siyahi}" th:title="#{common.back}"><i class="ti ti-arrow-left"></i></a>
      <div><h4 class="mb-1" th:text="#{patient_services.title}"></h4><p class="mb-0 text-muted" th:text="#{patient_services.subtitle}"></p></div>
      <span class="psw-patient"><i class="ti ti-user"></i><span th:text="|${gelis.xesteAd} ${gelis.xesteSoyad} · ${gelis.xesteKodu}|"></span></span>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/ambulatorQebul/siyahi}"><i class="ti ti-x me-1"></i><span th:text="#{common.bagla}"></span></a>
  </div>

  <div th:if="${successMessage}" class="alert alert-success"><i class="ti ti-circle-check me-2"></i><span th:text="${successMessage}"></span></div>
  <div th:if="${errorMessage}" class="alert alert-danger"><i class="ti ti-alert-circle me-2"></i><span th:text="${errorMessage}"></span></div>
  <div id="catalogAlert" class="alert alert-danger d-none psw-alert" role="alert"><i class="ti ti-database-exclamation me-2"></i><strong th:text="#{patient_services.catalog_error_title}"></strong><span id="catalogAlertMessage" class="ms-1"></span></div>

  <div class="psw-main">
    <aside class="psw-browser">
      <label class="form-label" for="catalogType" th:text="#{patient_services.catalog_type}"></label>
      <select id="catalogType" class="form-select mb-3">
        <option value="XIDMET" th:text="#{patient_services.services}"></option>
        <option value="PAKET" th:text="#{patient_services.packages}"></option>
        <option value="RUTIN" th:text="#{patient_services.routines}"></option>
      </select>
      <div id="serviceGroups" class="psw-tree">
        <button type="button" class="psw-tree-item active" data-group=""><i class="ti ti-folders"></i><span th:text="#{patient_services.all_groups}"></span></button>
        <button th:each="q:${qruplar}" type="button" class="psw-tree-item" th:classappend="${q.parent_id != null} ? ' d-none'" th:data-group="${q.id}" th:data-parent="${q.parent_id}" th:data-has-children="${q.alt_qrupu_var}" th:style="|--level:${q.seviye}|"><i class="ti" th:classappend="${q.alt_qrupu_var} ? ' ti-chevron-right' : ' ti-point'"></i><span th:text="${q.ad}"></span></button>
      </div>
      <div id="collectionList" class="psw-collections d-none"></div>
      <button id="catalogMore" type="button" class="btn btn-light btn-sm w-100 mt-2 d-none" th:text="#{common.show_more}"></button>
    </aside>

    <section class="psw-catalog">
      <div class="psw-section-head psw-catalog-head">
        <div><h5 id="catalogTitle" class="mb-1" th:text="#{patient_services.services}"></h5><small id="catalogHint" class="text-muted" th:text="#{patient_services.catalog_hint}"></small></div>
        <div class="psw-catalog-tools">
          <div class="input-group input-group-sm"><span class="input-group-text bg-white"><i class="ti ti-search"></i></span><input id="catalogSearch" class="form-control" th:placeholder="#{patient_services.search_placeholder}" th:aria-label="#{patient_services.search_placeholder}" autocomplete="off"></div>
          <span id="catalogCount" class="badge bg-primary-subtle text-primary">0</span>
        </div>
      </div>
      <div id="catalogLoading" class="psw-empty d-none"><span class="spinner-border spinner-border-sm"></span></div>
      <div id="catalogEmpty" class="psw-empty d-none"><i class="ti ti-search-off"></i><span th:text="#{patient_services.not_found}"></span></div>
      <div class="table-responsive psw-catalog-table"><table class="table align-middle mb-0 psw-table psw-service-table"><colgroup><col class="psw-code-col"><col class="psw-name-col"><col class="psw-group-col"><col class="psw-price-col"><col class="psw-action-col"></colgroup><thead><tr><th th:text="#{patient_services.code}"></th><th th:text="#{patient_services.service_name}"></th><th th:text="#{patient_services.group}"></th><th th:text="#{patient_services.price}"></th><th></th></tr></thead><tbody id="catalogBody"></tbody></table></div>
      <div class="psw-pager"><button id="catalogPrevious" type="button" class="btn btn-light btn-sm" disabled><i class="ti ti-chevron-left me-1"></i><span th:text="#{common.previous}"></span></button><span id="catalogPage"></span><button id="catalogNext" type="button" class="btn btn-light btn-sm" disabled><span th:text="#{common.next}"></span><i class="ti ti-chevron-right ms-1"></i></button></div>
    </section>

    <aside class="psw-details">
      <div class="psw-section-head"><div><h5 class="mb-1" th:text="#{patient_services.details}"></h5><small id="detailsName" class="text-muted" th:text="#{patient_services.select_service_hint}"></small></div></div>
      <div id="detailsEmpty" class="psw-empty"><i class="ti ti-adjustments-horizontal"></i><span th:text="#{patient_services.select_service_hint}"></span></div>
      <div id="detailsForm" class="d-none">
        <label class="form-label" for="referringDoctor" th:text="#{visits.referring_doctor}"></label>
        <select id="referringDoctor" class="form-select mb-3" th:data-default-id="${gonderenHekim.gonderen_hekim_id}"><option value="" th:text="#{patient_services.no_referring_doctor}"></option><option th:if="${!#maps.isEmpty(gonderenHekim)}" th:value="${gonderenHekim.gonderen_hekim_id}" th:text="|${gonderenHekim.gonderen_hekim_ad} ${gonderenHekim.gonderen_hekim_soyad} ${gonderenHekim.gonderen_hekim_ata_adi ?: ''}|" selected></option></select>
        <label class="form-label" for="requestingDoctor" th:text="#{patient_services.requesting_doctor}"></label>
        <select id="requestingDoctor" class="form-select mb-3"><option value="" th:text="#{common.secin}"></option><option th:each="h:${isteyenHekimler}" th:value="${h.hekim_id}" th:text="|${h.hekim_ad} ${h.hekim_soyad} ${h.hekim_ata_adi ?: ''}|"></option></select>
        <label class="form-label" for="serviceDepartment" th:text="#{patient_services.department}"></label><select id="serviceDepartment" class="form-select mb-3"><option value="" th:text="#{common.secin}"></option></select>
        <label class="form-label" for="performingDoctor" th:text="#{patient_services.performing_doctor}"></label><select id="performingDoctor" class="form-select mb-3" disabled><option value="" th:text="#{common.secin}"></option></select>
        <div class="row g-2"><div class="col-6"><label class="form-label" for="serviceQuantity" th:text="#{patient_services.quantity}"></label><input id="serviceQuantity" type="number" min="1" value="1" class="form-control"></div><div class="col-6"><label class="form-label d-block" th:text="#{patient_services.urgent}"></label><label class="psw-switch"><input id="serviceUrgent" type="checkbox"><span th:text="#{patient_services.urgent_service}"></span></label></div></div>
        <label class="form-label mt-3" for="serviceNote" th:text="#{common.note}"></label><textarea id="serviceNote" class="form-control" rows="2" th:placeholder="#{patient_services.note_placeholder}"></textarea>
      </div>
    </aside>
  </div>

  <form id="selectedForm" method="post" th:action="@{/xeste-xidmetleri/{id}/yarat(id=${gelis.id})}" class="psw-selected">
    <input type="hidden" name="xidmetlerJson" id="servicesJson"><input type="hidden" name="aciqlama" value="">
    <div class="psw-section-head"><div><h5 class="mb-1" th:text="#{patient_services.selected}"></h5><small class="text-muted" th:text="#{patient_services.selected_hint}"></small></div><span id="selectedCount" class="badge bg-primary">0</span></div>
    <div id="selectedEmpty" class="psw-empty psw-empty-small"><i class="ti ti-basket"></i><span th:text="#{patient_services.none_selected}"></span></div>
    <div class="table-responsive psw-selected-table"><table id="selectedTable" class="table align-middle mb-0 psw-table d-none"><thead><tr><th>#</th><th th:text="#{patient_services.code}"></th><th th:text="#{patient_services.service_name}"></th><th th:text="#{patient_services.quantity}"></th><th th:text="#{patient_services.price}"></th><th th:text="#{patient_services.total}"></th><th th:text="#{patient_services.department}"></th><th th:text="#{patient_services.performing_doctor}"></th><th></th></tr></thead><tbody id="selectedBody"></tbody><tfoot><tr><td colspan="5"></td><td colspan="4"><strong th:text="#{patient_services.grand_total}"></strong> <strong id="grandTotal" class="text-primary ms-2">0.00 AZN</strong></td></tr></tfoot></table></div>
    <div class="psw-submit"><a class="btn btn-light" th:href="@{/ambulatorQebul/siyahi}" th:text="#{common.legv_et}"></a><button id="saveServices" class="btn btn-success" disabled><i class="ti ti-device-floppy me-1"></i><span th:text="#{patient_services.save}"></span></button></div>
  </form>
</div>
<div id="patientServiceI18n" hidden th:data-add="#{patient_services.add}" th:data-remove="#{patient_services.remove}" th:data-edit="#{patients.edit}" th:data-page="#{patient_services.page}" th:data-load-error="#{patient_services.load_error}" th:data-select="#{common.secin}" th:data-selection-required="#{patient_services.selection_required}" th:data-no-department="#{patient_services.no_department}" th:data-currency="#{patient_services.currency}"></div>
<script th:src="@{/custom/js/patient-services.js}"></script>
</div></body></html>
