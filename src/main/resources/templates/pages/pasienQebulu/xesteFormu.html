<!doctype html>
<html
  lang="az"
  th:lang="${#locale.language}"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <body>
    <div layout:fragment="content">
      <form
        class="patient-registration-page"
        method="post"
        th:action="${xeste==null?'/xeste-qeydiyyati/yeni':'/xeste-qeydiyyati/yenile'}"
      >
        <input
          th:if="${xeste}"
          type="hidden"
          name="xesteId"
          th:value="${xeste.id}"
        />
        <input
          th:if="${xeste==null and returnTo!=null}"
          type="hidden"
          name="returnTo"
          th:value="${returnTo}"
        />
        <div
          class="patient-registration-header d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3"
        >
          <div>
            <h4
              class="mb-1"
              th:text="${xeste==null?#messages.msg('patients.registration'):#messages.msg('patients.edit')}"
            ></h4>
            <p
              class="text-muted mb-0"
              th:text="${xeste==null?#messages.msg('patients.new_hint'):xeste.kod+' · '+xeste.tamAd()}"
            ></p>
          </div>
          <div class="d-flex gap-2">
            <a
              class="btn btn-outline-primary"
              th:href="@{/xeste-qeydiyyati/siyahi}"
              ><i class="ti ti-list me-1"></i
              ><span th:text="#{patients.patient_list}"></span></a
            ><button class="btn btn-primary">
              <i class="ti ti-device-floppy me-1"></i
              ><span th:text="#{common.yadda_saxla}"></span>
            </button>
          </div>
        </div>
        <div
          class="patient-registration-form"
        >
          <div class="row g-3">
            <section class="col-xl-6 patient-section">
              <h6>
                <i class="ti ti-user"></i><span>1.</span
                ><span th:text="#{patients.personal_info}"></span>
              </h6>
              <div class="row g-3">
                <div class="col-md-4">
                  <label
                    class="form-label required"
                    th:text="#{patients.first_name}"
                  ></label
                  ><input
                    class="form-control"
                    name="ad"
                    required
                    maxlength="100"
                    th:value="${xeste?.ad}"
                  />
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label required"
                    th:text="#{patients.last_name}"
                  ></label
                  ><input
                    class="form-control"
                    name="soyad"
                    required
                    maxlength="100"
                    th:value="${xeste?.soyad}"
                  />
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label"
                    th:text="#{patients.father_name}"
                  ></label
                  ><input
                    class="form-control"
                    name="ataAdi"
                    maxlength="100"
                    th:value="${xeste?.ataAdi}"
                  />
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label required"
                    th:text="#{patients.gender}"
                  ></label
                  ><select class="form-select select2" name="cinsId" required>
                    <option value="" th:text="#{common.select}"></option>
                    <option
                      th:each="o:${cinsler}"
                      th:value="${o.id}"
                      th:text="${o.ad}"
                      th:selected="${xeste!=null and xeste.cinsId==o.id}"
                    ></option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label required"
                    th:text="#{patients.birth_date}"
                  ></label
                  ><input
                    class="form-control"
                    type="date"
                    name="dogumTarixi"
                    required
                    th:value="${xeste?.dogumTarixi}"
                  />
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label"
                    th:text="#{patients.blood_group}"
                  ></label
                  ><select class="form-select select2" name="qanQrupuId">
                    <option value="" th:text="#{common.select}"></option>
                    <option
                      th:each="o:${qanQruplari}"
                      th:value="${o.id}"
                      th:text="${o.ad}"
                      th:selected="${xeste!=null and xeste.qanQrupuId==o.id}"
                    ></option>
                  </select>
                </div>
              </div>
            </section>
            <section class="col-xl-6 patient-section">
              <h6>
                <i class="ti ti-id-badge"></i><span>2.</span
                ><span th:text="#{patients.document_info}"></span>
              </h6>
              <div class="row g-3">
                <div class="col-md-5">
                  <label
                    class="form-label required"
                    th:text="#{patients.document_type}"
                  ></label
                  ><select class="form-select select2" name="vesiqeNovuId" required>
                    <option value="" th:text="#{common.select}"></option>
                    <option
                      th:each="o:${vesiqeNovleri}"
                      th:value="${o.id}"
                      th:text="${o.ad}"
                      th:selected="${xeste!=null and xeste.vesiqeNovuId==o.id}"
                    ></option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label required"
                    th:text="#{patients.document_number}"
                  ></label
                  ><input
                    class="form-control text-uppercase"
                    name="vesiqeNomresi"
                    required
                    th:value="${xeste?.vesiqeNomresi}"
                  />
                </div>
                <div class="col-md-3">
                  <label
                    class="form-label required"
                    th:text="#{patients.fin}"
                  ></label
                  ><input
                    class="form-control text-uppercase"
                    name="finKodu"
                    required
                    maxlength="20"
                    th:value="${xeste?.finKodu}"
                  />
                </div>
              </div>
            </section>
            <section class="col-xl-6 patient-section">
              <h6>
                <i class="ti ti-phone"></i><span>3.</span
                ><span th:text="#{patients.contact_work}"></span>
              </h6>
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label" th:text="#{patients.mobile}"></label
                  ><input
                    class="form-control"
                    name="mobilNomre"
                    th:value="${xeste?.mobilNomre}"
                  />
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label"
                    th:text="#{patients.second_mobile}"
                  ></label
                  ><input
                    class="form-control"
                    name="ikinciMobilNomre"
                    th:value="${xeste?.ikinciMobilNomre}"
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label" th:text="#{patients.email}"></label
                  ><input
                    class="form-control"
                    type="email"
                    name="email"
                    th:value="${xeste?.email}"
                  />
                </div>
              </div>
            </section>
            <section class="col-xl-6 patient-section">
              <h6>
                <i class="ti ti-map-pin"></i><span>4.</span
                ><span th:text="#{patients.address_info}"></span>
              </h6>
              <div class="row g-3">
                <div class="col-md-4">
                  <label
                    class="form-label"
                    th:text="#{patients.country}"
                  ></label
                  ><select
                    class="form-select select2 js-country"
                    name="olkeId"
                    data-city="#livingCity"
                  >
                    <option value="" th:text="#{common.select}"></option>
                    <option
                      th:each="o:${olkeler}"
                      th:value="${o.id}"
                      th:text="${o.ad}"
                      th:selected="${xeste!=null and xeste.olkeId==o.id}"
                    ></option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label" th:text="#{patients.city}"></label
                  ><select class="form-select select2" id="livingCity" name="seherId">
                    <option value="" th:text="#{common.select}"></option>
                    <option
                      th:each="o:${seherler}"
                      th:value="${o.id}"
                      th:text="${o.ad}"
                      th:data-parent="${o.parentId}"
                      th:selected="${xeste!=null and xeste.seherId==o.id}"
                    ></option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label"
                    th:text="#{patients.address}"
                  ></label
                  ><input
                    class="form-control"
                    name="unvan"
                    th:value="${xeste?.unvan}"
                  />
                </div>
                <div class="col-md-6">
                  <label
                    class="form-label"
                    th:text="#{patients.birth_country}"
                  ></label
                  ><select
                    class="form-select select2 js-country"
                    name="dogulduguOlkeId"
                    data-city="#birthCity"
                  >
                    <option value="" th:text="#{common.select}"></option>
                    <option
                      th:each="o:${olkeler}"
                      th:value="${o.id}"
                      th:text="${o.ad}"
                      th:selected="${xeste!=null and xeste.dogulduguOlkeId==o.id}"
                    ></option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label
                    class="form-label"
                    th:text="#{patients.birth_city}"
                  ></label
                  ><select
                    class="form-select select2"
                    id="birthCity"
                    name="dogulduguSeherId"
                  >
                    <option value="" th:text="#{common.select}"></option>
                    <option
                      th:each="o:${seherler}"
                      th:value="${o.id}"
                      th:text="${o.ad}"
                      th:data-parent="${o.parentId}"
                      th:selected="${xeste!=null and xeste.dogulduguSeherId==o.id}"
                    ></option>
                  </select>
                </div>
              </div>
            </section>
            <section class="col-xl-6 patient-section">
              <h6>
                <i class="ti ti-info-circle"></i><span>5.</span
                ><span th:text="#{patients.additional_info}"></span>
              </h6>
              <div class="row g-3">
                <div class="col-md-4">
                  <label
                    class="form-label"
                    th:text="#{patients.marital_status}"
                  ></label
                  ><select class="form-select select2" name="aileVeziyyetiId">
                    <option value="" th:text="#{common.select}"></option>
                    <option
                      th:each="o:${aileVeziyyetleri}"
                      th:value="${o.id}"
                      th:text="${o.ad}"
                      th:selected="${xeste!=null and xeste.aileVeziyyetiId==o.id}"
                    ></option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label"
                    th:text="#{patients.education}"
                  ></label
                  ><select class="form-select select2" name="tehsilId">
                    <option value="" th:text="#{common.select}"></option>
                    <option
                      th:each="o:${tehsiller}"
                      th:value="${o.id}"
                      th:text="${o.ad}"
                      th:selected="${xeste!=null and xeste.tehsilId==o.id}"
                    ></option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label"
                    th:text="#{patients.social_card}"
                  ></label
                  ><input
                    class="form-control"
                    name="sosialKartNomresi"
                    th:value="${xeste?.sosialKartNomresi}"
                  />
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label"
                    th:text="#{patients.workplace}"
                  ></label
                  ><input
                    class="form-control"
                    name="isYeri"
                    th:value="${xeste?.isYeri}"
                  />
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label"
                    th:text="#{patients.position}"
                  ></label
                  ><input
                    class="form-control"
                    name="vezifesi"
                    th:value="${xeste?.vezifesi}"
                  />
                </div>
                <div class="col-md-4">
                  <label
                    class="form-label"
                    th:text="#{patients.profession}"
                  ></label
                  ><input
                    class="form-control"
                    name="pesesi"
                    th:value="${xeste?.pesesi}"
                  />
                </div>
              </div>
            </section>
            <section class="col-xl-6 patient-section">
              <h6>
                <i class="ti ti-building-bank"></i><span>6.</span
                ><span th:text="#{patients.organization}"></span>
              </h6>
              <label
                class="form-label required"
                th:text="#{patients.default_organization}"
              ></label
              ><select class="form-select select2" name="defaultTeskilatId" required>
                <option value="" th:text="#{common.select}"></option>
                <option
                  th:each="o:${teskilatlar}"
                  th:value="${o.id}"
                  th:text="${o.ad}"
                  th:selected="${xeste!=null and xeste.defaultTeskilatId==o.id}"
                ></option></select
              ><label
                th:if="${xeste}"
                class="border rounded p-3 d-flex justify-content-between align-items-center mt-3 mb-0"
                ><span
                  class="fw-semibold"
                  th:text="#{patients.active_card}"
                ></span
                ><span class="form-check form-switch mb-0"
                  ><input
                    class="form-check-input"
                    type="checkbox"
                    name="aktiv"
                    value="true"
                    th:checked="${xeste.aktiv}" /></span
              ></label>
            </section>
            <section class="col-12 patient-section patient-note-section">
              <h6>
                <i class="ti ti-note"></i><span>7.</span
                ><span th:text="#{patients.note}"></span>
              </h6>
              <textarea
                class="form-control"
                name="qeyd"
                rows="3"
                maxlength="500"
                th:text="${xeste?.qeyd}"
                th:placeholder="#{patients.note}"
              ></textarea>
            </section>
          </div>
        </div>
      </form>
      <script>
        document.addEventListener("DOMContentLoaded", () =>
          document.querySelectorAll(".js-country").forEach((country) => {
            const city = document.querySelector(country.dataset.city);
            const filter = () =>
              [...city.options].forEach((option, index) => {
                if (index)
                  option.hidden =
                    !!country.value && option.dataset.parent !== country.value;
              });
            country.addEventListener("change", () => {
              city.value = "";
              filter();
            });
            filter();
          }),
        );
      </script>
      <style>
        .patient-registration-form > .row {
          align-items: stretch;
        }
        .patient-registration-form .patient-section {
          position: relative;
          padding: 18px;
          background: var(--bs-body-bg);
          border: 1px solid var(--bs-border-color);
          border-radius: 8px;
          box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
          overflow: hidden;
        }

        .patient-registration-form .patient-section::before {
          content: "";
          position: absolute;
          left: 0;
          top: 14px;
          bottom: 14px;
          width: 4px;
          background: #0d6efd;
          border-radius: 0 4px 4px 0;
        }
        .patient-registration-form h6 {
          display: flex;
          align-items: center;
          gap: 7px;
          font-weight: 700;
          margin-bottom: 14px;
        }
        .patient-registration-form h6 i {
          color: var(--bs-primary);
          font-size: 1.25rem;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 34px;
          height: 34px;
          border-radius: 8px;
          background: rgba(var(--bs-primary-rgb), 0.1);
        }
        .patient-registration-form .required:after {
          content: " *";
          color: var(--bs-danger);
        }
        .patient-registration-form .form-label {
          margin-bottom: 5px;
          font-size: 0.8125rem;
          font-weight: 600;
        }
        .patient-registration-form .form-control,
        .patient-registration-form .form-select,

        .patient-registration-form .form-control::placeholder {
          color: color-mix(
            in srgb,
            var(--bs-secondary-color) 90%,
            var(--bs-body-color)
          );
          opacity: 1;
        }
        .patient-registration-form
          .select2-container
          .select2-selection--single
          .select2-selection__rendered {
          color: color-mix(
            in srgb,
            var(--bs-secondary-color) 75%,
            var(--bs-body-color)
          );
          font-weight: 400;
        }

        @media (min-width: 1200px) and (min-height: 780px) {
          .patient-registration-page {
            display: flex;
            flex-direction: column;
            height: calc(100vh - var(--topbar-height) - 3rem);
          }
          .patient-registration-header {
            flex: 0 0 auto;
          }
          .patient-registration-form {
            flex: 1 1 auto;
            min-height: 0;
          }
          .patient-registration-form > .row {
            display: grid;
            height: 100%;
            margin: 0;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows:
              minmax(max-content, 1.08fr)
              minmax(max-content, 1fr)
              minmax(max-content, 0.9fr)
              minmax(118px, max-content);
            gap: 12px;
          }
          .patient-registration-form > .row > .patient-section {
            width: auto;
            max-width: none;
            min-height: 0;
            margin: 0;
          }
          .patient-registration-form > .row > .patient-note-section {
            grid-column: 1 / -1;
          }
          .patient-registration-form .patient-section {
            padding: 12px 16px;
          }
          .patient-registration-form h6 {
            margin-bottom: 8px;
          }
          .patient-registration-form h6 i {
            width: 30px;
            height: 30px;
          }
          .patient-registration-form .row.g-3 {
            --bs-gutter-y: 0.6rem;
            --bs-gutter-x: 1rem;
          }
          .patient-registration-form textarea.form-control {
            height: calc(100% - 47px);
            min-height: 42px;
            resize: none;
          }
        }
        @media (max-width: 1199.98px) {
          .patient-registration-form .patient-section {
            min-height: auto;
          }
        }
      </style>
    </div>
  </body>
</html>
