<!DOCTYPE html><html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content">
<link rel="stylesheet" th:href="@{/custom/css/patient-services-all.css}">
<div id="allServices" class="psa" th:data-gelis-id="${gelis.id}">
<header><div><h3 th:text="#{patient_services.title}"></h3><p th:text="#{patient_services.all_subtitle}"></p></div><a id="allClose" class="btn btn-outline-secondary" th:href="@{/ambulatorQebul/siyahi}" th:text="#{common.bagla}"></a></header>
<div class="psa-patient"><div class="psa-avatar"><i class="ti ti-user"></i></div><div class="flex-grow-1"><strong th:text="|${gelis.xesteSoyad} ${gelis.xesteAd} ${gelis.xesteAtaAdi ?: ''}|"></strong><p th:text="|${gelis.xesteKodu} · ${gelis.mobilNomre ?: ''}|"></p></div><div><small th:text="#{patient_services.visit}"></small><strong th:text="${gelis.protokolKodu}"></strong></div><div><small th:text="#{patient_services.visit_date}"></small><strong th:text="|${gelis.gelisTarixi} ${gelis.gelisSaati}|"></strong></div><span class="badge bg-success-subtle text-success" th:text="${gelis.aktiv} ? #{common.aktiv} : #{common.passiv}"></span></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><div id="allError" class="alert alert-danger d-none" role="alert"></div>
<div class="psa-toolbar"><nav id="allTabs"><button type="button" class="btn btn-light" data-tab="services" th:text="#{patient_services.services}"></button><button type="button" class="btn btn-light" data-tab="packages" th:text="#{patient_services.packages}"></button><button type="button" class="btn btn-light" data-tab="routines" th:text="#{patient_services.routines}"></button><button type="button" class="btn btn-light" data-tab="history" th:text="#{patient_services.history}"></button><button type="button" class="btn btn-light" data-tab="finance" th:text="#{patient_services.finance}"></button></nav><div><a class="btn btn-primary" th:href="@{/xeste-xidmetleri/{id}(id=${gelis.id})}" th:text="#{patient_services.add}"></a> <button id="groupRequests" type="button" class="btn btn-outline-primary" aria-pressed="false" th:text="#{patient_services.group_request}"></button></div></div>
<div class="psa-filters"><input id="allSearch" class="form-control" th:placeholder="#{patient_services.search_placeholder}" th:aria-label="#{patient_services.search_placeholder}"><label><span th:text="#{patient_services.status}"></span><select id="filter-status" class="form-select"><option value="" th:text="#{patient_services.all_filter}"></option></select></label><label><span th:text="#{patient_services.type}"></span><select id="filter-type" class="form-select"><option value="" th:text="#{patient_services.all_filter}"></option></select></label><label><span th:text="#{patient_services.department}"></span><select id="filter-department" class="form-select"><option value="" th:text="#{patient_services.all_filter}"></option></select></label><label><span th:text="#{patient_services.doctor}"></span><select id="filter-doctor" class="form-select"><option value="" th:text="#{patient_services.all_filter}"></option></select></label><button id="clearFilters" class="btn btn-outline-secondary" th:text="#{patient_services.clear}"></button></div>
<div class="table-responsive"><table class="table table-bordered align-middle psa-table"><thead><tr><th>#</th><th th:text="#{patient_services.request}"></th><th th:text="#{patient_services.service_name}"></th><th th:text="#{patient_services.date}"></th><th th:text="#{patient_services.department}"></th><th th:text="#{patient_services.quantity}"></th><th th:text="#{patient_services.price}"></th><th th:text="#{patient_services.total}"></th><th th:text="#{visits.referring_doctor}"></th><th th:text="#{patient_services.requesting_doctor}"></th><th th:text="#{patient_services.performing_doctor}"></th><th th:text="#{patient_services.status}"></th><th th:text="#{common.emeliyyat}"></th></tr></thead><tbody id="allBody"></tbody></table></div><p id="allEmpty" class="p-4 text-center d-none" th:text="#{patient_services.not_found}"></p><div class="psa-totals"><span><span th:text="#{patient_services.count}"></span>: <strong id="allCount"></strong></span><strong><span th:text="#{patient_services.grand_total}"></span>: <span id="allTotal"></span></strong></div><div id="financeSummary" class="psa-totals d-none"></div><footer><button type="button" id="export-print" class="btn btn-outline-primary" th:text="#{patient_services.print}"></button> <button type="button" id="export-excel" class="btn btn-outline-primary" th:text="#{patient_services.excel}"></button> <button type="button" id="export-pdf" class="btn btn-outline-primary" th:text="#{patient_services.pdf}"></button> </footer><form id="allCsrf" method="post" th:action="@{/xeste-xidmetleri/{id}/yarat(id=${gelis.id})}" hidden></form>
<dialog id="serviceDialog"><button id="closeDetails" class="btn btn-light float-end" th:text="#{common.bagla}"></button><h4 th:text="#{patient_services.details}"></h4><dl id="serviceInfo"></dl></dialog></div><div id="allI18n" hidden th:data-all-filter="#{patient_services.all_filter}" th:data-load-error="#{patient_services.load_error}" th:data-currency="#{patient_services.currency}" th:data-view="#{patient_services.view}" th:data-remove="#{patient_services.remove}" th:data-cancel-confirm="#{patient_services.cancel_confirm}" th:data-request="#{patient_services.request}" th:data-patient-amount="#{patient_services.patient_amount}" th:data-organization-amount="#{patient_services.organization_amount}" th:data-date="#{patient_services.date}" th:data-service-name="#{patient_services.service_name}" th:data-department="#{patient_services.department}" th:data-quantity="#{patient_services.quantity}" th:data-price="#{patient_services.price}" th:data-total="#{patient_services.total}" th:data-status="#{patient_services.status}" th:data-note="#{patient_services.note}" th:data-locked="#{patient_services.locked}" th:data-requesting-doctor="#{patient_services.requesting_doctor}" th:data-performing-doctor="#{patient_services.performing_doctor}" th:data-edit="#{patients.edit}" th:data-referring-doctor="#{visits.referring_doctor}"></div><script th:src="@{/custom/js/patient-services-all.js}"></script></div></body></html>
