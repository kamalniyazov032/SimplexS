<!DOCTYPE html><html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><div><h4 class="mb-1"><i class="ti ti-id text-primary me-2"></i><span th:text="#{patients.title}"></span></h4><p class="text-muted mb-0" th:text="#{patients.subtitle}"></p></div><div class="d-flex gap-2"><button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#patientFilter" aria-controls="patientFilter"><i class="ti ti-filter me-1"></i><span th:text="#{common.filter}"></span><span th:if="${filterApplied}" class="badge bg-white text-primary ms-2" th:text="#{common.aktiv}"></span></button><button class="btn btn-primary js-new-patient" type="button" data-bs-toggle="modal" data-bs-target="#newPatientModal"><i class="ti ti-user-plus me-1"></i><span th:text="#{patients.new}"></span></button></div></div>
<div class="offcanvas offcanvas-top offcanvas-top_ka shadow-lg" tabindex="-1" id="patientFilter" style="--bs-offcanvas-height:190px!important;height:190px!important;min-height:190px!important;max-height:190px!important"><div class="offcanvas-header border-bottom bg-light py-3"><h5 class="mb-0 fw-bold text-primary"><i class="ti ti-filter me-2"></i><span th:text="#{patients.search_label}"></span></h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas" th:aria-label="#{common.bagla}"></button></div><div class="offcanvas-body py-3"><form method="get" th:action="@{/xeste-qeydiyyati}" class="row g-2 align-items-end"><div class="col-xl-3 col-md-6"><label class="form-label small text-muted" th:text="#{common.axtaris}"></label><div class="input-group"><span class="input-group-text bg-light"><i class="ti ti-search"></i></span><input class="form-control" name="q" th:value="${q}" th:placeholder="#{patients.search}"></div></div><div class="col-xl-3 col-md-6"><label class="form-label small text-muted" th:text="#{patients.organization}"></label><select class="form-select select2" name="teskilatId" th:data-placeholder="#{common.select}"><option value="" th:text="#{common.all}"></option><option th:each="o:${teskilatlar}" th:value="${o.id}" th:text="${o.ad}" th:selected="${o.id==selectedTeskilatId}"></option></select></div><div class="col-xl-2 col-md-6"><label class="form-label small text-muted" th:text="#{common.status}"></label><select class="form-select" name="status"><option value="aktiv" th:selected="${selectedStatus=='aktiv'}" th:text="#{common.aktiv}"></option><option value="passiv" th:selected="${selectedStatus=='passiv'}" th:text="#{common.passiv}"></option><option value="" th:selected="${selectedStatus==''}" th:text="#{common.all}"></option></select></div><div class="col-xl-1 col-md-6"><label class="form-label small text-muted" th:text="#{patients.page_size}"></label><select class="form-select" name="size"><option value="25" th:selected="${selectedSize==25}">25</option><option value="50" th:selected="${selectedSize==50}">50</option><option value="100" th:selected="${selectedSize==100}">100</option></select></div><div class="col-xl-3 col-md-6"><div class="d-flex gap-2"><button class="btn btn-primary flex-fill"><i class="ti ti-search me-1"></i><span th:text="#{common.axtar}"></span></button><a class="btn btn-light flex-fill" th:href="@{/xeste-qeydiyyati}" th:text="#{common.temizle}"></a></div></div></form></div></div>
<div th:if="${successMessage}" class="alert alert-success border-0 shadow-sm"><i class="ti ti-circle-check me-2"></i><span th:text="${successMessage}"></span></div><div th:if="${errorMessage}" class="alert alert-danger border-0 shadow-sm"><i class="ti ti-alert-circle me-2"></i><span th:text="${errorMessage}"></span></div>
<div th:replace="~{pages/pasienQebulu/xesteYeniModal :: modal}"></div>
<div class="modal fade" id="ambulatoryRegistrationModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><div><h5 class="modal-title"><i class="ti ti-stethoscope text-primary me-2"></i><span th:text="#{patients.ambulatory_registration}"></span></h5><small class="text-muted patient-registration-context"></small></div><button class="btn-close" type="button" data-bs-dismiss="modal" th:aria-label="#{common.bagla}"></button></div><div class="modal-body text-center text-muted py-5"><i class="ti ti-clipboard-medical fs-1 d-block mb-2"></i><span th:text="#{patients.registration_form_pending}"></span></div></div></div></div>
<div class="card border-0 shadow-sm overflow-hidden">
<div class="card-header bg-light py-2 d-flex justify-content-between"><span class="small text-muted" th:text="#{patients.result_count(${count})}"></span><span class="badge bg-primary-subtle text-primary" th:text="#{patients.l_card}"></span></div><div class="table-responsive"><table class="table table-hover align-middle mb-0 patient-table"><thead><tr><th class="ps-3" th:text="#{patients.card_code}"></th><th th:text="#{patients.patient}"></th><th th:text="#{patients.document_fin}"></th><th th:text="#{patients.birth_gender}"></th><th th:text="#{patients.contact}"></th><th th:text="#{patients.organization}"></th><th th:text="#{common.status}"></th><th></th></tr></thead><tbody><tr th:each="x:${xesteler}"><td class="ps-3"><span class="badge bg-primary-subtle text-primary" th:text="${x.kod}"></span></td><td><div class="d-flex gap-2 align-items-center"><span class="avatar avatar-sm bg-light text-primary rounded-circle"><i class="ti ti-user"></i></span><div><div class="fw-semibold" th:text="${x.tamAd()}"></div><small class="text-muted" th:text="${x.sosialKartNomresi?:''}"></small></div></div></td><td><div th:text="${x.vesiqeNomresi?:'—'}"></div><small class="text-muted" th:text="${x.finKodu?:'—'}"></small></td><td><div th:text="${x.dogumTarixi!=null?#temporals.format(x.dogumTarixi,'dd.MM.yyyy'):'—'}"></div><small class="text-muted" th:text="${x.cinsAdi?:'—'}"></small></td><td><div th:text="${x.mobilNomre?:'—'}"></div><small class="text-muted" th:text="${x.email?:''}"></small></td><td th:text="${x.defaultTeskilatAdi?:'—'}"></td><td><span class="badge" th:classappend="${x.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${x.aktiv}?#{common.aktiv}:#{common.passiv}"></span></td><td class="text-end pe-3"><button type="button" class="btn btn-sm btn-outline-primary js-edit-patient" data-bs-toggle="modal" data-bs-target="#newPatientModal" th:title="#{patients.edit}" th:data-xeste-id="${x.id}" th:data-default-teskilat-id="${x.defaultTeskilatId}" th:data-ad="${x.ad}" th:data-soyad="${x.soyad}" th:data-ata-adi="${x.ataAdi}" th:data-vesiqe-novu-id="${x.vesiqeNovuId}" th:data-vesiqe-nomresi="${x.vesiqeNomresi}" th:data-fin-kodu="${x.finKodu}" th:data-cins-id="${x.cinsId}" th:data-dogum-tarixi="${x.dogumTarixi}" th:data-aile-veziyyeti-id="${x.aileVeziyyetiId}" th:data-tehsil-id="${x.tehsilId}" th:data-doguldugu-olke-id="${x.dogulduguOlkeId}" th:data-doguldugu-seher-id="${x.dogulduguSeherId}" th:data-olke-id="${x.olkeId}" th:data-seher-id="${x.seherId}" th:data-qan-qrupu-id="${x.qanQrupuId}" th:data-mobil-nomre="${x.mobilNomre}" th:data-ikinci-mobil-nomre="${x.ikinciMobilNomre}" th:data-email="${x.email}" th:data-sosial-kart-nomresi="${x.sosialKartNomresi}" th:data-is-yeri="${x.isYeri}" th:data-vezifesi="${x.vezifesi}" th:data-pesesi="${x.pesesi}" th:data-unvan="${x.unvan}" th:data-qeyd="${x.qeyd}" th:data-aktiv="${x.aktiv}"><i class="ti ti-edit"></i></button></td></tr><tr th:if="${#lists.isEmpty(xesteler)}"><td colspan="8" class="text-center text-muted py-5"><i class="ti ti-user-search fs-2 d-block mb-2"></i><span th:text="#{patients.empty}"></span></td></tr></tbody></table></div>
<div th:if="${hasNext}" class="card-footer bg-white d-flex justify-content-center"><a class="btn btn-sm btn-outline-primary" th:href="@{/xeste-qeydiyyati(q=${q},status=${selectedStatus},teskilatId=${selectedTeskilatId},size=${selectedSize},cursor=${nextCursor})}"><span th:text="#{patients.next_records}"></span><i class="ti ti-chevron-right ms-1"></i></a></div></div>
<script>document.addEventListener('DOMContentLoaded',()=>document.querySelectorAll('.js-edit-patient').forEach(edit=>{const button=document.createElement('button');button.type='button';button.className='btn btn-sm btn-outline-info me-1';button.dataset.bsToggle='modal';button.dataset.bsTarget='#ambulatoryRegistrationModal';button.textContent='A';button.addEventListener('click',()=>{const target=document.querySelector(button.dataset.bsTarget);target.querySelector('.patient-registration-context').textContent=[edit.dataset.ad,edit.dataset.soyad,'· L '+edit.dataset.xesteId].filter(Boolean).join(' ')});edit.before(button)}));</script><style>.patient-table thead th{font-size:.78rem;color:var(--bs-secondary-color);background:var(--bs-tertiary-bg)}.patient-table tbody td{padding-top:12px;padding-bottom:12px}</style></div></body></html>
