<!doctype html>
<html
  lang="az"
  th:lang="${#locale.language}"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/main}"
>
  <body>
    <div layout:fragment="content">
      <div
        class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3"
      >
        <div>
          <h4 class="mb-1" th:text="#{patients.patient_list}"></h4>
          <p class="text-muted mb-0">
            <span th:text="#{patients.title}"></span
            ><i class="ti ti-chevron-right mx-2"></i
            ><span th:text="#{patients.patient_list}"></span>
          </p>
        </div>
        <div class="d-flex gap-2">
          <button
            class="btn btn-outline-primary"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#patientListFilter"
            aria-controls="patientListFilter"
          >
            <i class="ti ti-filter me-1"></i
            ><span th:text="#{common.filter}"></span></button
          ><a class="btn btn-outline-primary" th:href="@{/xeste-qeydiyyati}"
            ><i class="ti ti-plus me-1"></i
            ><span th:text="#{patients.new_patient}"></span
          ></a>
        </div>
      </div>
      <div
        th:if="${successMessage}"
        class="alert alert-success border-0 shadow-sm"
        th:text="${successMessage}"
      ></div>
      <div
        th:if="${errorMessage}"
        class="alert alert-danger border-0 shadow-sm"
        th:text="${errorMessage}"
      ></div>
      <div
        class="offcanvas offcanvas-top offcanvas-top_ka shadow-lg"
        tabindex="-1"
        id="patientListFilter"
        style="
          --bs-offcanvas-height: 310px !important;
          height: 310px !important;
          min-height: 310px !important;
          max-height: 310px !important;
        "
      >
        <div class="offcanvas-header border-bottom bg-light py-3">
          <h5 class="mb-0 fw-bold text-primary">
            <i class="ti ti-filter me-2"></i
            ><span th:text="#{patients.search_label}"></span>
          </h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
            th:aria-label="#{common.bagla}"
          ></button>
        </div>
        <div class="offcanvas-body py-3">
          <form method="get" th:action="@{/xeste-qeydiyyati/siyahi}">
            <div class="row g-3 align-items-end">
              <div class="col-xl-3 col-md-6">
                <label
                  class="form-label small text-muted"
                  th:text="#{common.axtaris}"
                ></label>
                <div class="input-group">
                  <input
                    class="form-control"
                    name="q"
                    th:value="${q}"
                    th:placeholder="#{patients.search}"
                  /><span class="input-group-text"
                    ><i class="ti ti-search"></i
                  ></span>
                </div>
              </div>
              <div class="col-xl-2 col-md-6">
                <label
                  class="form-label small text-muted"
                  th:text="#{patients.patient_code}"
                ></label
                ><input
                  class="form-control"
                  name="xesteKodu"
                  th:value="${xesteKodu}"
                />
              </div>
              <div class="col-xl-2 col-md-6">
                <label
                  class="form-label small text-muted"
                  th:text="#{patients.document_type}"
                ></label
                ><select class="form-select select2" name="vesiqeNovuId">
                  <option value="" th:text="#{common.hamisi}"></option>
                  <option
                    th:each="o:${vesiqeNovleri}"
                    th:value="${o.id}"
                    th:text="${o.ad}"
                    th:selected="${o.id==selectedVesiqeNovuId}"
                  ></option>
                </select>
              </div>
              <div class="col-xl-2 col-md-6">
                <label
                  class="form-label small text-muted"
                  th:text="#{patients.organization}"
                ></label
                ><select class="form-select select2" name="teskilatId">
                  <option value="" th:text="#{common.hamisi}"></option>
                  <option
                    th:each="o:${teskilatlar}"
                    th:value="${o.id}"
                    th:text="${o.ad}"
                    th:selected="${o.id==selectedTeskilatId}"
                  ></option>
                </select>
              </div>
              <div class="col-xl-3 col-md-6">
                <label
                  class="form-label small text-muted"
                  th:text="#{common.status}"
                ></label
                ><select class="form-select select2" name="status">
                  <option
                    value="aktiv"
                    th:selected="${selectedStatus=='aktiv'}"
                    th:text="#{common.aktiv}"
                  ></option>
                  <option
                    value="passiv"
                    th:selected="${selectedStatus=='passiv'}"
                    th:text="#{common.passiv}"
                  ></option>
                  <option
                    value=""
                    th:selected="${selectedStatus==''}"
                    th:text="#{common.hamisi}"
                  ></option>
                </select>
              </div>
              <div class="col-xl-2 col-md-6">
                <label
                  class="form-label small text-muted"
                  th:text="#{patients.gender}"
                ></label
                ><select class="form-select select2" name="cinsId">
                  <option value="" th:text="#{common.hamisi}"></option>
                  <option
                    th:each="o:${cinsler}"
                    th:value="${o.id}"
                    th:text="${o.ad}"
                    th:selected="${o.id==selectedCinsId}"
                  ></option>
                </select>
              </div>
              <div class="col-xl-3 col-md-6">
                <label
                  class="form-label small text-muted"
                  th:text="#{patients.birth_date_range}"
                ></label>
                <div class="d-flex gap-2">
                  <input
                    class="form-control"
                    type="date"
                    name="dogumBaslangic"
                    th:value="${dogumBaslangic}"
                    th:title="#{patients.start_date}"
                  /><input
                    class="form-control"
                    type="date"
                    name="dogumBitme"
                    th:value="${dogumBitme}"
                    th:title="#{patients.end_date}"
                  />
                </div>
              </div>
              <div class="col-xl-2 col-md-6">
                <label
                  class="form-label small text-muted"
                  th:text="#{patients.country}"
                ></label
                ><select class="form-select select2 js-list-country" name="olkeId">
                  <option value="" th:text="#{common.hamisi}"></option>
                  <option
                    th:each="o:${olkeler}"
                    th:value="${o.id}"
                    th:text="${o.ad}"
                    th:selected="${o.id==selectedOlkeId}"
                  ></option>
                </select>
              </div>
              <div class="col-xl-2 col-md-6">
                <label
                  class="form-label small text-muted"
                  th:text="#{patients.city}"
                ></label
                ><select class="form-select select2" name="seherId" id="listCity">
                  <option value="" th:text="#{common.hamisi}"></option>
                  <option
                    th:each="o:${seherler}"
                    th:value="${o.id}"
                    th:text="${o.ad}"
                    th:data-parent="${o.parentId}"
                    th:selected="${o.id==selectedSeherId}"
                  ></option>
                </select>
              </div>
              <div class="col-xl-3 col-md-6">
                <div class="d-flex gap-2">
                  <a
                    class="btn btn-light flex-fill"
                    th:href="@{/xeste-qeydiyyati/siyahi}"
                    ><i class="ti ti-x me-1"></i
                    ><span th:text="#{common.temizle}"></span></a
                  ><button class="btn btn-primary flex-fill">
                    <i class="ti ti-search me-1"></i
                    ><span th:text="#{common.axtar}"></span>
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card border-0 shadow-sm overflow-hidden">
        <div class="card-header bg-white py-3">
          <strong th:text="#{patients.result_count(${count})}"></strong>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 patient-list-table">
            <thead>
              <tr>
                <th>#</th>
                <th th:text="#{patients.patient_code}"></th>
                <th th:text="#{visits.patient}"></th>
                <th th:text="#{patients.birth_date}"></th>
                <th th:text="#{patients.gender}"></th>
                <th th:text="#{patients.fin}"></th>
                <th th:text="#{patients.document_number}"></th>
                <th th:text="#{patients.mobile}"></th>
                <th th:text="#{patients.organization}"></th>
                <th th:text="#{common.status}"></th>
                <th th:text="#{patients.actions}"></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="x,i:${xesteler}">
                <td th:text="${i.count}"></td>
                <td>
                  <a
                    class="fw-semibold text-primary"
                    th:href="@{/xeste-qeydiyyati/{id}(id=${x.id})}"
                    th:text="${x.kod}"
                  ></a>
                </td>
                <td><div class="d-flex align-items-center gap-3"><span class="avatar patient-avatar rounded-circle" th:classappend="${i.index%4==0}?'bg-primary-subtle text-primary':(${i.index%4==1}?'bg-success-subtle text-success':(${i.index%4==2}?'bg-warning-subtle text-warning':'bg-info-subtle text-info'))" th:text="${#strings.substring(x.ad,0,1)}">A</span><div><a class="fw-semibold text-dark" th:href="@{/xeste-qeydiyyati/{id}(id=${x.id})}" th:text="|${x.ad} ${x.soyad}|"></a><small class="d-block text-muted" th:text="${x.ataAdi?:'—'}"></small></div></div></td>
                <td><div class="d-flex align-items-center gap-2"><i class="ti ti-calendar fs-5 text-muted"></i><span th:text="${x.dogumTarixi!=null?#temporals.format(x.dogumTarixi,'dd.MM.yyyy'):'—'}"></span></div></td>
                <td><span class="badge bg-light text-dark"><i class="ti ti-user me-1 text-muted"></i><span th:text="${x.cinsAdi?:'—'}"></span></span></td>
                <td><span class="fw-medium" th:text="${x.finKodu?:'—'}"></span></td>
                <td><div class="d-flex align-items-center gap-2"><i class="ti ti-id fs-5 text-muted"></i><span th:text="${x.vesiqeNomresi?:'—'}"></span></div></td>
                <td><div class="d-flex align-items-center gap-2"><i class="ti ti-phone fs-5 text-muted"></i><span th:text="${x.mobilNomre?:'—'}"></span></div></td>
                <td><div class="d-flex align-items-center gap-2"><i class="ti ti-building-hospital fs-5 text-muted"></i><span th:text="${x.defaultTeskilatAdi?:'—'}"></span></div></td>
                <td>
                  <span
                    class="badge"
                    th:classappend="${x.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'"
                    th:text="${x.aktiv}?#{common.aktiv}:#{common.passiv}"
                  ></span>
                </td>
                <td><div class="d-flex gap-1">
                  <a
                    th:if="${x.aktiv}"
                    class="btn btn-sm btn-outline-success"
                    th:href="@{/ambulatorQebul/yeni(xesteId=${x.id})}"
                    th:title="#{visits.new_card}"
                    ><i class="ti ti-stethoscope"></i
                  ></a>
                  <a
                    class="btn btn-sm btn-outline-primary"
                    th:href="@{/xeste-qeydiyyati/{id}(id=${x.id})}"
                    th:title="#{patients.edit}"
                    ><i class="ti ti-edit"></i
                  ></a>
                </div></td>
              </tr>
              <tr th:if="${#lists.isEmpty(xesteler)}">
                <td
                  colspan="11"
                  class="text-center text-muted py-5"
                  th:text="#{patients.empty}"
                ></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div
          class="card-footer bg-white d-flex justify-content-between align-items-center"
        >
          <select class="form-select form-select-sm select2 w-auto" disabled>
            <option th:text="${selectedSize}"></option></select
          ><a
            th:if="${hasNext}"
            class="btn btn-sm btn-outline-primary"
            th:href="@{/xeste-qeydiyyati/siyahi(q=${q},xesteKodu=${xesteKodu},vesiqeNovuId=${selectedVesiqeNovuId},status=${selectedStatus},teskilatId=${selectedTeskilatId},cinsId=${selectedCinsId},dogumBaslangic=${dogumBaslangic},dogumBitme=${dogumBitme},olkeId=${selectedOlkeId},seherId=${selectedSeherId},size=${selectedSize},cursor=${nextCursor})}"
            ><span th:text="#{patients.next_records}"></span
            ><i class="ti ti-chevron-right ms-1"></i
          ></a>
        </div>
      </div>
      <script>
        document.addEventListener("DOMContentLoaded", () => {
          const country = document.querySelector(".js-list-country"),
            city = document.getElementById("listCity");
          const filter = () =>
            [...city.options].forEach((option, index) => {
              if (index)
                option.hidden =
                  !!country.value && option.dataset.parent !== country.value;
            });
          country.addEventListener("change", () => {
            city.value = "";
            filter();
          });
          filter();
        });
      </script>
      <style>
        .patient-list-table {
          white-space: nowrap;
        }
        .patient-list-table thead th {
          font-size: 0.78rem;
          color: var(--bs-secondary-color);
          background: var(--bs-tertiary-bg);
        }
        .patient-list-table td,
        .patient-list-table th {
          padding: 0.8rem;
        }
        .patient-list-table tbody tr { height: 4.75rem; }
        .patient-list-table .patient-avatar { width: 2.75rem; height: 2.75rem; flex: 0 0 2.75rem; font-size: 1rem; font-weight: 700; }
        .patient-list-table tbody tr { transition: background-color .15s ease; }
      </style>
    </div>
  </body>
</html>
