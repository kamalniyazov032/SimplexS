<!DOCTYPE html><html lang="az" xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="modal" class="modal fade" id="newPatientModal" tabindex="-1" aria-hidden="true" th:data-create-title="#{patients.new}" th:data-edit-title="#{patients.edit}" th:data-create-action="@{/xeste-qeydiyyati/yeni}" th:data-edit-action="@{/xeste-qeydiyyati/yenile}"><div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><form id="patientModalForm" method="post" th:action="@{/xeste-qeydiyyati/yeni}"><input type="hidden" name="xesteId" disabled>
<div class="modal-header"><div class="d-flex align-items-center gap-3"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-user-plus fs-4"></i></span><div><h5 class="modal-title mb-1" id="patientModalTitle" th:text="#{patients.new}"></h5><small class="text-muted" th:text="#{patients.new_hint}"></small></div></div><button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{common.bagla}"></button></div>
<div class="modal-body py-3"><div class="row g-2 compact-patient-form">
<div class="col-12"><h6 class="text-primary border-bottom pb-2 mb-1"><i class="ti ti-user me-1"></i><span th:text="#{patients.personal_info}"></span></h6></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.first_name}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-user"></i></span><input class="form-control" name="ad" required maxlength="100" th:placeholder="#{patients.first_name}"></div></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.last_name}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-user"></i></span><input class="form-control" name="soyad" required maxlength="100" th:placeholder="#{patients.last_name}"></div></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.father_name}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-user"></i></span><input class="form-control" name="ataAdi" maxlength="100" th:placeholder="#{patients.father_name}"></div></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.birth_date}"></label><input class="form-control" type="date" name="dogumTarixi" required></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.gender}"></label><select class="form-select select2" name="cinsId" required th:data-placeholder="#{common.select}"><option value="" th:text="#{common.select}"></option><option th:each="o:${cinsler}" th:value="${o.id}" th:text="${o.ad}"></option></select></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.blood_group}"></label><select class="form-select select2" name="qanQrupuId" th:data-placeholder="#{common.select}"><option value="" th:text="#{common.select}"></option><option th:each="o:${qanQruplari}" th:value="${o.id}" th:text="${o.ad}"></option></select></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.marital_status}"></label><select class="form-select select2" name="aileVeziyyetiId" th:data-placeholder="#{common.select}"><option value="" th:text="#{common.select}"></option><option th:each="o:${aileVeziyyetleri}" th:value="${o.id}" th:text="${o.ad}"></option></select></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.education}"></label><select class="form-select select2" name="tehsilId" th:data-placeholder="#{common.select}"><option value="" th:text="#{common.select}"></option><option th:each="o:${tehsiller}" th:value="${o.id}" th:text="${o.ad}"></option></select></div>
<div class="col-12 mt-3"><h6 class="text-primary border-bottom pb-2 mb-1"><i class="ti ti-id-badge me-1"></i><span th:text="#{patients.document_info}"></span></h6></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.organization}"></label><select class="form-select select2" name="defaultTeskilatId" required th:data-placeholder="#{common.select}"><option value="" th:text="#{common.select}"></option><option th:each="o:${teskilatlar}" th:value="${o.id}" th:text="${o.ad}"></option></select></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.document_type}"></label><select class="form-select select2" name="vesiqeNovuId" required th:data-placeholder="#{common.select}"><option value="" th:text="#{common.select}"></option><option th:each="o:${vesiqeNovleri}" th:value="${o.id}" th:text="${o.ad}"></option></select></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.document_number}"></label><input class="form-control" name="vesiqeNomresi" required></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.fin}"></label><input class="form-control text-uppercase" name="finKodu" required maxlength="20"></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.mobile}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-phone"></i></span><input class="form-control" name="mobilNomre" th:placeholder="#{patients.mobile}"></div></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.second_mobile}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-phone"></i></span><input class="form-control" name="ikinciMobilNomre" th:placeholder="#{patients.second_mobile}"></div></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.email}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-mail"></i></span><input class="form-control" type="email" name="email" th:placeholder="#{patients.email}"></div></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.social_card}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-credit-card"></i></span><input class="form-control" name="sosialKartNomresi" th:placeholder="#{patients.social_card}"></div></div>
<div class="col-12 mt-3"><button class="btn btn-light w-100 text-start" type="button" data-bs-toggle="collapse" data-bs-target="#patientExtraFields" aria-expanded="true"><i class="ti ti-chevron-down me-2"></i><span th:text="#{patients.address_info}"></span> / <span th:text="#{patients.contact_work}"></span></button></div>
<div class="col-12 collapse show" id="patientExtraFields"><div class="row g-2 pt-2">
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.birth_country}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-world"></i></span><select class="form-select select2 js-modal-country" name="dogulduguOlkeId" data-city="#modalBirthCity" th:data-placeholder="#{common.select}"><option value="" th:text="#{common.select}"></option><option th:each="o:${olkeler}" th:value="${o.id}" th:text="${o.ad}"></option></select></div></div><div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.birth_city}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-building-community"></i></span><select class="form-select select2" id="modalBirthCity" name="dogulduguSeherId" th:data-placeholder="#{common.select}"><option value="" th:text="#{common.select}"></option><option th:each="o:${seherler}" th:value="${o.id}" th:text="${o.ad}" th:data-parent="${o.parentId}"></option></select></div></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.country}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-world"></i></span><select class="form-select select2 js-modal-country" name="olkeId" data-city="#modalLivingCity" th:data-placeholder="#{common.select}"><option value="" th:text="#{common.select}"></option><option th:each="o:${olkeler}" th:value="${o.id}" th:text="${o.ad}"></option></select></div></div><div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.city}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-building-community"></i></span><select class="form-select select2" id="modalLivingCity" name="seherId" th:data-placeholder="#{common.select}"><option value="" th:text="#{common.select}"></option><option th:each="o:${seherler}" th:value="${o.id}" th:text="${o.ad}" th:data-parent="${o.parentId}"></option></select></div></div>
<div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.workplace}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-briefcase"></i></span><input class="form-control" name="isYeri" th:placeholder="#{patients.workplace}"></div></div><div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.position}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-user-cog"></i></span><input class="form-control" name="vezifesi" th:placeholder="#{patients.position}"></div></div><div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.profession}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-briefcase"></i></span><input class="form-control" name="pesesi" th:placeholder="#{patients.profession}"></div></div><div class="col-lg-3 col-md-6"><label class="form-label" th:text="#{patients.address}"></label><div class="input-group"><span class="input-group-text bg-white text-muted"><i class="ti ti-map-pin"></i></span><input class="form-control" name="unvan" th:placeholder="#{patients.address}"></div></div><div class="col-12"><label class="form-label" th:text="#{patients.note}"></label><div class="input-group"><span class="input-group-text bg-white text-muted align-items-start pt-2"><i class="ti ti-note"></i></span><textarea class="form-control" name="qeyd" rows="2" maxlength="500" th:placeholder="#{patients.note}"></textarea></div></div>
</div></div></div></div>
<div class="modal-footer justify-content-between"><div class="d-none" id="patientActiveField"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="aktiv" value="true" id="patientActive"><label class="form-check-label" for="patientActive" th:text="#{patients.active_card}"></label></div></div><div class="d-flex gap-2 ms-auto"><button type="button" class="btn btn-light" data-bs-dismiss="modal" th:text="#{common.legv_et}"></button><button class="btn btn-primary"><i class="ti ti-device-floppy me-2"></i><span th:text="#{common.yadda_saxla}"></span></button></div></div></form></div></div>
<style>#newPatientModal .input-group>.select2-container{flex:1 1 auto;width:1%!important;min-width:0}#newPatientModal .input-group>.select2-container .select2-selection--single{border-top-left-radius:0;border-bottom-left-radius:0}#newPatientModal .input-group>.input-group-text{flex:0 0 auto}</style>
<script>document.addEventListener('DOMContentLoaded',()=>{const modal=document.getElementById('newPatientModal'),form=document.getElementById('patientModalForm'),title=document.getElementById('patientModalTitle'),id=form.elements.xesteId,activeField=document.getElementById('patientActiveField');const set=(name,value)=>{const field=form.elements[name];if(field)field.value=value??''};document.querySelector('.js-new-patient')?.addEventListener('click',()=>{form.reset();form.action=modal.dataset.createAction;id.disabled=true;activeField.classList.add('d-none');title.textContent=modal.dataset.createTitle;$(form).find('.select2').val('').trigger('change')});document.querySelectorAll('.js-edit-patient').forEach(button=>button.addEventListener('click',()=>{form.reset();form.action=modal.dataset.editAction;id.disabled=false;title.textContent=modal.dataset.editTitle;activeField.classList.remove('d-none');Object.entries(button.dataset).forEach(([key,value])=>set(key,value));form.elements.aktiv.checked=button.dataset.aktiv==='true';$(form).find('.select2').trigger('change');form.querySelectorAll('.js-modal-country').forEach(field=>field.dispatchEvent(new Event('change')));set('dogulduguSeherId',button.dataset.dogulduguSeherId);set('seherId',button.dataset.seherId);$(form).find('.select2').trigger('change.select2')}));document.querySelectorAll('.js-modal-country').forEach(country=>{const city=document.querySelector(country.dataset.city);const filter=()=>{[...city.options].forEach((option,index)=>{if(index)option.disabled=!!country.value&&option.dataset.parent!==country.value});$(city).trigger('change.select2')};country.addEventListener('change',()=>{city.value='';filter()});filter()})});</script></div></body></html>
