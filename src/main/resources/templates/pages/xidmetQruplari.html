<!DOCTYPE html><html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><div><h4 class="mb-1"><i class="ti ti-folders text-primary me-2"></i><span th:text="#{service_groups.xidmet_qruplari}">Xidmət qrupları</span></h4><p class="text-muted mb-0" th:text="#{service_groups.umumi_xidmet_kataloqunun}">Ümumi xidmət kataloqunun iyerarxik qrupları</p></div><div class="d-flex gap-2"><button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#xidmetQrupuFilter"><i class="ti ti-filter me-1"></i><span th:text="#{common.filter}">Filter</span><span th:if="${filterApplied}" class="badge bg-white text-primary ms-2" th:text="#{common.aktiv}">Aktiv</span></button><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newGroup"><i class="ti ti-folder-plus me-1"></i><span th:text="#{common.yeni_qrup}">Yeni qrup</span></button></div></div>
<div class="offcanvas offcanvas-top offcanvas-top_ka shadow-lg" tabindex="-1" id="xidmetQrupuFilter" style="--bs-offcanvas-height:190px!important;height:190px!important;min-height:190px!important;max-height:190px!important"><div class="offcanvas-header border-bottom bg-light py-3"><h5 class="mb-0 fw-bold text-primary"><i class="ti ti-filter me-2"></i><span th:text="#{service_groups.xidmet_qruplari_uzre_etra}">Xidmət qrupları üzrə ətraflı axtarış</span></h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Bağla" th:aria-label="#{common.bagla}"></button></div><div class="offcanvas-body py-3"><form method="get" th:action="@{/xidmetQruplari}"><div class="row g-2 align-items-end"><div class="col-xl-5 col-md-6"><label class="form-label small text-muted" th:text="#{common.axtaris}">Axtarış</label><div class="input-group"><span class="input-group-text bg-light"><i class="ti ti-search"></i></span><input class="form-control" name="q" th:value="${q}" placeholder="Qrup adı, kodu və ya tam yol..." th:placeholder="#{service_groups.qrup_adi_kodu_ve_ya_tam_y}"></div></div><div class="col-xl-2 col-md-6"><label class="form-label small text-muted" th:text="#{service_groups.qrup_tipi}">Qrup tipi</label><select class="form-select" name="qrupTipi"><option value="" th:text="#{service_groups.butun_qruplar}">Bütün qruplar</option><option value="esas" th:selected="${selectedQrupTipi=='esas'}" th:text="#{service_groups.esas_qruplar}">Əsas qruplar</option><option value="alt" th:selected="${selectedQrupTipi=='alt'}" th:text="#{service_groups.alt_qruplar}">Alt qruplar</option></select></div><div class="col-xl-2 col-md-6"><label class="form-label small text-muted" th:text="#{common.status}">Status</label><select class="form-select" name="status"><option value="" th:text="#{common.butun_statuslar}">Bütün statuslar</option><option value="aktiv" th:selected="${selectedStatus=='aktiv'}" th:text="#{common.aktiv}">Aktiv</option><option value="passiv" th:selected="${selectedStatus=='passiv'}" th:text="#{common.passiv}">Passiv</option></select></div><div class="col-xl-3 col-md-6"><div class="d-flex gap-2"><button class="btn btn-primary flex-fill"><i class="ti ti-search me-1"></i><span th:text="#{common.axtar}">Axtar</span></button><a class="btn btn-light flex-fill" th:href="@{/xidmetQruplari}" th:text="#{common.temizle}">Təmizlə</a></div></div></div></form></div></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<div class="card border-0 shadow-sm"><div class="card-header d-flex justify-content-between align-items-center"><div><h5 class="mb-1" th:text="#{service_groups.qrup_siyahisi}">Qrup siyahısı</h5><small th:if="${filterApplied}" class="text-muted" th:text="#{service_groups.filter_neticesi}">Filter nəticəsi</small></div><div class="d-flex align-items-center gap-2"><a th:if="${filterApplied}" class="btn btn-sm btn-light" th:href="@{/xidmetQruplari}"><i class="ti ti-x me-1"></i><span th:text="#{common.filteri_temizle}">Filteri təmizlə</span></a><span class="badge bg-primary-subtle text-primary" th:text="|${qrupCount} qrup|"></span></div></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="bg-light"><tr><th class="ps-3" th:text="#{common.qrup}">Qrup</th><th th:text="#{service_groups.tam_yol}">Tam yol</th><th th:text="#{common.seviyye}">Səviyyə</th><th th:text="#{service_groups.alt_qrup}">Alt qrup</th><th th:text="#{common.sira}">Sıra</th><th th:text="#{common.status}">Status</th><th></th></tr></thead><tbody>
<tr th:each="q:${qruplar}" class="service-tree-row" th:data-id="${q.id}" th:data-parent-id="${q.parentId}" th:data-level="${q.seviye}"><td class="ps-3"><div class="service-tree-cell" th:style="|--tree-level:${q.seviye}|"><button th:if="${q.altQrupuVar}" type="button" class="btn btn-sm service-tree-toggle" aria-expanded="true" th:aria-label="#{service_groups.alt_qruplar}"><i class="ti ti-chevron-down"></i></button><span th:unless="${q.altQrupuVar}" class="service-tree-toggle-placeholder"><i th:if="${q.seviye > 0}" class="ti ti-corner-down-right"></i></span><span class="avatar avatar-sm rounded service-tree-folder" th:classappend="${q.seviye == 0} ? 'bg-primary-subtle text-primary' : (${q.seviye == 1} ? 'bg-info-subtle text-info' : (${q.seviye == 2} ? 'bg-warning-subtle text-warning' : 'bg-secondary-subtle text-secondary'))"><i th:class="${q.altQrupuVar} ? 'ti ti-folder' : 'ti ti-folder-open'"></i></span><div class="min-w-0"><div class="fw-semibold text-truncate service-group-name" th:classappend="${q.seviye == 0} ? 'text-primary' : (${q.seviye == 1} ? 'text-info' : (${q.seviye == 2} ? 'text-warning' : 'text-secondary'))" th:text="${q.ad}"></div><small class="text-muted" th:text="${q.kod}"></small></div></div></td><td class="text-muted" th:text="${q.tamYol}"></td><td><span class="badge border" th:classappend="${q.seviye == 0} ? 'bg-primary-subtle text-primary border-primary-subtle' : (${q.seviye == 1} ? 'bg-info-subtle text-info border-info-subtle' : (${q.seviye == 2} ? 'bg-warning-subtle text-warning border-warning-subtle' : 'bg-secondary-subtle text-secondary border-secondary-subtle'))" th:text="|Səviyyə ${q.seviye}|"></span></td><td th:text="${q.altQrupSayi}"></td><td th:text="${q.siraNo?:'—'}"></td><td><span class="badge" th:classappend="${q.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${q.aktiv}?#{common.aktiv}:#{common.passiv}"></span></td><td class="text-end pe-3"><button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="|#editG${q.id}|" th:title="#{common.redakte_et}"><i class="ti ti-edit"></i></button></td></tr>
<tr th:if="${#lists.isEmpty(qruplar)}"><td colspan="7" class="text-center text-muted py-5"><i class="ti ti-folder-off fs-2 d-block mb-2"></i><span th:text="${filterApplied}?'Filterə uyğun xidmət qrupu tapılmadı.':'Xidmət qrupu tapılmadı.'"></span></td></tr></tbody></table></div></div></div>
<div class="modal fade" id="newGroup" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/xidmetQruplari/yeni}"><div class="modal-header border-0 pb-0"><div class="d-flex gap-3 align-items-center"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-folder-plus fs-24"></i></span><div><h5 class="mb-1" th:text="#{service_groups.yeni_xidmet_qrupu}">Yeni xidmət qrupu</h5><small class="text-muted" th:text="#{service_groups.esas_ve_ya_alt_qrup_yarad}">Əsas və ya alt qrup yaradın</small></div></div><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body pt-4"><div class="input-group mb-3"><span class="input-group-text"><i class="ti ti-folder"></i></span><input class="form-control" name="ad" placeholder="Qrupun adı" required th:placeholder="#{service_groups.qrupun_adi}"></div><label class="form-label" th:text="#{service_groups.ust_qrup}">Üst qrup</label><div class="input-group"><span class="input-group-text"><i class="ti ti-hierarchy-2"></i></span><select class="form-select service-group-select" name="parentId"><option value="" th:text="#{service_groups.esas_qrup_kimi_yarat}">Əsas qrup kimi yarat</option><option th:each="q:${allQruplar}" th:value="${q.id}" th:text="${#strings.repeat(' ',q.seviye)+(q.seviye > 0?'↳ ':'▰ ')+q.ad}"></option></select></div><small class="form-text text-muted" th:text="#{service_groups.parent_hint}"></small></div><div class="modal-footer border-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal" th:text="#{common.imtina}">İmtina</button><button class="btn btn-primary"><i class="ti ti-plus me-1"></i><span th:text="#{common.yarat}">Yarat</span></button></div></form></div></div></div>
<div th:each="q:${qruplar}" class="modal fade" th:id="|editG${q.id}|" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/xidmetQruplari/yenile}"><input type="hidden" name="xidmetQrupuId" th:value="${q.id}"><div class="modal-header"><h5><i class="ti ti-folder-cog text-primary me-2"></i><span th:text="#{common.qrupu_redakte_et}">Qrupu redaktə et</span></h5><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label" th:text="#{common.qrup_adi}">Qrup adı</label><input class="form-control mb-3" name="ad" th:value="${q.ad}" required><label class="form-label" th:text="#{service_groups.ust_qrup}">Üst qrup</label><select class="form-select service-group-select" name="parentId"><option value="" th:text="#{service_groups.esas_qrup}">Əsas qrup</option><option th:each="parent:${allQruplar}" th:if="${parent.id != q.id}" th:value="${parent.id}" th:text="${#strings.repeat(' ',parent.seviye)+(parent.seviye > 0?'↳ ':'▰ ')+parent.ad}" th:selected="${parent.id == q.parentId}"></option></select><small class="form-text text-muted d-block mb-3" th:text="#{service_groups.parent_hint}"></small><div class="d-flex justify-content-between border rounded bg-light p-3"><span><i class="ti ti-power text-primary me-2"></i><span th:text="#{service_groups.aktiv_qrup}">Aktiv qrup</span></span><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="aktiv" value="true" th:checked="${q.aktiv}"></div></div></div><div class="modal-footer"><button class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i><span th:text="#{common.yadda_saxla}">Yadda saxla</span></button></div></form></div></div></div>
<style>
.service-tree-row{--tree-indent:32px}.service-tree-row>td{height:68px}.service-tree-cell{position:relative;display:flex;align-items:center;gap:10px;min-width:260px;padding-left:calc(var(--tree-level) * var(--tree-indent))}.service-tree-cell::before{content:"";position:absolute;top:-35px;bottom:-35px;left:calc(var(--tree-level) * var(--tree-indent) + 13px);border-left:1px solid var(--bs-border-color);opacity:0}.service-tree-row[data-level]:not([data-level="0"]) .service-tree-cell::before{opacity:1}.service-tree-toggle,.service-tree-toggle-placeholder{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;width:28px;min-width:28px;height:28px;padding:0;color:var(--bs-secondary-color);background:var(--bs-body-bg);border:0}.service-tree-toggle:hover{color:var(--bs-primary);background:var(--bs-primary-bg-subtle)}.service-tree-toggle i{transition:transform .18s}.service-tree-toggle[aria-expanded="false"] i{transform:rotate(-90deg)}.service-tree-folder{box-shadow:0 3px 9px rgba(25,55,85,.08)}
.service-group-name{letter-spacing:.01em}.service-tree-row[data-level="0"] .service-group-name{font-weight:700!important}.service-group-select{min-height:44px;font-weight:500}.service-group-select option{font-weight:500;padding-block:6px}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{const rows=[...document.querySelectorAll('.service-tree-row')];rows.forEach((row,index)=>{const toggle=row.querySelector('.service-tree-toggle');if(!toggle)return;toggle.addEventListener('click',()=>{const level=Number(row.dataset.level),collapse=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!collapse));for(let i=index+1;i<rows.length;i++){const childLevel=Number(rows[i].dataset.level);if(childLevel<=level)break;if(collapse){rows[i].hidden=true;rows[i].querySelector('.service-tree-toggle')?.setAttribute('aria-expanded','false')}else if(childLevel===level+1){rows[i].hidden=false}}})})});
</script>
</div></body></html>
