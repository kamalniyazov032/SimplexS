<!DOCTYPE html><html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><div><h4 class="mb-1"><i class="ti ti-folders text-primary me-2"></i>Xidmət qrupları</h4><p class="text-muted mb-0">Ümumi xidmət kataloqunun iyerarxik qrupları</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newGroup"><i class="ti ti-folder-plus me-1"></i>Yeni qrup</button></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<div class="card border-0 shadow-sm"><div class="card-header d-flex justify-content-between"><h5 class="mb-0">Qrup siyahısı</h5><span class="badge bg-primary-subtle text-primary" th:text="|${#lists.size(qruplar)} qrup|"></span></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="bg-light"><tr><th class="ps-3">Qrup</th><th>Tam yol</th><th>Səviyyə</th><th>Alt qrup</th><th>Sıra</th><th>Status</th><th></th></tr></thead><tbody>
<tr th:each="q:${qruplar}"><td class="ps-3"><div class="d-flex align-items-center gap-2" th:style="|padding-left:${q.seviye * 14}px|"><span class="avatar avatar-sm bg-primary-subtle text-primary rounded"><i th:class="${q.altQrupuVar} ? 'ti ti-folder' : 'ti ti-folder-open'"></i></span><div><div class="fw-semibold" th:text="${q.ad}"></div><small class="text-muted" th:text="${q.kod}"></small></div></div></td><td class="text-muted" th:text="${q.tamYol}"></td><td><span class="badge bg-light text-dark border" th:text="|Səviyyə ${q.seviye}|"></span></td><td th:text="${q.altQrupSayi}"></td><td th:text="${q.siraNo?:'—'}"></td><td><span class="badge" th:classappend="${q.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${q.aktiv}?'Aktiv':'Passiv'"></span></td><td class="text-end pe-3"><button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="|#editG${q.id}|"><i class="ti ti-edit"></i></button></td></tr>
<tr th:if="${#lists.isEmpty(qruplar)}"><td colspan="7" class="text-center text-muted py-5"><i class="ti ti-folder-off fs-2 d-block"></i>Xidmət qrupu tapılmadı.</td></tr></tbody></table></div></div></div>
<div class="modal fade" id="newGroup" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/xidmetQruplari/yeni}"><div class="modal-header border-0 pb-0"><div class="d-flex gap-3 align-items-center"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-folder-plus fs-24"></i></span><div><h5 class="mb-1">Yeni xidmət qrupu</h5><small class="text-muted">Əsas və ya alt qrup yaradın</small></div></div><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body pt-4"><div class="input-group mb-3"><span class="input-group-text"><i class="ti ti-folder"></i></span><input class="form-control" name="ad" placeholder="Qrupun adı" required></div><div class="input-group"><span class="input-group-text"><i class="ti ti-folders"></i></span><select class="form-select" name="parentId"><option value="">Əsas qrup kimi yarat</option><option th:each="q:${qruplar}" th:value="${q.id}" th:text="${q.tamYol}"></option></select></div></div><div class="modal-footer border-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal">İmtina</button><button class="btn btn-primary"><i class="ti ti-plus me-1"></i>Yarat</button></div></form></div></div></div>
<div th:each="q:${qruplar}" class="modal fade" th:id="|editG${q.id}|" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/xidmetQruplari/yenile}"><input type="hidden" name="xidmetQrupuId" th:value="${q.id}"><div class="modal-header"><h5><i class="ti ti-folder-cog text-primary me-2"></i>Qrupu redaktə et</h5><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Qrup adı</label><input class="form-control mb-3" name="ad" th:value="${q.ad}" required><label class="form-label">Üst qrup</label><select class="form-select mb-3" name="parentId"><option value="">Əsas qrup</option><option th:each="parent:${qruplar}" th:if="${parent.id != q.id}" th:value="${parent.id}" th:text="${parent.tamYol}" th:selected="${parent.id == q.parentId}"></option></select><div class="d-flex justify-content-between border rounded bg-light p-3"><span><i class="ti ti-power text-primary me-2"></i>Aktiv qrup</span><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="aktiv" value="true" th:checked="${q.aktiv}"></div></div></div><div class="modal-footer"><button class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i>Yadda saxla</button></div></form></div></div></div>
</div></body></html>
