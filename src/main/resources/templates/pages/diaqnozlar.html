<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body><div layout:fragment="content">
  <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-4">
    <div><h4 class="mb-1"><i class="ti ti-medical-cross text-primary me-2"></i><span th:text="#{diagnoses.diaqnozlar}">Diaqnozlar</span></h4><p class="text-muted mb-0" th:text="#{diagnoses.diaqnoz_kataloqu_uzre_axtaris}">Diaqnoz kataloqu üzrə axtarış və baxış</p></div>
    <button class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#diagnosisFilter"><i class="ti ti-filter me-1"></i><span th:text="#{common.filter}">Filter</span><span th:if="${filterApplied}" class="badge bg-white text-primary ms-2" th:text="#{common.aktiv}">Aktiv</span></button>
  </div>

  <div class="offcanvas offcanvas-top offcanvas-top_ka shadow-lg" tabindex="-1" id="diagnosisFilter" style="--bs-offcanvas-height:270px!important;height:270px!important;min-height:270px!important;max-height:270px!important">
    <div class="offcanvas-header border-bottom bg-light py-3"><h5 class="mb-0 text-primary"><i class="ti ti-filter me-2"></i><span th:text="#{diagnoses.diaqnozlar_uzre_filter}">Diaqnozlar üzrə filter</span></h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body py-3"><form method="get" th:action="@{/diaqnozlar}" class="row g-2 align-items-end">
      <div class="col-lg-4"><label class="form-label small text-muted" th:text="#{diagnoses.diaqnoz_sistemi}">Diaqnoz sistemi</label><select class="form-select" name="sistemId"><option th:each="s:${sistemler}" th:value="${s.id}" th:text="|${s.kod} — ${s.ad}|" th:selected="${s.id==selectedSistemId}"></option></select></div>
      <div class="col-lg-4"><label class="form-label small text-muted" th:text="#{diagnoses.kod_ve_ya_ad}">Kod və ya ad</label><div class="input-group"><span class="input-group-text"><i class="ti ti-search"></i></span><input class="form-control" name="q" th:value="${q}" placeholder="Məsələn, A00 və ya diaqnoz adı" th:placeholder="#{diagnoses.meselen_a00_ve_ya_diaqnoz_adi}"></div></div>
      <div class="col-lg-2"><label class="form-label small text-muted" th:text="#{common.status}">Status</label><select class="form-select" name="status"><option value="aktiv" th:selected="${status=='aktiv'}" th:text="#{common.aktiv}">Aktiv</option><option value="passiv" th:selected="${status=='passiv'}" th:text="#{common.passiv}">Passiv</option><option value="hamisi" th:selected="${status=='hamisi'}" th:text="#{common.hamisi}">Hamısı</option></select></div>
      <div class="col-lg-2"><label class="form-label small text-muted" th:text="#{diagnoses.sehife_olcusu}">Səhifə ölçüsü</label><select class="form-select" name="size"><option value="50" th:selected="${pageSize==50}">50</option><option value="100" th:selected="${pageSize==100}">100</option></select></div>
      <div class="col-lg-3"><label class="form-label small text-muted" th:text="#{diagnoses.nov}">Növ</label><select class="form-select" name="tip"><option value="hamisi" th:selected="${tip=='hamisi'}" th:text="#{diagnoses.kateqoriya_ve_diaqnozlar}">Kateqoriya və diaqnozlar</option><option value="kateqoriya" th:selected="${tip=='kateqoriya'}" th:text="#{diagnoses.yalniz_kateqoriyalar}">Yalnız kateqoriyalar</option><option value="diaqnoz" th:selected="${tip=='diaqnoz'}" th:text="#{diagnoses.yalniz_diaqnozlar}">Yalnız diaqnozlar</option></select></div>
      <div class="col-lg-3"><label class="form-label small text-muted" th:text="#{diagnoses.secim_imkani}">Seçim imkanı</label><select class="form-select" name="secim"><option value="hamisi" th:selected="${secim=='hamisi'}" th:text="#{common.hamisi}">Hamısı</option><option value="secile_biler" th:selected="${secim=='secile_biler'}" th:text="#{diagnoses.secile_biler}">Seçilə bilər</option><option value="secile_bilmez" th:selected="${secim=='secile_bilmez'}" th:text="#{diagnoses.secile_bilmez}">Seçilə bilməz</option></select></div>
      <div class="col-lg-2"><label class="form-label small text-muted" th:text="#{diagnoses.cins_uygunlugu}">Cins uyğunluğu</label><select class="form-select" name="cins"><option value="hamisi" th:selected="${cins=='hamisi'}" th:text="#{common.hamisi}">Hamısı</option><option value="qadin" th:selected="${cins=='qadin'}" th:text="#{diagnoses.qadina_verile_biler}">Qadına verilə bilər</option><option value="kisi" th:selected="${cins=='kisi'}" th:text="#{diagnoses.kisiye_verile_biler}">Kişiyə verilə bilər</option></select></div>
      <div class="col-lg-2"><label class="form-label small text-muted" th:text="#{diagnoses.parent_id}">Parent ID</label><input class="form-control" type="number" min="1" name="parentId" th:value="${parentId}" placeholder="Hamısı" th:placeholder="#{common.hamisi}"></div>
      <div class="col-lg-2"><div class="d-flex gap-2"><button class="btn btn-primary flex-fill"><i class="ti ti-search me-1"></i><span th:text="#{common.tetbiq_et}">Tətbiq et</span></button><a class="btn btn-light" th:href="@{/diaqnozlar}" title="Təmizlə" th:title="#{common.temizle}"><i class="ti ti-refresh"></i></a></div></div>
    </form></div>
  </div>

  <div class="card border-0 shadow-sm"><div class="card-header bg-white d-flex justify-content-between align-items-center gap-3 flex-wrap"><div><h5 class="mb-1" th:text="#{diagnoses.diaqnoz_siyahisi}">Diaqnoz siyahısı</h5><small class="text-muted"><strong th:text="${totalCount}"></strong><span th:text="#{diagnoses.netice_tapildi}"> nəticə tapıldı</span></small></div><form method="get" th:action="@{/diaqnozlar}" class="d-flex gap-2" style="min-width:min(100%,430px)"><input type="hidden" name="sistemId" th:value="${selectedSistemId}"><input type="hidden" name="parentId" th:value="${parentId}"><input type="hidden" name="status" th:value="${status}"><input type="hidden" name="secim" th:value="${secim}"><input type="hidden" name="tip" th:value="${tip}"><input type="hidden" name="cins" th:value="${cins}"><input type="hidden" name="size" th:value="${pageSize}"><div class="input-group"><span class="input-group-text bg-white"><i class="ti ti-search"></i></span><input class="form-control" name="q" th:value="${q}" placeholder="Diaqnoz kodu və ya adı" th:placeholder="#{diagnoses.diaqnoz_kodu_ve_ya_adi}"><button class="btn btn-primary" th:text="#{common.axtar}">Axtar</button></div></form></div>
    <div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th class="ps-3" th:text="#{common.kod}">Kod</th><th th:text="#{diagnoses.diaqnoz}">Diaqnoz</th><th th:text="#{common.sistem}">Sistem</th><th th:text="#{diagnoses.ust_kateqoriya}">Üst kateqoriya</th><th th:text="#{diagnoses.nov}">Növ</th><th th:text="#{diagnoses.secim}">Seçim</th><th th:text="#{diagnoses.cins_uygunlugu}">Cins uyğunluğu</th><th th:text="#{common.status}">Status</th></tr></thead><tbody>
      <tr th:each="d:${diaqnozlar}"><td class="ps-3"><span class="badge bg-light text-dark border" th:text="${d.kod}"></span></td><td style="min-width:280px"><strong th:text="${d.ad}"></strong><small th:if="${d.aciqlama}" class="d-block text-muted" th:text="${d.aciqlama}"></small></td><td><span th:text="${d.sistemAdi}"></span><small class="d-block text-muted" th:text="${d.sistemKodu}"></small></td><td><span th:text="${d.parentAdi ?: '—'}"></span><small th:if="${d.parentKodu}" class="d-block text-muted" th:text="${d.parentKodu}"></small></td><td><span class="badge" th:classappend="${d.kateqoriyadir}?'bg-warning-subtle text-warning':'bg-primary-subtle text-primary'" th:text="${d.kateqoriyadir}?'Kateqoriya':'Diaqnoz'"></span></td><td><span class="badge" th:classappend="${d.secileBiler}?'bg-success-subtle text-success':'bg-light text-muted'" th:text="${d.secileBiler}?'Seçilə bilər':'Seçilmir'"></span></td><td><div class="d-flex gap-1"><span class="badge" th:classappend="${d.qadinaVerileBiler}?'bg-info-subtle text-info':'bg-light text-muted'" title="Qadın" th:text="#{diagnoses.q}" th:title="#{diagnoses.qadin}">Q</span><span class="badge" th:classappend="${d.kisiyeVerileBiler}?'bg-primary-subtle text-primary':'bg-light text-muted'" title="Kişi" th:text="#{diagnoses.k}" th:title="#{diagnoses.kisi}">K</span></div></td><td><span class="badge" th:classappend="${d.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${d.aktiv}?'Aktiv':'Passiv'"></span></td></tr>
      <tr th:if="${#lists.isEmpty(diaqnozlar)}"><td colspan="8" class="text-center text-muted py-5"><i class="ti ti-database-off fs-2 d-block mb-2"></i><span th:text="#{diagnoses.axtarisa_uygun_diaqnoz_tapilma}">Axtarışa uyğun diaqnoz tapılmadı</span></td></tr>
    </tbody></table></div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center" th:if="${totalCount>0}"><small class="text-muted" th:text="|Səhifə ${currentPage} / ${totalPages}|"></small><div class="btn-group"><a class="btn btn-sm btn-outline-primary" th:classappend="${currentPage==1}?' disabled'" th:href="@{/diaqnozlar(sistemId=${selectedSistemId},parentId=${parentId},q=${q},secim=${secim},status=${status},tip=${tip},cins=${cins},size=${pageSize},page=${currentPage-1})}"><i class="ti ti-chevron-left me-1"></i><span th:text="#{common.evvelki}">Əvvəlki</span></a><a class="btn btn-sm btn-outline-primary" th:classappend="${currentPage==totalPages}?' disabled'" th:href="@{/diaqnozlar(sistemId=${selectedSistemId},parentId=${parentId},q=${q},secim=${secim},status=${status},tip=${tip},cins=${cins},size=${pageSize},page=${currentPage+1})}"><span th:text="#{common.novbeti}">Növbəti</span><i class="ti ti-chevron-right ms-1"></i></a></div></div>
  </div>
</div></body></html>
