<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body><div layout:fragment="content">
  <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-4">
    <div><h4 class="mb-1"><i class="ti ti-medical-cross text-primary me-2"></i>Diaqnozlar</h4><p class="text-muted mb-0">Diaqnoz kataloqu üzrə axtarış və baxış</p></div>
    <button class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#diagnosisFilter"><i class="ti ti-filter me-1"></i>Filter<span th:if="${filterApplied}" class="badge bg-white text-primary ms-2">Aktiv</span></button>
  </div>

  <div class="offcanvas offcanvas-top offcanvas-top_ka shadow-lg" tabindex="-1" id="diagnosisFilter" style="--bs-offcanvas-height:270px!important;height:270px!important;min-height:270px!important;max-height:270px!important">
    <div class="offcanvas-header border-bottom bg-light py-3"><h5 class="mb-0 text-primary"><i class="ti ti-filter me-2"></i>Diaqnozlar üzrə filter</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body py-3"><form method="get" th:action="@{/diaqnozlar}" class="row g-2 align-items-end">
      <div class="col-lg-4"><label class="form-label small text-muted">Diaqnoz sistemi</label><select class="form-select" name="sistemId"><option th:each="s:${sistemler}" th:value="${s.id}" th:text="|${s.kod} — ${s.ad}|" th:selected="${s.id==selectedSistemId}"></option></select></div>
      <div class="col-lg-4"><label class="form-label small text-muted">Kod və ya ad</label><div class="input-group"><span class="input-group-text"><i class="ti ti-search"></i></span><input class="form-control" name="q" th:value="${q}" placeholder="Məsələn, A00 və ya diaqnoz adı"></div></div>
      <div class="col-lg-2"><label class="form-label small text-muted">Status</label><select class="form-select" name="status"><option value="aktiv" th:selected="${status=='aktiv'}">Aktiv</option><option value="passiv" th:selected="${status=='passiv'}">Passiv</option><option value="hamisi" th:selected="${status=='hamisi'}">Hamısı</option></select></div>
      <div class="col-lg-2"><label class="form-label small text-muted">Səhifə ölçüsü</label><select class="form-select" name="size"><option value="50" th:selected="${pageSize==50}">50</option><option value="100" th:selected="${pageSize==100}">100</option></select></div>
      <div class="col-lg-3"><label class="form-label small text-muted">Növ</label><select class="form-select" name="tip"><option value="hamisi" th:selected="${tip=='hamisi'}">Kateqoriya və diaqnozlar</option><option value="kateqoriya" th:selected="${tip=='kateqoriya'}">Yalnız kateqoriyalar</option><option value="diaqnoz" th:selected="${tip=='diaqnoz'}">Yalnız diaqnozlar</option></select></div>
      <div class="col-lg-3"><label class="form-label small text-muted">Seçim imkanı</label><select class="form-select" name="secim"><option value="hamisi" th:selected="${secim=='hamisi'}">Hamısı</option><option value="secile_biler" th:selected="${secim=='secile_biler'}">Seçilə bilər</option><option value="secile_bilmez" th:selected="${secim=='secile_bilmez'}">Seçilə bilməz</option></select></div>
      <div class="col-lg-2"><label class="form-label small text-muted">Cins uyğunluğu</label><select class="form-select" name="cins"><option value="hamisi" th:selected="${cins=='hamisi'}">Hamısı</option><option value="qadin" th:selected="${cins=='qadin'}">Qadına verilə bilər</option><option value="kisi" th:selected="${cins=='kisi'}">Kişiyə verilə bilər</option></select></div>
      <div class="col-lg-2"><label class="form-label small text-muted">Parent ID</label><input class="form-control" type="number" min="1" name="parentId" th:value="${parentId}" placeholder="Hamısı"></div>
      <div class="col-lg-2"><div class="d-flex gap-2"><button class="btn btn-primary flex-fill"><i class="ti ti-search me-1"></i>Tətbiq et</button><a class="btn btn-light" th:href="@{/diaqnozlar}" title="Təmizlə"><i class="ti ti-refresh"></i></a></div></div>
    </form></div>
  </div>

  <div class="card border-0 shadow-sm"><div class="card-header bg-white d-flex justify-content-between align-items-center gap-3 flex-wrap"><div><h5 class="mb-1">Diaqnoz siyahısı</h5><small class="text-muted"><strong th:text="${totalCount}"></strong> nəticə tapıldı</small></div><form method="get" th:action="@{/diaqnozlar}" class="d-flex gap-2" style="min-width:min(100%,430px)"><input type="hidden" name="sistemId" th:value="${selectedSistemId}"><input type="hidden" name="parentId" th:value="${parentId}"><input type="hidden" name="status" th:value="${status}"><input type="hidden" name="secim" th:value="${secim}"><input type="hidden" name="tip" th:value="${tip}"><input type="hidden" name="cins" th:value="${cins}"><input type="hidden" name="size" th:value="${pageSize}"><div class="input-group"><span class="input-group-text bg-white"><i class="ti ti-search"></i></span><input class="form-control" name="q" th:value="${q}" placeholder="Diaqnoz kodu və ya adı"><button class="btn btn-primary">Axtar</button></div></form></div>
    <div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th class="ps-3">Kod</th><th>Diaqnoz</th><th>Sistem</th><th>Üst kateqoriya</th><th>Növ</th><th>Seçim</th><th>Cins uyğunluğu</th><th>Status</th></tr></thead><tbody>
      <tr th:each="d:${diaqnozlar}"><td class="ps-3"><span class="badge bg-light text-dark border" th:text="${d.kod}"></span></td><td style="min-width:280px"><strong th:text="${d.ad}"></strong><small th:if="${d.aciqlama}" class="d-block text-muted" th:text="${d.aciqlama}"></small></td><td><span th:text="${d.sistemAdi}"></span><small class="d-block text-muted" th:text="${d.sistemKodu}"></small></td><td><span th:text="${d.parentAdi ?: '—'}"></span><small th:if="${d.parentKodu}" class="d-block text-muted" th:text="${d.parentKodu}"></small></td><td><span class="badge" th:classappend="${d.kateqoriyadir}?'bg-warning-subtle text-warning':'bg-primary-subtle text-primary'" th:text="${d.kateqoriyadir}?'Kateqoriya':'Diaqnoz'"></span></td><td><span class="badge" th:classappend="${d.secileBiler}?'bg-success-subtle text-success':'bg-light text-muted'" th:text="${d.secileBiler}?'Seçilə bilər':'Seçilmir'"></span></td><td><div class="d-flex gap-1"><span class="badge" th:classappend="${d.qadinaVerileBiler}?'bg-info-subtle text-info':'bg-light text-muted'" title="Qadın">Q</span><span class="badge" th:classappend="${d.kisiyeVerileBiler}?'bg-primary-subtle text-primary':'bg-light text-muted'" title="Kişi">K</span></div></td><td><span class="badge" th:classappend="${d.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${d.aktiv}?'Aktiv':'Passiv'"></span></td></tr>
      <tr th:if="${#lists.isEmpty(diaqnozlar)}"><td colspan="8" class="text-center text-muted py-5"><i class="ti ti-database-off fs-2 d-block mb-2"></i>Axtarışa uyğun diaqnoz tapılmadı</td></tr>
    </tbody></table></div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center" th:if="${totalCount>0}"><small class="text-muted" th:text="|Səhifə ${currentPage} / ${totalPages}|"></small><div class="btn-group"><a class="btn btn-sm btn-outline-primary" th:classappend="${currentPage==1}?' disabled'" th:href="@{/diaqnozlar(sistemId=${selectedSistemId},parentId=${parentId},q=${q},secim=${secim},status=${status},tip=${tip},cins=${cins},size=${pageSize},page=${currentPage-1})}"><i class="ti ti-chevron-left me-1"></i>Əvvəlki</a><a class="btn btn-sm btn-outline-primary" th:classappend="${currentPage==totalPages}?' disabled'" th:href="@{/diaqnozlar(sistemId=${selectedSistemId},parentId=${parentId},q=${q},secim=${secim},status=${status},tip=${tip},cins=${cins},size=${pageSize},page=${currentPage+1})}">Növbəti<i class="ti ti-chevron-right ms-1"></i></a></div></div>
  </div>
</div></body></html>
