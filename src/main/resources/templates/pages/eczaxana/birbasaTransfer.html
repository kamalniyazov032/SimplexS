<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content" id="transferPage" th:data-base="@{/eczaxana/birbasa-transfer}" th:data-today="${today}">
<link rel="stylesheet" th:href="@{/custom/css/birbasaTransfer.css}">
<input type="hidden" id="transferCsrf" th:value="${_csrf.token}" th:data-header="${_csrf.headerName}">
<div class="d-flex gap-3 align-items-start mb-3"><i class="ti ti-file-description text-primary fs-2" aria-hidden="true"></i><div><h4 th:text="#{transfer.title}"></h4><p class="mb-0 text-muted" th:text="#{transfer.subtitle}"></p></div></div>
<div id="transferNotice" class="alert d-none" role="status"></div>
<section class="card"><div class="card-header"><h6 class="mb-0"><i class="ti ti-file-description me-2 text-primary" aria-hidden="true"></i><span th:text="#{transfer.info}"></span></h6></div><form id="transferHeader" class="card-body transfer-header"><div class=""><label for="transferSender" class="form-label" th:text="#{transfer.sender}"></label><div class="input-group"><span class="input-group-text"><i class="ti ti-building-warehouse" aria-hidden="true"></i></span><select id="transferSender" class="form-select" required><option value="" th:text="#{qaime.chooseWarehouse}"></option><option th:each="w:${warehouses}" th:value="${w.anbarId}" th:text="${w.anbarAdi}"></option></select></div></div><div class=""><label for="transferReceiver" class="form-label" th:text="#{transfer.receiver}"></label><div class="input-group"><span class="input-group-text"><i class="ti ti-building-warehouse" aria-hidden="true"></i></span><select id="transferReceiver" class="form-select" required><option value="" th:text="#{qaime.chooseWarehouse}"></option><option th:each="w:${receivers}" th:value="${w.anbar_id}" th:text="${w.anbar_adi}"></option></select></div></div><div class=""><label for="transferDate" class="form-label" th:text="#{qaime.date}"></label><div class="input-group"><span class="input-group-text"><i class="ti ti-calendar" aria-hidden="true"></i></span><input id="transferDate" type="date" class="form-control" required th:value="${today}" th:max="${today}"></div></div><div class=""><label for="transferNote" class="form-label" th:text="#{qaime.note}"></label><div class="input-group"><span class="input-group-text"><i class="ti ti-notes" aria-hidden="true"></i></span><input id="transferNote" type="text" class="form-control" th:placeholder="#{transfer.notePlaceholder}"></div></div></form></section>
<section class="card"><div class="card-header"><h6 class="mb-0"><i class="ti ti-package me-2 text-primary" aria-hidden="true"></i><span th:text="#{qaime.addMaterial}"></span></h6></div><form id="transferMaterialForm" class="card-body transfer-material"><div class=""><label for="transferMaterial" class="form-label" th:text="#{qaime.material}"></label><div class="input-group"><button type="button" id="transferSearch" class="btn btn-light" th:aria-label="#{qaime.search}"><i class="ti ti-search" aria-hidden="true"></i></button><input id="transferMaterial" type="text" class="form-control" autocomplete="off" required th:placeholder="#{transfer.searchPlaceholder}"></div></div><div class=""><label for="transferUnit" class="form-label" th:text="#{qaime.unit}"></label><select id="transferUnit" class="form-select" required disabled></select></div><div class=""><label for="transferStock" class="form-label" th:text="#{transfer.stock}"></label><div class="input-group"><span class="input-group-text"><i class="ti ti-package" aria-hidden="true"></i></span><input id="transferStock" type="text" class="form-control" readonly></div></div><div class=""><label for="transferQuantity" class="form-label" th:text="#{transfer.quantity}"></label><div class="input-group"><span class="input-group-text"><i class="ti ti-package" aria-hidden="true"></i></span><input id="transferQuantity" type="number" class="form-control" required min="0.001" step="0.001"></div></div><div class=""><label for="transferMaterialNote" class="form-label" th:text="#{qaime.note}"></label><div class="input-group"><span class="input-group-text"><i class="ti ti-notes" aria-hidden="true"></i></span><input id="transferMaterialNote" type="text" class="form-control" ></div></div><button class="btn btn-primary" type="submit"><i class="ti ti-plus me-1" aria-hidden="true"></i><span th:text="#{transfer.add}"></span></button></form></section>
<section class="card transfer-list"><div class="card-header d-flex justify-content-between align-items-center"><h6 class="mb-0"><i class="ti ti-list me-2 text-primary" aria-hidden="true"></i><span th:text="#{transfer.materials}"></span> (<span id="transferCount">0</span>)</h6><button id="transferClear" type="button" class="btn btn-danger" ><i class="ti ti-trash me-1" aria-hidden="true"></i><span th:text="#{teleb.clearList}"></span></button></div><div class="card-body"><div class="table-responsive"><table class="table table-bordered align-middle"><thead><tr><th>#</th><th th:text="#{qaime.material}"></th><th th:text="#{qaime.barcode}"></th><th th:text="#{qaime.unit}"></th><th th:text="#{transfer.stock}"></th><th th:text="#{transfer.quantity}"></th><th th:text="#{qaime.note}"></th><th th:text="#{qaime.actions}"></th></tr></thead><tbody id="transferRows"></tbody></table></div><div class="text-end mt-4"><button id="transferComplete" type="button" class="btn btn-primary" disabled><i class="ti ti-check me-1" aria-hidden="true"></i><span th:text="#{transfer.complete}"></span></button></div></div></section>
<div class="modal fade" id="transferConfirmModal" tabindex="-1" data-bs-backdrop="static" aria-labelledby="transferConfirmTitle"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header border-0"><h5 id="transferConfirmTitle"><i class="ti ti-alert-circle text-warning me-2" aria-hidden="true"></i><span th:text="#{transfer.confirmTitle}"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{qaime.close}"></button></div><div class="modal-body pt-0"><p id="transferRoute"></p><p id="transferConfirmCount"></p><div class="alert alert-warning mb-0"><i class="ti ti-info-circle me-2" aria-hidden="true"></i><span th:text="#{transfer.warning}"></span></div></div><div class="modal-footer border-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal" th:text="#{qaime.cancel}"></button><button id="transferConfirm" type="button" class="btn btn-primary" ><i class="ti ti-check me-1" aria-hidden="true"></i><span th:text="#{transfer.confirm}"></span></button></div></div></div></div>
<div class="modal fade" id="transferPicker" tabindex="-1" aria-labelledby="transferPickerTitle"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content"><div class="modal-header"><h5 id="transferPickerTitle" th:text="#{teleb.selection}"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{qaime.close}"></button></div><div class="modal-body"><form id="transferPickerForm" class="input-group mb-3"><input id="transferQuery" class="form-control" th:aria-label="#{qaime.materialSearch}"><button class="btn btn-light" th:aria-label="#{qaime.search}"><i class="ti ti-search" aria-hidden="true"></i></button></form><div class="table-responsive transfer-picker-scroll"><table class="table table-bordered align-middle"><thead><tr><th th:text="#{qaime.material}"></th><th th:text="#{qaime.barcode}"></th><th th:text="#{qaime.baseUnit}"></th><th th:text="#{transfer.stock}"></th><th th:text="#{teleb.select}"></th></tr></thead><tbody id="transferPickerRows"></tbody></table></div></div></div></div></div>
<script th:inline="javascript">window.TransferI18n={
choose: /*[[#{qaime.chooseWarehouse}]]*/ "",
unit: /*[[#{qaime.unit}]]*/ "",
empty: /*[[#{teleb.noMaterials}]]*/ "",
select: /*[[#{teleb.select}]]*/ "",
delete: /*[[#{qaime.delete}]]*/ "",
loadFailed: /*[[#{teleb.loadFailed}]]*/ "",
saveFailed: /*[[#{teleb.saveFailed}]]*/ "",
saved: /*[[#{transfer.saved}]]*/ "",
selectRequired: /*[[#{teleb.selectRequired}]]*/ "",
duplicate: /*[[#{teleb.duplicate}]]*/ "",
materialsRequired: /*[[#{teleb.materialsRequired}]]*/ "",
sameWarehouse: /*[[#{transfer.sameWarehouse}]]*/ "",
confirmCount: /*[[#{transfer.confirmCount}]]*/ "",
noWarehouses: /*[[#{teleb.noWarehouses}]]*/ "",
quantityInvalid: /*[[#{transfer.quantityInvalid}]]*/ ""
};</script><script th:src="@{/custom/js/birbasaTransfer.js}" defer></script></div></body></html>
