<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body>
<div layout:fragment="content" id="qaimePage" th:data-base="@{/eczaxana/qaimeler}">
    <link rel="stylesheet" th:href="@{/custom/css/qaimeler.css}">
    <input type="hidden" id="qaimeCsrf" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"
           th:data-header="${_csrf.headerName}">
    <div class="qaime-heading">
        <div class="d-flex align-items-center gap-3"><span class="qaime-title-icon"><i
                class="ti ti-clipboard-list"></i></span>
            <div><h4 class="mb-1" th:text="#{qaime.title}"></h4>
                <p class="text-muted mb-0" th:text="#{qaime.subtitle}"></p></div>
        </div>
        <div class="qaime-toolbar d-flex align-items-end gap-2 flex-wrap">
            <div class="qaime-warehouse"><label for="qaimeWarehouse" class="form-label"
                                                th:text="#{qaime.warehouse}"></label><select id="qaimeWarehouse"
                                                                                             class="form-select">
                <option value="" th:text="#{qaime.chooseWarehouse}"></option>
                <option th:each="w:${warehouses}" th:value="${w.anbarId}" th:text="${w.anbarAdi}"></option>
            </select></div>
            <div class="qaime-year"><label for="qaimeYear" class="form-label" th:text="#{qaime.year}"></label><select
                    id="qaimeYear" class="form-select" disabled>
                <option value="" th:text="#{qaime.chooseYear}"></option>
            </select></div>
            <button type="button" class="btn btn-primary" id="qaimeSearch" disabled><i class="ti ti-search me-1"
                                                                                       aria-hidden="true"></i><span
                    th:text="#{qaime.search}"></span></button>
            <button type="button" class="btn btn-light" data-bs-toggle="offcanvas" data-bs-target="#qaimeFilter"><i
                    class="ti ti-filter me-1" aria-hidden="true"></i><span th:text="#{qaime.filter}"></span></button>
            <div class="ms-auto">
                <button type="button" class="btn btn-primary" id="qaimeNew" disabled><i class="ti ti-plus me-1"
                                                                                        aria-hidden="true"></i><span
                        th:text="#{qaime.new}"></span></button>
            </div>
        </div>
    </div>
    <div id="qaimeNotice" class="alert d-none" role="status" aria-live="polite"></div>
    <section class="card border-0 shadow-sm">
        <div class="card-header bg-white d-flex align-items-center justify-content-between"><h6 class="mb-0"><span
                th:text="#{qaime.title}"></span> <span id="qaimeCount"
                                                       class="badge bg-primary-subtle text-primary">0</span></h6><span
                id="qaimeLoading" class="small text-muted" aria-live="polite"></span></div>
        <div class="table-responsive qaime-table-scroll">
            <table class="table table-hover table-bordered align-middle mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th th:text="#{qaime.number}"></th>
                    <th th:text="#{qaime.date}"></th>
                    <th th:text="#{qaime.time}"></th>
                    <th th:text="#{qaime.operation}"></th>
                    <th th:text="#{qaime.direction}"></th>
                    <th th:text="#{qaime.company}"></th>
                    <th th:text="#{qaime.documentType}"></th>
                    <th th:text="#{qaime.document}"></th>
                    <th th:text="#{qaime.receiver}"></th>
                    <th th:text="#{qaime.sender}"></th>
                    <th th:text="#{qaime.note}"></th>
                    <th th:text="#{qaime.actions}"></th>
                </tr>
                </thead>
                <tbody id="qaimeRows"></tbody>
            </table>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center gap-2 flex-wrap"><span
                id="qaimePageLabel" class="small text-muted"></span>
            <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-light" id="qaimePrevious" disabled><i
                        class="ti ti-chevron-left me-1" aria-hidden="true"></i><span th:text="#{qaime.previous}"></span>
                </button>
                <button type="button" class="btn btn-sm btn-light" id="qaimeNext" disabled><i
                        class="ti ti-chevron-right me-1" aria-hidden="true"></i><span th:text="#{qaime.next}"></span>
                </button>
            </div>
            <label class="d-flex gap-2 align-items-center small"><span th:text="#{qaime.pageSize}"></span><select
                    id="qaimePageSize" class="form-select form-select-sm w-auto">
                <option>10</option>
                <option selected>25</option>
                <option>50</option>
                <option>100</option>
            </select></label></div>
    </section>
    <section class="card border-0 shadow-sm" id="qaimeDetails">
        <div class="card-header bg-white d-flex align-items-center justify-content-between gap-2"><h6 class="mb-0"><span
                th:text="#{qaime.details}"></span> <span id="qaimeSelected" class="text-primary"></span></h6>
            <button type="button" class="btn btn-sm btn-outline-primary" id="qaimeAddMaterial" disabled><i
                    class="ti ti-plus me-1" aria-hidden="true"></i><span th:text="#{qaime.addMaterial}"></span></button>
        </div>
        <div id="qaimeDetailSummary" class="qaime-detail-summary d-none"></div>
        <div class="table-responsive qaime-table-scroll">
            <table class="table table-bordered align-middle mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th th:text="#{qaime.material}"></th>
                    <th th:text="#{qaime.barcode}"></th>
                    <th th:text="#{qaime.unit}"></th>
                    <th th:text="#{qaime.boxes}"></th>
                    <th th:text="#{qaime.perBox}"></th>
                    <th th:text="#{qaime.quantity}"></th>
                    <th th:text="#{qaime.purchasePrice}"></th>
                    <th th:text="#{qaime.vat}"></th>
                    <th th:text="#{qaime.netTotal}"></th>
                    <th th:text="#{qaime.vatTotal}"></th>
                    <th th:text="#{qaime.purchaseTotal}"></th>
                    <th th:text="#{qaime.basePrice}"></th>
                    <th th:text="#{qaime.markup}"></th>
                    <th th:text="#{qaime.salePrice}"></th>
                    <th th:text="#{qaime.saleTotal}"></th>
                    <th th:text="#{qaime.expiry}"></th>
                    <th th:text="#{qaime.lot}"></th>
                    <th th:text="#{qaime.note}"></th>
                    <th th:text="#{qaime.actions}"></th>
                </tr>
                </thead>
                <tbody id="qaimeMaterialRows"></tbody>
            </table>
        </div>
        <div class="card-footer bg-white d-flex justify-content-end gap-3 flex-wrap"><span class="qaime-total"><span
                th:text="#{qaime.purchaseTotal}"></span>: <b id="qaimePurchaseTotal">—</b></span><span
                class="qaime-total qaime-total-sale"><span th:text="#{qaime.saleTotal}"></span>: <b id="qaimeSaleTotal">—</b></span>
        </div>
    </section>
    <div class="offcanvas offcanvas-top offcanvas-top_ka shadow-lg" tabindex="-1" id="qaimeFilter"
         aria-labelledby="qaimeFilterTitle">
        <div class="offcanvas-header border-bottom bg-light py-3"><h5 class="mb-0" id="qaimeFilterTitle"
                                                                      th:text="#{qaime.filter}"></h5>
            <button class="btn-close" type="button" data-bs-dismiss="offcanvas" th:aria-label="#{qaime.close}"></button>
        </div>
        <div class="offcanvas-body">
            <form id="qaimeFilterForm">
                <div class="row g-3">
                    <div class="col-lg-3 col-md-6"><label class="form-label" for="qaimeFilterForm-from"
                                                          th:text="#{qaime.from}"></label><input
                            id="qaimeFilterForm-from" th:aria-label="#{qaime.from}" class="form-control" name="from"
                            type="date"></div>
                    <div class="col-lg-3 col-md-6"><label class="form-label" for="qaimeFilterForm-to"
                                                          th:text="#{qaime.to}"></label><input id="qaimeFilterForm-to"
                                                                                               th:aria-label="#{qaime.to}"
                                                                                               class="form-control"
                                                                                               name="to" type="date">
                    </div>
                    <div class="col-lg-3 col-md-6">
                        <label class="form-label"
                               for="qaimeFilterForm-direction"
                               th:text="#{qaime.direction}">
                            İstiqamət
                        </label>

                        <select id="qaimeFilterForm-direction"
                                th:aria-label="#{qaime.direction}"
                                class="form-select"
                                name="direction">

                            <option value="" th:text="#{common.all}">Hamısı</option>
                            <option value="G" th:text="#{qaime.incoming}">Giriş</option>
                            <option value="C" th:text="#{qaime.outgoing}">Çıxış</option>

                        </select>
                    </div>
                    <div class="col-lg-3 col-md-6"><label class="form-label" for="qaimeFilterForm-operation"
                                                          th:text="#{qaime.operation}"></label><select
                            id="qaimeFilterForm-operation" th:aria-label="#{qaime.operation}" class="form-select"
                            name="operation"></select></div>
                    <div class="col-lg-3 col-md-6"><label class="form-label" for="qaimeFilterForm-company"
                                                          th:text="#{qaime.company}"></label><input
                            id="qaimeFilterForm-company" th:aria-label="#{qaime.company}" class="form-control"
                            name="company" type="text" maxlength="1000"></div>
                    <div class="col-lg-3 col-md-6"><label class="form-label" for="qaimeFilterForm-document"
                                                          th:text="#{qaime.document}"></label><input
                            id="qaimeFilterForm-document" th:aria-label="#{qaime.document}" class="form-control"
                            name="document" type="text" maxlength="1000"></div>
                    <div class="col-lg-3 col-md-6"><label class="form-label" for="qaimeFilterForm-receiver"
                                                          th:text="#{qaime.receiver}"></label><input
                            id="qaimeFilterForm-receiver" th:aria-label="#{qaime.receiver}" class="form-control"
                            name="receiver" type="text" maxlength="1000"></div>
                    <div class="col-lg-3 col-md-6"><label class="form-label" for="qaimeFilterForm-sender"
                                                          th:text="#{qaime.sender}"></label><input
                            id="qaimeFilterForm-sender" th:aria-label="#{qaime.sender}" class="form-control"
                            name="sender" type="text" maxlength="1000"></div>
                    <div class="col-lg-3 col-md-6"><label class="form-label" for="qaimeFilterForm-note"
                                                          th:text="#{qaime.note}"></label><input
                            id="qaimeFilterForm-note" th:aria-label="#{qaime.note}" class="form-control" name="note"
                            type="text" maxlength="1000"></div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button type="button" class="btn btn-light" id="qaimeFilterClear"><i class="ti ti-refresh me-1"
                                                                                         aria-hidden="true"></i><span
                            th:text="#{qaime.clear}"></span></button>
                    <button class="btn btn-primary" th:text="#{qaime.apply}"></button>
                </div>
            </form>
        </div>
    </div>
    <div class="qaime-editor d-none" tabindex="-1" id="qaimeEditor" aria-labelledby="qaimeEditorTitle">
        <div class="qaime-editor-shell">
            <div class="qaime-editor-content">
                <div class="qaime-editor-heading">
                    <div class="d-flex align-items-center gap-3"><i class="ti ti-file-plus qaime-popup-icon"
                                                                    aria-hidden="true"></i><h4 id="qaimeEditorTitle"
                                                                                               class="mb-0"></h4></div>
                    <button class="btn btn-light" type="button" id="qaimeBack"><i class="ti ti-arrow-left me-1" aria-hidden="true"></i><span th:text="#{qaime.backToList}"></span></button>
                </div>
                <div class="qaime-editor-body">
                    <div id="qaimeEditorError" class="alert alert-danger d-none" role="alert"></div>
                    <section class="qaime-form-section">
                        <button class="qaime-section-heading" type="button" data-bs-toggle="collapse"
                                data-bs-target="#qaimeHeaderFields" aria-expanded="true"
                                aria-controls="qaimeHeaderFields"><i class="ti ti-file-description"
                                                                     aria-hidden="true"></i><span
                                th:text="#{qaime.details}"></span><i class="ti ti-chevron-down ms-auto"
                                                                     aria-hidden="true"></i></button>
                        <div class="collapse show" id="qaimeHeaderFields">
                            <form id="qaimeHeaderForm" class="p-3">
                                <div class="row g-2 qaime-header-fields">
                                    <div class="col-md-4 col-xl-2"><label class="form-label"
                                                                          for="qaimeHeaderForm-emeliyyat_novu_id"
                                                                          th:text="#{qaime.operation}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-arrows-exchange" aria-hidden="true"></i></span><select
                                            id="qaimeHeaderForm-emeliyyat_novu_id" th:aria-label="#{qaime.operation}"
                                            class="form-select" name="emeliyyat_novu_id" required></select></div></div>
                                    <div class="col-md-4 col-xl-2"><label class="form-label"
                                                                          for="qaimeHeaderForm-qaime_tarixi"
                                                                          th:text="#{qaime.date}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-calendar" aria-hidden="true"></i></span><input
                                            id="qaimeHeaderForm-qaime_tarixi" th:aria-label="#{qaime.date}"
                                            class="form-control"
                                            name="qaime_tarixi" type="date" required></div></div>
                                    <div class="col-md-4 col-xl-2"><label class="form-label"
                                                                          for="qaimeHeaderForm-qaime_saati"
                                                                          th:text="#{qaime.time}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-clock" aria-hidden="true"></i></span><input
                                            id="qaimeHeaderForm-qaime_saati"
                                            th:aria-label="#{qaime.time}"
                                            class="form-control"
                                            name="qaime_saati" type="time"></div>
                                    </div>
                                    <div class="col-md-4 col-xl-2"><label class="form-label"
                                                                          for="qaimeHeaderForm-sened_novu"
                                                                          th:text="#{qaime.documentType}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-file-description" aria-hidden="true"></i></span><input
                                            id="qaimeHeaderForm-sened_novu" th:aria-label="#{qaime.documentType}"
                                            class="form-control"
                                            name="sened_novu" type="text" maxlength="1000"></div></div>
                                    <div class="col-md-4 col-xl-2"><label class="form-label"
                                                                          for="qaimeHeaderForm-sened_no"
                                                                          th:text="#{qaime.document}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-hash" aria-hidden="true"></i></span><input
                                            id="qaimeHeaderForm-sened_no" th:aria-label="#{qaime.document}"
                                            class="form-control"
                                            name="sened_no" type="text" maxlength="1000"></div></div>
                                    <div class="col-md-4 col-xl-2"><label class="form-label"
                                                                          for="qaimeHeaderForm-sened_tarixi"
                                                                          th:text="#{qaime.documentDate}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-calendar-event" aria-hidden="true"></i></span><input
                                            id="qaimeHeaderForm-sened_tarixi" th:aria-label="#{qaime.documentDate}"
                                            class="form-control"
                                            name="sened_tarixi" type="date"></div></div>
                                    <div class="col-md-6 col-xl-3"><label class="form-label"
                                                                          for="qaimeHeaderForm-firma_id"
                                                                          th:text="#{qaime.company}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-building" aria-hidden="true"></i></span><select
                                            id="qaimeHeaderForm-firma_id" th:aria-label="#{qaime.company}"
                                            class="form-select"
                                            name="firma_id"></select></div></div>
                                    <div class="col-md-6 col-xl-3"><label class="form-label"
                                                                          for="qaimeHeaderForm-teslim_alan_personal_id"
                                                                          th:text="#{qaime.receiver}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-user-check" aria-hidden="true"></i></span><select
                                            id="qaimeHeaderForm-teslim_alan_personal_id"
                                            th:aria-label="#{qaime.receiver}"
                                            class="form-select" name="teslim_alan_personal_id"></select></div></div>
                                    <div class="col-md-6 col-xl-3"><label class="form-label"
                                                                          for="qaimeHeaderForm-teslim_eden"
                                                                          th:text="#{qaime.sender}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-user-up" aria-hidden="true"></i></span><input
                                            id="qaimeHeaderForm-teslim_eden" th:aria-label="#{qaime.sender}"
                                            class="form-control"
                                            name="teslim_eden" type="text" maxlength="1000"></div></div>
                                    <div class="col-md-6 col-xl-3"><label class="form-label"
                                                                          for="qaimeHeaderForm-aciqlama"
                                                                          th:text="#{qaime.note}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-notes" aria-hidden="true"></i></span><input
                                            id="qaimeHeaderForm-aciqlama"
                                            th:aria-label="#{qaime.note}"
                                            class="form-control"
                                            name="aciqlama" type="text"
                                            maxlength="1000"></div></div>
                                </div>
                            </form>
                        </div>
                    </section>
                    <section id="qaimeDraftPanel" class="qaime-form-section mt-3">
                        <button class="qaime-section-heading" type="button" data-bs-toggle="collapse"
                                data-bs-target="#qaimeDraftContent" aria-expanded="true"
                                aria-controls="qaimeDraftContent"><i class="ti ti-box" aria-hidden="true"></i><span
                                th:text="#{qaime.materials}"></span><i class="ti ti-chevron-down ms-auto"
                                                                       aria-hidden="true"></i></button>
                        <div class="collapse show" id="qaimeDraftContent">
                            <div id="qaimeInlineMaterial"></div>
                            <div class="table-responsive qaime-draft-table mx-3">
                                <table class="table table-bordered mb-0">
                                    <thead>
                                    <tr>
                                        <th th:text="#{qaime.material}"></th>
                                        <th th:text="#{qaime.group}"></th>
                                        <th th:text="#{qaime.unit}"></th>
                                        <th th:text="#{qaime.boxes}"></th>
                                        <th th:text="#{qaime.perBox}"></th>
                                        <th th:text="#{qaime.quantity}"></th>
                                        <th th:text="#{qaime.purchasePrice}"></th>
                                        <th th:text="#{qaime.basePrice}"></th>
                                        <th th:text="#{qaime.markup}"></th>
                                        <th th:text="#{qaime.expiry}"></th>
                                        <th th:text="#{qaime.lot}"></th>
                                        <th th:text="#{qaime.actions}"></th>
                                    </tr>
                                    </thead>
                                    <tbody id="qaimeDraftRows"></tbody>
                                </table>
                            </div>
                            <div class="qaime-draft-totals"><span><span th:text="#{qaime.quantity}"></span>: <b
                                    id="qaimeDraftQuantity">0</b></span><span><span
                                    th:text="#{qaime.purchaseTotal}"></span>: <b id="qaimeDraftTotal">0.00</b></span>
                            </div>
                        </div>
                    </section>
                </div>
                <div class="qaime-editor-actions">
                    <button type="button" class="btn btn-light" id="qaimeCancel"><i class="ti ti-x me-1"
                                                                                           aria-hidden="true"></i><span
                            th:text="#{qaime.cancel}"></span></button>
                    <button class="btn btn-primary" id="qaimeSave" type="submit" form="qaimeHeaderForm"><i
                            class="ti ti-device-floppy me-1" aria-hidden="true"></i><span
                            th:text="#{qaime.save}"></span></button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="qaimeMaterialEditor" tabindex="-1" aria-labelledby="qaimeMaterialTitle">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="qaimeMaterialTitle"
                                              th:text="#{qaime.addMaterial}"></h5>
                    <button class="btn-close" type="button" data-bs-dismiss="modal"
                            th:aria-label="#{qaime.close}"></button>
                </div>
                <form id="qaimeMaterialForm"><div class="modal-body">
<div id="qaimeMaterialError" class="alert alert-danger d-none" role="alert"></div>
<div class="qaime-material-entry"><div class="qaime-product-fields"><div class="qaime-material-field qaime-catalog-search"><label for="qaimeCatalogSearch" class="form-label" th:text="#{qaime.materialSearch}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-search" aria-hidden="true"></i></span><input id="qaimeCatalogSearch" class="form-control" type="search" th:placeholder="#{qaime.materialSearch}" autocomplete="off"></div></div><div class="qaime-material-field"><label class="form-label" for="qaimeMaterialForm-mehsul_qrupu_id"
                                                         th:text="#{qaime.group}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-category" aria-hidden="true"></i></span><select
                                    id="qaimeMaterialForm-mehsul_qrupu_id" th:aria-label="#{qaime.group}"
                                    class="form-select" name="mehsul_qrupu_id" required></select></div></div><div class="qaime-material-field"><label class="form-label" for="qaimeMaterialForm-material_id"
                                                         th:text="#{qaime.material}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-package" aria-hidden="true"></i></span><select
                                    id="qaimeMaterialForm-material_id" th:aria-label="#{qaime.material}"
                                    class="form-select" name="material_id" required></select></div></div><div class="qaime-material-field"><label class="form-label" for="qaimeMaterialUnit"
                                                         th:text="#{qaime.unit}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-ruler" aria-hidden="true"></i></span><input id="qaimeMaterialUnit"
                                                                                                class="form-control"
                                                                                                readonly
                                                                                                th:aria-label="#{qaime.unit}"></div>
                            </div><div class="qaime-material-field"><label class="form-label" for="qaimeMaterialForm-son_istifade_tarixi"
                                                         th:text="#{qaime.expiry}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-calendar" aria-hidden="true"></i></span><input
                                    id="qaimeMaterialForm-son_istifade_tarixi" th:aria-label="#{qaime.expiry}"
                                    class="form-control" name="son_istifade_tarixi" type="date"></div></div><div class="qaime-material-field"><label class="form-label" for="qaimeMaterialForm-seriya_no"
                                                         th:text="#{qaime.lot}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-barcode" aria-hidden="true"></i></span><input
                                    id="qaimeMaterialForm-seriya_no" th:aria-label="#{qaime.lot}" class="form-control"
                                    name="seriya_no" type="text" maxlength="1000"></div></div><div class="qaime-material-field"><label class="form-label" for="qaimeMaterialForm-aciqlama"
                                                         th:text="#{qaime.note}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-notes" aria-hidden="true"></i></span><input
                                    id="qaimeMaterialForm-aciqlama" th:aria-label="#{qaime.note}" class="form-control"
                                    name="aciqlama" type="text" maxlength="1000"></div></div></div><div class="qaime-price-fields"><div class="qaime-material-field"><label class="form-label" for="qaimeMaterialForm-qutu_sayi"
                                                         th:text="#{qaime.boxes}"></label><div class="input-group input-group-sm"><span class="input-group-text bg-light"><i class="ti ti-box" aria-hidden="true"></i></span><input
                                    id="qaimeMaterialForm-qutu_sayi" th:aria-label="#{qaime.boxes}" class="form-control"
