<!DOCTYPE html><html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><div><h4 class="mb-1"><i class="ti ti-medical-cross text-primary me-2"></i>Xidmətlər</h4><p class="text-muted mb-0">Ümumi tibbi xidmət kataloqu</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newService"><i class="ti ti-plus me-1"></i>Yeni xidmət</button></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
<div class="card border-0 shadow-sm"><div class="card-header d-flex align-items-center justify-content-between gap-3"><div><h5 class="mb-1">Xidmət siyahısı</h5><small class="text-muted" th:text="|${#lists.size(xidmetler)} xidmət|"></small></div><form method="get" th:action="@{/parXidmet}"><select class="form-select" name="qrupId" onchange="this.form.submit()"><option value="">Bütün xidmət qrupları</option><option th:each="q:${qruplar}" th:value="${q.id}" th:text="${q.tamYol}" th:selected="${q.id==selectedQrupId}"></option></select></form></div><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="bg-light"><tr><th class="ps-3">Kod</th><th>Xidmət</th><th>Qrup</th><th>Tip</th><th>Mühasibat</th><th>Hesabat</th><th>Status</th><th></th></tr></thead><tbody>
<tr th:each="x:${xidmetler}"><td class="ps-3"><span class="badge bg-light text-dark border" th:text="${x.kod}"></span></td><td><div class="d-flex gap-2 align-items-center"><span class="avatar avatar-sm bg-info-subtle text-info rounded-circle"><i class="ti ti-stethoscope"></i></span><div><div class="fw-semibold" th:text="${x.ad}"></div><small class="text-muted" th:text="${x.beynelxalqKod?:''}"></small></div></div></td><td th:text="${x.qrupAdi}"></td><td><span class="badge bg-primary-subtle text-primary" th:text="${x.tipAdi}"></span></td><td th:text="${x.muhasibatKoduAdi}"></td><td th:text="${x.hesabatNovuAdi?:'—'}"></td><td><span class="badge" th:classappend="${x.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${x.aktiv}?'Aktiv':'Passiv'"></span></td><td class="text-end pe-3"><button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="|#editX${x.id}|"><i class="ti ti-edit"></i></button></td></tr>
<tr th:if="${#lists.isEmpty(xidmetler)}"><td colspan="8" class="text-center text-muted py-5"><i class="ti ti-medical-cross-off fs-2 d-block"></i>Xidmət tapılmadı.</td></tr></tbody></table></div></div></div>
<div class="modal fade" id="newService" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/parXidmet/yeni}"><div class="modal-header border-0 pb-0"><div class="d-flex gap-3"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-medical-cross fs-24"></i></span><div><h5 class="mb-1">Yeni xidmət</h5><small class="text-muted">Xidmətin əsas məlumatlarını daxil edin</small></div></div><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body pt-4"><div class="row g-3"><div class="col-md-4"><input class="form-control" name="kod" placeholder="Xidmət kodu" required></div><div class="col-md-8"><input class="form-control" name="ad" placeholder="Xidmət adı" required></div><div class="col-md-4"><select class="form-select" name="qrupId" required><option value="" disabled selected>Xidmət qrupu seçin</option><option th:each="q:${qruplar}" th:value="${q.id}" th:text="${q.tamYol}"></option></select></div><div class="col-md-4"><select class="form-select" name="muhasibatKoduId" required><option value="" disabled selected>Mühasibat kodu seçin</option><option th:each="o:${muhasibatKodlari}" th:value="${o.id}" th:text="${o.ad}"></option></select></div><div class="col-md-4"><select class="form-select" name="xidmetTipiId" required><option value="" disabled selected>Xidmət tipi seçin</option><option th:each="o:${xidmetTipleri}" th:value="${o.id}" th:text="${o.ad}"></option></select></div></div></div><div class="modal-footer border-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal">İmtina</button><button class="btn btn-primary"><i class="ti ti-plus me-1"></i>Yarat</button></div></form></div></div></div>
<div th:each="x:${xidmetler}" class="modal fade" th:id="|editX${x.id}|" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/parXidmet/yenile}"><input type="hidden" name="xidmetId" th:value="${x.id}"><div class="modal-header"><h5><i class="ti ti-medical-cross text-primary me-2"></i>Xidməti redaktə et</h5><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3"><div class="col-12"><label class="form-label">Xidmət adı</label><input class="form-control" name="ad" th:value="${x.ad}" required></div><div class="col-md-4"><label class="form-label">Qrup</label><select class="form-select" name="qrupId" required><option th:each="q:${qruplar}" th:value="${q.id}" th:text="${q.tamYol}" th:selected="${q.id==x.qrupId}"></option></select></div><div class="col-md-4"><label class="form-label">Mühasibat kodu</label><select class="form-select" name="muhasibatKoduId" required><option th:each="o:${muhasibatKodlari}" th:value="${o.id}" th:text="${o.ad}" th:selected="${o.id==x.muhasibatKoduId}"></option></select></div><div class="col-md-4"><label class="form-label">Xidmət tipi</label><select class="form-select" name="xidmetTipiId" required><option th:each="o:${xidmetTipleri}" th:value="${o.id}" th:text="${o.ad}" th:selected="${o.id==x.tipId}"></option></select></div><div class="col-md-6"><input class="form-control" name="beynelxalqKod" th:value="${x.beynelxalqKod}" placeholder="Beynəlxalq kod"></div><div class="col-md-6"><input class="form-control" name="beynelxalqAd" th:value="${x.beynelxalqAd}" placeholder="Beynəlxalq ad"></div><div class="col-md-6"><select class="form-select" name="hesabatNovuId"><option value="">Hesabat növü yoxdur</option><option th:each="o:${hesabatNovleri}" th:value="${o.id}" th:text="${o.ad}" th:selected="${o.id==x.hesabatNovuId}"></option></select></div><div class="col-md-6"><select class="form-select" name="hesabatMecburiyyetiId"><option value="">Hesabat məcburiyyəti yoxdur</option><option th:each="o:${hesabatMecburiyyetleri}" th:value="${o.id}" th:text="${o.ad}" th:selected="${o.id==x.hesabatMecburiyyetiId}"></option></select></div><div class="col-12"><div class="d-flex justify-content-between border rounded bg-light p-3"><span><i class="ti ti-power text-primary me-2"></i>Aktiv xidmət</span><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="aktiv" value="true" th:checked="${x.aktiv}"></div></div></div></div></div><div class="modal-footer"><button class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i>Yadda saxla</button></div></form></div></div></div>
</div></body></html>
