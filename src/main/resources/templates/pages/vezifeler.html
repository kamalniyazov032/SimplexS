<!DOCTYPE html><html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><div><h4>Vəzifələr</h4><p class="mb-0">Ümumi vəzifə siyahısı</p></div><div class="d-flex gap-2"><button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#vezifeFilter" aria-controls="vezifeFilter"><i class="ti ti-filter me-1"></i>Filter<span th:if="${filterApplied}" class="badge bg-white text-primary ms-2">Aktiv</span></button><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newVezife"><i class="ti ti-plus me-1"></i>Yeni vəzifə</button></div></div>
<div class="offcanvas offcanvas-top offcanvas-top_ka shadow-lg" tabindex="-1" id="vezifeFilter" style="--bs-offcanvas-height:190px!important;height:190px!important;min-height:190px!important;max-height:190px!important"><div class="offcanvas-header border-bottom bg-light py-3"><h5 class="mb-0 fw-bold text-primary"><i class="ti ti-filter me-2"></i>Vəzifələr üzrə ətraflı axtarış</h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Bağla"></button></div><div class="offcanvas-body py-3"><form method="get" th:action="@{/vezifeler}"><div class="row g-2 align-items-end"><div class="col-xl-5 col-md-6"><label class="form-label small text-muted">Axtarış</label><div class="input-group"><span class="input-group-text bg-light"><i class="ti ti-search"></i></span><input class="form-control" name="q" th:value="${q}" placeholder="Vəzifə adı və ya açıqlama..."></div></div><div class="col-xl-3 col-md-6"><label class="form-label small text-muted">Status</label><select class="form-select" name="status"><option value="">Bütün statuslar</option><option value="aktiv" th:selected="${selectedStatus=='aktiv'}">Aktiv</option><option value="passiv" th:selected="${selectedStatus=='passiv'}">Passiv</option></select></div><div class="col-xl-4 col-md-6"><div class="d-flex gap-2"><button class="btn btn-primary flex-fill"><i class="ti ti-search me-1"></i>Axtar</button><a class="btn btn-light flex-fill" th:href="@{/vezifeler}">Təmizlə</a></div></div></div></form></div></div>
<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div class="card border-0 shadow-sm"><div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th class="ps-3">Kod</th><th>Ad</th><th>Açıqlama</th><th>Sıra</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="v:${vezifeler}"><td class="ps-3 fw-semibold" th:text="${v.vezifeKodu}"></td><td th:text="${v.vezifeAdi}"></td><td th:text="${v.aciqlama?:'—'}"></td><td th:text="${v.siraNo?:'—'}"></td><td><span class="badge" th:classappend="${v.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${v.aktiv}?'Aktiv':'Passiv'"></span></td><td class="text-end"><button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="|#editV${v.vezifeId}|"><i class="ti ti-edit"></i></button></td></tr><tr th:if="${#lists.isEmpty(vezifeler)}"><td colspan="6" class="text-center py-5 text-muted">Vəzifə tapılmadı.</td></tr></tbody></table></div></div></div>
<div class="modal fade" id="newVezife" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/vezifeler/yeni}">
<div class="modal-header border-0 pb-0"><div class="d-flex align-items-center gap-3"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-briefcase fs-24"></i></span><div><h5 class="mb-1">Yeni vəzifə</h5><p class="mb-0 text-muted small">Yeni personal vəzifəsi yaradın</p></div></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Bağla"></button></div>
<div class="modal-body pt-4"><div class="row g-3">
<div class="col-12"><div class="input-group"><span class="input-group-text bg-light"><i class="ti ti-code"></i></span><input class="form-control" name="kod" placeholder="Vəzifə kodu" aria-label="Vəzifə kodu" required></div></div>
<div class="col-12"><div class="input-group"><span class="input-group-text bg-light"><i class="ti ti-briefcase"></i></span><input class="form-control" name="ad" placeholder="Vəzifə adı" aria-label="Vəzifə adı" required></div></div>
<div class="col-12"><div class="input-group"><span class="input-group-text bg-light align-items-start pt-3"><i class="ti ti-notes"></i></span><textarea class="form-control" name="aciqlama" rows="3" placeholder="Açıqlama (istəyə bağlı)" aria-label="Açıqlama"></textarea></div></div>
</div></div><div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Ləğv et</button><button class="btn btn-primary"><i class="ti ti-plus me-1"></i>Vəzifə yarat</button></div>
</form></div></div></div>
<div th:each="v:${vezifeler}" class="modal fade" th:id="|editV${v.vezifeId}|" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/vezifeler/yenile}"><input type="hidden" name="vezifeId" th:value="${v.vezifeId}">
<div class="modal-header border-0 pb-0"><div class="d-flex align-items-center gap-3"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-edit fs-24"></i></span><div><h5 class="mb-1">Vəzifəni redaktə et</h5><p class="mb-0 text-muted small" th:text="|Kod: ${v.vezifeKodu}|"></p></div></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Bağla"></button></div>
<div class="modal-body pt-4"><div class="row g-3">
<div class="col-12"><div class="input-group"><span class="input-group-text bg-light"><i class="ti ti-briefcase"></i></span><input class="form-control" name="ad" th:value="${v.vezifeAdi}" placeholder="Vəzifə adı" aria-label="Vəzifə adı" required></div></div>
<div class="col-12"><div class="input-group"><span class="input-group-text bg-light align-items-start pt-3"><i class="ti ti-notes"></i></span><textarea class="form-control" name="aciqlama" rows="3" th:text="${v.aciqlama}" placeholder="Açıqlama (istəyə bağlı)" aria-label="Açıqlama"></textarea></div></div>
<div class="col-12"><div class="d-flex align-items-center justify-content-between rounded border bg-light p-3"><div class="d-flex align-items-center gap-2"><span th:class="${v.aktiv} ? 'text-success' : 'text-danger'"><i class="ti ti-power fs-20"></i></span><div><div class="fw-semibold">Vəzifənin statusu</div><small class="text-muted">Aktiv vəzifələr personal seçimində görünür</small></div></div><div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" name="aktiv" value="true" role="switch" th:checked="${v.aktiv}" th:aria-label="|${v.vezifeAdi} statusu|"></div></div></div>
</div></div><div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Ləğv et</button><button class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i>Yadda saxla</button></div>
</form></div></div></div>
</div></body></html>
