<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body><div layout:fragment="content">
<style>
.translation-table th{white-space:nowrap}.translation-table td{min-width:260px;vertical-align:top}.translation-table td:first-child{min-width:290px;position:sticky;left:0;z-index:2;background:var(--bs-body-bg)}.translation-table th:first-child{position:sticky;left:0;z-index:3;background:#f8f9fa}.translation-cell:has(input:placeholder-shown){background:var(--bs-warning-bg-subtle)}.translation-key{font-size:11px;word-break:break-all}
</style>
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3"><div><h4 class="mb-1"><i class="ti ti-language text-primary me-2"></i><span th:text="#{translations.title}">Tərcümələr</span></h4><p class="text-muted mb-0" th:text="#{translations.subtitle}">Modul üzrə interfeys tərcümələrini bütün dillərdə idarə edin</p></div><button th:if="${bolme!='melumat'}" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newLanguage"><i class="ti ti-plus me-1"></i><span th:text="#{translations.addLanguage}">Yeni dil</span></button></div>
<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"><i class="ti ti-circle-check me-2"></i><span th:text="${successMessage}"></span><button class="btn-close" data-bs-dismiss="alert"></button></div>
<ul class="nav nav-pills bg-white shadow-sm rounded p-2 mb-4 gap-2"><li class="nav-item"><a class="nav-link" th:classappend="${bolme!='melumat'}?' active'" th:href="@{/tercumeler}"><i class="ti ti-layout-dashboard me-1"></i>İnterfeys mətnləri</a></li><li class="nav-item"><a class="nav-link" th:classappend="${bolme=='melumat'}?' active'" th:href="@{/tercumeler(bolme='melumat')}"><i class="ti ti-database me-1"></i>DB məlumatları</a></li></ul>
<th:block th:if="${bolme=='melumat'}">
<div class="card border-0 shadow-sm mb-4"><div class="card-body"><form method="get" th:action="@{/tercumeler}" class="row g-3 align-items-end"><input type="hidden" name="bolme" value="melumat"><div class="col-lg-4"><label class="form-label">Məlumat növü</label><select class="form-select" name="melumatNovu" onchange="this.form.submit()"><option th:each="n:${melumatNovleri}" th:value="${n.kod}" th:selected="${n.kod==selectedMelumatNovu}" th:text="${n.ad}"></option></select></div><div class="col-lg-5"><label class="form-label">Axtarış</label><div class="input-group"><input class="form-control" name="q" th:value="${q}" placeholder="Kod və ya Azərbaycan dilində ad"><button class="btn btn-primary"><i class="ti ti-search"></i></button></div></div><div class="col-lg-3"><div class="form-check form-switch border rounded px-3 py-2"><input class="form-check-input ms-0 me-2" type="checkbox" id="dataMissing" name="yalnizBos" value="true" th:checked="${yalnizBos}" onchange="this.form.submit()"><label for="dataMissing">Yalnız boş tərcümələr</label></div></div></form></div></div>
<div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-bordered align-middle mb-0 translation-table"><thead class="table-light"><tr><th>Azərbaycan dili<small class="d-block text-muted">Kod</small></th><th th:each="d:${tercumeDilleri}"><span th:text="${d.yerliAd}"></span><small class="d-block text-muted text-uppercase" th:text="${d.kod}"></small></th></tr></thead><tbody><tr th:each="t:${melumatSetirleri}"><td><div class="fw-semibold" th:text="${t.azerbaycanca}"></div><code class="translation-key" th:text="${t.kod}"></code></td><td th:each="d:${tercumeDilleri}" class="translation-cell"><form method="post" th:action="@{/tercumeler/yadda-saxla}" class="d-flex gap-2"><input type="hidden" name="bolme" value="melumat"><input type="hidden" name="melumatNovu" th:value="${selectedMelumatNovu}"><input type="hidden" name="menbeId" th:value="${t.id}"><input type="hidden" name="saha" th:value="${t.saha}"><input type="hidden" name="dil" th:value="${d.kod}"><input type="hidden" name="q" th:value="${q}"><input type="hidden" name="yalnizBos" th:value="${yalnizBos}"><input class="form-control" name="deyer" th:value="${t.deyer(d.kod)}" placeholder=" " required><button class="btn btn-outline-primary"><i class="ti ti-device-floppy"></i></button></form></td></tr><tr th:if="${#lists.isEmpty(melumatSetirleri)}"><td class="text-center text-muted py-5" th:colspan="${#lists.size(tercumeDilleri)+1}">Məlumat tapılmadı.</td></tr></tbody></table></div></div>
</th:block>
<th:block th:unless="${bolme=='melumat'}">
<div class="card border-0 shadow-sm mb-4"><div class="card-body"><form method="get" th:action="@{/tercumeler}" class="row g-3 align-items-end"><input type="hidden" name="modul" th:value="${selectedModul}">
<div class="col-lg-4"><label class="form-label" th:text="#{translations.module}">Modul</label><div class="dropdown"><button class="btn btn-light border w-100 d-flex align-items-center justify-content-between text-start" type="button" data-bs-toggle="dropdown" aria-expanded="false"><span class="d-flex align-items-center gap-2"><span class="avatar avatar-xs bg-primary-subtle text-primary rounded"><i th:class="${selectedModulInfo?.ikon ?: 'ti ti-world'}"></i></span><span><small class="text-muted d-block" th:text="${selectedModulInfo?.sistemAdi ?: 'Ümumi'}">Ümumi</small><strong th:text="${selectedModulInfo?.ad ?: 'Ümumi'}">Ümumi</strong></span></span><i class="ti ti-chevron-down"></i></button><div class="dropdown-menu shadow border-0 p-2 w-100" style="max-height:460px;overflow-y:auto"><a th:if="${umumiModul!=null}" class="dropdown-item rounded d-flex align-items-center justify-content-between py-2" th:classappend="${selectedModul=='GLOBAL'}?' active'" th:href="@{/tercumeler(modul='GLOBAL')}"><span class="d-flex align-items-center gap-2"><i class="ti ti-world"></i><span th:text="${umumiModul.ad}">Ümumi</span></span><span class="badge" th:classappend="${selectedModul=='GLOBAL'}?' bg-white text-primary':' bg-light text-dark'" th:text="${umumiModul.acarSayi}"></span></a><th:block th:each="qrup:${modulQruplari}"><div class="dropdown-divider"></div><h6 class="dropdown-header px-2 d-flex align-items-center gap-2"><i th:class="${qrup.value[0].sistemIkonu ?: 'ti ti-apps'}"></i><span th:text="${qrup.value[0].sistemAdi}">Sistem</span></h6><a th:each="m:${qrup.value}" class="dropdown-item rounded d-flex align-items-center justify-content-between py-2" th:style="|padding-left:${12 + m.seviyye * 18}px|" th:classappend="${m.kod==selectedModul}?' active'" th:href="@{/tercumeler(modul=${m.kod})}"><span class="d-flex align-items-center gap-2 text-truncate"><i th:class="${m.ikon ?: 'ti ti-point'}"></i><span class="text-truncate" th:text="${m.ad}"></span></span><span class="badge ms-2" th:classappend="${m.kod==selectedModul}?' bg-white text-primary':' bg-light text-dark'" th:text="${m.acarSayi}"></span></a></th:block></div></div></div>
<div class="col-lg-5"><label class="form-label" th:text="#{common.search}">Axtar</label><div class="input-group"><input class="form-control" name="q" th:value="${q}" th:placeholder="#{common.search}"><button class="btn btn-primary"><i class="ti ti-search me-1"></i><span th:text="#{common.search}">Axtar</span></button></div></div>
<div class="col-lg-3"><div class="form-check form-switch border rounded px-3 py-2 d-flex align-items-center gap-2"><input class="form-check-input ms-0" type="checkbox" id="onlyMissing" name="yalnizBos" value="true" th:checked="${yalnizBos}" onchange="this.form.submit()"><label class="form-check-label" for="onlyMissing" th:text="#{translations.onlyMissing}">Yalnız boş tərcümələr</label></div></div>
</form></div></div>
<div class="row g-3 mb-4"><div class="col-auto" th:each="d:${tercumeDilleri}"><div class="card border-0 shadow-sm"><div class="card-body py-2 px-3 d-flex align-items-center gap-3"><span class="badge bg-primary-subtle text-primary text-uppercase" th:text="${d.kod}">EN</span><div><small class="text-muted d-block" th:text="#{translations.completion}">Tamamlanma</small><strong th:text="|${completion.get(d.kod)}%|">0%</strong></div></div></div></div></div>
<div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-bordered align-middle mb-0 translation-table"><thead class="table-light"><tr><th><span th:text="#{translations.azerbaijani}">Azərbaycan dili</span><small class="d-block text-muted" th:text="#{translations.key}">Açar</small></th><th th:each="d:${tercumeDilleri}"><span th:text="${d.yerliAd}"></span><small class="d-block text-muted text-uppercase" th:text="${d.kod}"></small></th></tr></thead><tbody>
<tr th:each="t:${tercumeler}"><td><div class="fw-semibold mb-1" th:text="${t.azerbaycanca}"></div><code class="translation-key text-muted" th:text="${t.acar}"></code></td><td th:each="d:${tercumeDilleri}" class="translation-cell"><form method="post" th:action="@{/tercumeler/yadda-saxla}" class="d-flex gap-2"><input type="hidden" name="dil" th:value="${d.kod}"><input type="hidden" name="acar" th:value="${t.acar}"><input type="hidden" name="modul" th:value="${selectedModul}"><input type="hidden" name="q" th:value="${q}"><input type="hidden" name="yalnizBos" th:value="${yalnizBos}"><input type="hidden" name="page" th:value="${currentPage}"><input class="form-control" name="deyer" th:value="${t.deyer(d.kod)}" placeholder=" " required><button class="btn btn-outline-primary" th:title="#{common.save}"><i class="ti ti-device-floppy"></i></button></form></td></tr>
<tr th:if="${#lists.isEmpty(tercumeler)}"><td class="text-center text-muted py-5" th:colspan="${#lists.size(tercumeDilleri)+1}" th:text="#{translations.noRows}">Tərcümə tapılmadı.</td></tr>
</tbody></table></div><div class="card-footer bg-white d-flex justify-content-between align-items-center"><small th:text="|${totalCount} nəticə|">0 nəticə</small><div class="btn-group"><a class="btn btn-sm btn-outline-primary" th:classappend="${currentPage==1}?' disabled'" th:href="@{/tercumeler(modul=${selectedModul},q=${q},yalnizBos=${yalnizBos},page=${currentPage-1})}" th:text="#{common.evvelki}">Əvvəlki</a><span class="btn btn-sm btn-light disabled" th:text="|${currentPage} / ${totalPages}|">1 / 1</span><a class="btn btn-sm btn-outline-primary" th:classappend="${currentPage==totalPages}?' disabled'" th:href="@{/tercumeler(modul=${selectedModul},q=${q},yalnizBos=${yalnizBos},page=${currentPage+1})}" th:text="#{common.novbeti}">Növbəti</a></div></div></div>
<div class="modal fade" id="newLanguage"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form method="post" th:action="@{/tercumeler/dil}"><div class="modal-header"><h5 th:text="#{translations.addLanguage}">Yeni dil</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label" th:text="#{translations.languageCode}">Dil kodu</label><input class="form-control mb-3" name="kod" pattern="[a-z]{2,3}(-[A-Z]{2})?" placeholder="en" required><label class="form-label" th:text="#{translations.languageName}">Dilin adı</label><input class="form-control mb-3" name="ad" placeholder="İngilis dili" required><label class="form-label" th:text="#{translations.nativeName}">Yerli adı</label><input class="form-control" name="yerliAd" placeholder="English" required></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal" th:text="#{common.cancel}">İmtina</button><button class="btn btn-primary" th:text="#{common.save}">Yadda saxla</button></div></form></div></div></div>
</th:block>
</div></body></html>
