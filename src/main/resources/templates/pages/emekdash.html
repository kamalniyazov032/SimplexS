<!DOCTYPE html>
<html lang="az"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>


<body>
<div layout:fragment="content">
    <div class="page-header mb-3">
        <div class="row align-items-center">
            <div class="col">
                <div class="breadcrumb-arrow">
                    <h4 class="mb-1">İşçilər</h4>
                    <p class="mb-0">İşçi siyahısı və detal məlumatları</p>
                </div>
            </div>
            <div class="col-auto d-flex gap-2">
                <button class="btn btn-primary mt-2 mt-md-0" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#offcanvasTop" aria-controls="offcanvasTop"><i
                        class="fa-solid fa-filter me-1"></i>Filter
                </button>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add_employee">
                    <i class="ti ti-plus me-1"></i> Yeni İşçi
                </button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-xl-3 col-lg-3">
            <div class="card border-0 shadow-none bg-transparent">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-center table-hover table-borderless mb-0">
                            <tbody>
                            <tr th:each="i : ${#numbers.sequence(1, 4)}">
                                <td class="p-0 pb-2">
                                    <div class="card border shadow-none mb-0 cursor-pointer hover-shadow transition-all">
                                        <div class="card-body p-3">
                                            <div class="d-flex align-items-center justify-content-between">
                                                <div class="d-flex align-items-center gap-3">
                                                    <div class="visit-no border-end pe-3 text-center">
                                                        <span class="text-muted small d-block">Kod</span>
                                                        <span class="fw-bold text-dark">H0001</span>
                                                    </div>
                                                    <div class="visit-info">
                                                        <h6 class="fw-bold mb-0 text-dark">Əhmədov Məmməd</h6>
                                                        <span class="text-muted small"><i
                                                                class="ti ti-stethoscope me-1"></i> Dr. Neyrocərrah</span>
                                                    </div>
                                                </div>
                                                <div class="visit-status">
                                                        <span class="badge bg-success-light text-success rounded-pill px-2">
                                                            Aktiv
                                                        </span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-xl-9 col-lg-9">
            <div class="card shadow-none border h-100 d-flex align-items-center justify-content-center bg-light-subtle">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom py-3">
                        <h5 class="card-title mb-0 fw-bold text-primary">
                            <i class="ti ti-user-plus me-2"></i>Əməkdaş Məlumatları
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="row g-4">
                            <div class="col-lg-3 border-end text-center">
                                <div class="mb-4">
                                    <label class="form-label d-block text-secondary small fw-bold text-uppercase">İşçi Şəkli</label>
                                    <div class="position-relative d-inline-block">
                                        <div class="avatar avatar-xxl mb-2 border rounded-circle bg-light d-flex align-items-center justify-content-center" style="width: 140px; height: 140px;">
                                            <i class="ti ti-photo-plus text-muted display-5"></i>
                                        </div>
                                        <input type="file" class="position-absolute top-0 start-0 opacity-0 w-100 h-100 cursor-pointer">
                                    </div>
                                    <p class="text-muted small mt-2">Dəyişmək üçün klikləyin</p>
                                </div>

                                <div class="form-group pt-3">
                                    <label class="form-label text-secondary small fw-bold text-uppercase">Elektron İmza</label>
                                    <div class="border rounded p-3 bg-light border-dashed">
                                        <i class="ti ti-signature text-muted d-block mb-2 fs-3"></i>
                                        <button class="btn btn-primary-light btn-sm w-100" data-bs-toggle="modal" data-bs-target="#signatureModal">
                                            <i class="ti ti-pencil me-1"></i> İmza Əlavə Et
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-9">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary">Adı</label>
                                        <input type="text" class="form-control" placeholder="Məs: Ali">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary">Soyadı</label>
                                        <input type="text" class="form-control" placeholder="Məs: Mammadov">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary">Ata adı</label>
                                        <input type="text" class="form-control">
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary">Vəzifə Statusu</label>
                                        <select class="form-select select2">
                                            <option>Həkim</option>
                                            <option>Baş Həkim</option>
                                            <option>Tibb bacısı</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary">FIN No</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="ti ti-id small"></i></span>
                                            <input type="text" class="form-control" placeholder="7 simvollu kod">
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary">Doğum Tarixi</label>
                                        <input type="date" class="form-control">
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary">E-mail</label>
                                        <input type="email" class="form-control" placeholder="example@mail.com">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary">Telefon</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="ti ti-phone small"></i></span>
                                            <input type="tel" class="form-control" value="+994">
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold text-secondary">Kart ID</label>
                                        <input type="text" class="form-control" value="987654321">
                                    </div>
                                </div>

                                <div class="row mt-4 pt-3 border-top">
                                    <div class="col-md-6 border-end">
                                        <h6 class="fw-bold text-primary mb-3 small text-uppercase"><i class="ti ti-lock-access me-1"></i> Roll İcazələri</h6>
                                        <div class="d-flex flex-wrap gap-2">
                                            <button type="button" class="btn btn-outline-primary btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#modalRollSobe">Şöbə İcazələri</button>
                                            <button type="button" class="btn btn-outline-primary btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#modalRollDepo">Depo İcazələri</button>
                                            <button type="button" class="btn btn-outline-primary btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#modalRollKassa">Kassa İcazələri</button>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <h6 class="fw-bold text-success mb-3 small text-uppercase"><i class="ti ti-building me-1"></i> Şöbə İcazələri</h6>
                                        <div class="d-flex flex-wrap gap-2">
                                            <button type="button" class="btn btn-outline-success btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#modalShobeSobe">Şöbə İcazələri</button>
                                            <button type="button" class="btn btn-outline-success btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#modalShobeDepo">Depo İcazələri</button>
                                            <button type="button" class="btn btn-outline-success btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#modalShobeKassa">Kassa İcazələri</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-light border-top text-end py-3">
                        <button class="btn btn-primary px-5 ms-2">
                            <i class="ti ti-device-floppy me-1"></i> Yadda Saxla
                        </button>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="modalRollSobe" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0">
                        <div class="modal-header bg-primary-light">
                            <h5 class="modal-title fw-bold text-primary small text-uppercase">Roll İcazələri - Şöbə</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body p-4">
                            <p class="text-muted text-center italic small">İcazə siyahısı yüklənir...</p>
                        </div>
                        <div class="modal-footer bg-light">
                            <button type="button" class="btn btn-white border btn-sm" data-bs-dismiss="modal">Bağla</button>
                            <button type="button" class="btn btn-primary btn-sm px-4">Təsdiqlə</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-top offcanvas-top_ka shadow-lg" tabindex="-1" id="offcanvasTop"
         style="visibility: visible; top: 0;">
        <div class="offcanvas-header border-bottom bg-light">
            <h5 class="mb-0 fw-bold text-primary"><i class="ti ti-filter me-2"></i>Ətraflı Axtarış</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-3">
            <div class="row g-3">
                <div class="col-md-1">
                    <label class="form-label small fw-bold">Kodu</label>
                    <input type="text" class="form-control form-control-sm" placeholder="H0001">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Adı</label>
                    <input type="text" class="form-control form-control-sm" placeholder="Ad">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-bold">Soyadı</label>
                    <input type="text" class="form-control form-control-sm" placeholder="Soyad">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold">Vəzifə</label>
                    <select class="form-select form-select-sm select2">
                        <option value="">Hamısı</option>
                        <option value="1">Həkim</option>
                    </select>
                </div>
                <div class="col-md-1 d-flex align-items-end pb-1">
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="filterStatus">
                        <label class="form-check-label small fw-bold" for="filterStatus">Yalnız aktiv</label>
                    </div>
                </div>
                <div class="col-12 d-flex justify-content-end gap-2 border-top pt-3">
                    <button class="btn btn-light btn-sm border text-secondary"><i class="ti ti-refresh me-1"></i>
                        Sıfırla
                    </button>
                    <button class="btn btn-primary btn-sm px-4"><i class="ti ti-search me-1"></i> Axtar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="add_employee" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content border-0">
                <div class="modal-header bg-primary-light py-3">
                    <h5 class="modal-title fw-bold text-primary"><i class="ti ti-user-plus me-2"></i>Yeni İşçi
                        Qeydiyyatı</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="row g-4">
                        <div class="col-lg-3 border-end text-center">
                            <label class="form-label d-block text-secondary small fw-bold">İşçi Şəkli</label>
                            <div class="position-relative d-inline-block">
                                <div class="avatar avatar-xxl mb-3 border rounded-circle bg-light d-flex align-items-center justify-content-center"
                                     style="width: 140px; height: 140px;">
                                    <i class="ti ti-photo-plus text-muted display-5"></i>
                                </div>
                                <input type="file"
                                       class="position-absolute top-0 start-0 opacity-0 w-100 h-100 cursor-pointer">
                            </div>
                            <div class="form-group mt-3">
                                <label class="form-label text-secondary small fw-bold">Elektron İmza</label>
                                <div class="border rounded p-3 bg-light border-dashed">
                                    <button class="btn btn-outline-primary btn-sm px-3"><i
                                            class="ti ti-pencil-plus me-1"></i> İmza Çək
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-9">
                            <div class="row g-3">
                                <div class="col-md-4"><label class="form-label small fw-bold">Adı</label><input
                                        type="text" class="form-control" placeholder="Ali"></div>
                                <div class="col-md-4"><label class="form-label small fw-bold">Soyadı</label><input
                                        type="text" class="form-control" placeholder="Mammadov"></div>
                                <div class="col-md-4"><label class="form-label small fw-bold">Ata adı</label><input
                                        type="text" class="form-control"></div>
                                <div class="col-md-4"><label class="form-label small fw-bold">Vəzifə</label><select
                                        class="form-select">
                                    <option>Həkim</option>
                                </select></div>
                                <div class="col-md-4"><label class="form-label small fw-bold">FIN No</label><input
                                        type="text" class="form-control"></div>
                                <div class="col-md-4"><label class="form-label small fw-bold">Doğum Tarixi</label><input
                                        type="date" class="form-control"></div>
                                <div class="col-md-4"><label class="form-label small fw-bold">Telefon</label><input
                                        type="tel" class="form-control" value="+994"></div>
                                <div class="col-md-4"><label class="form-label small fw-bold">E-mail</label><input
                                        type="email" class="form-control"></div>
                                <div class="col-md-4"><label class="form-label small fw-bold">Kart ID</label><input
                                        type="text" class="form-control"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light py-3">
                    <button class="btn btn-primary px-5 ms-2"><i class="ti ti-save me-1"></i> Yadda Saxla</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
