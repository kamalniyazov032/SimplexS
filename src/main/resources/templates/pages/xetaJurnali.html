<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body><div layout:fragment="content">
  <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-4">
    <div><h4 class="mb-1"><i class="ti ti-alert-triangle text-danger me-2"></i><span th:text="#{error_log.xeta_jurnali}">Xəta jurnalı</span></h4><p class="text-muted mb-0" th:text="#{error_log.sistem_xetalarinin_deyismez_ba}">Sistem xətalarının dəyişməz baxış jurnalı</p></div>
    <span class="badge bg-danger-subtle text-danger p-2" th:text="#{error_log.count(${totalCount})}"></span>
  </div>
  <div class="card border-0 shadow-sm mb-4"><div class="card-body"><form method="get" th:action="@{/xetaJurnali}" class="row g-3 align-items-end">
    <div class="col-lg-4"><label class="form-label" th:text="#{error_log.xeta_kodu_route_ve_ya_istifade}">Xəta kodu, route və ya istifadəçi</label><div class="input-group"><span class="input-group-text"><i class="ti ti-search"></i></span><input class="form-control" name="q" th:value="${q}" placeholder="Məs: 329F3A33" th:placeholder="#{error_log.mes_329f3a33}"></div></div>
    <div class="col-lg-2"><label class="form-label" th:text="#{error_log.xeta_novu}">Xəta növü</label><select class="form-select" name="nov"><option value="" th:text="#{error_log.hamisi}">Hamısı</option><option value="DB_XETASI" th:selected="${nov=='DB_XETASI'}" th:text="#{error_log.db_xetasi}">DB xətası</option><option value="SISTEM_XETASI" th:selected="${nov=='SISTEM_XETASI'}" th:text="#{error_log.sistem_xetasi}">Sistem xətası</option></select></div>
    <div class="col-lg-2"><label class="form-label" th:text="#{error_log.baslama_tarixi}">Başlama tarixi</label><input class="form-control" type="date" name="baslama" th:value="${baslama}"></div>
    <div class="col-lg-2"><label class="form-label" th:text="#{error_log.bitme_tarixi}">Bitmə tarixi</label><input class="form-control" type="date" name="bitme" th:value="${bitme}"></div>
    <div class="col-lg-2 d-flex gap-2"><button class="btn btn-primary flex-fill"><i class="ti ti-filter me-1"></i><span th:text="#{error_log.axtar}">Axtar</span></button><a class="btn btn-light" th:href="@{/xetaJurnali}"><i class="ti ti-refresh"></i></a></div>
  </form></div></div>
  <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th class="ps-3" th:text="#{error_log.xeta_kodu}">Xəta kodu</th><th th:text="#{error_log.tarix}">Tarix</th><th th:text="#{error_log.nov}">Növ</th><th th:text="#{error_log.istifadeci}">İstifadəçi</th><th th:text="#{error_log.route}">Route</th><th th:text="#{error_log.qisa_sebeb}">Qısa səbəb</th><th class="text-end pe-3" th:text="#{error_log.detal}">Detal</th></tr></thead><tbody>
    <tr th:each="x:${xetalar}"><td class="ps-3"><code class="fw-bold" th:text="${x.xetaKodu}"></code></td><td class="text-nowrap" th:text="${#temporals.format(x.yaranmaTarixi,'dd.MM.yyyy HH:mm:ss')}"></td><td><span class="badge" th:classappend="${x.xetaNovu=='DB_XETASI'}?'bg-warning-subtle text-warning':'bg-danger-subtle text-danger'" th:text="${x.xetaNovu=='DB_XETASI'} ? #{error_log.db_xetasi} : #{error_log.sistem_xetasi}"></span></td><td><span th:text="${x.istifadeciAdi ?: '—'}"></span><small th:if="${x.personalId}" class="d-block text-muted" th:text="|ID: ${x.personalId}|"></small></td><td><code th:text="${x.route ?: '—'}"></code><small th:if="${x.httpMetod}" class="d-block text-muted" th:text="${x.httpMetod}"></small></td><td style="max-width:320px"><span class="d-inline-block text-truncate" style="max-width:320px" th:text="${x.qisaAciqlama ?: '—'}"></span></td><td class="text-end pe-3"><button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="|#xeta${x.id}|"><i class="ti ti-eye me-1"></i><span th:text="#{error_log.bax}">Bax</span></button></td></tr>
    <tr th:if="${#lists.isEmpty(xetalar)}"><td colspan="7" class="text-center text-muted py-5"><i class="ti ti-circle-check fs-2 d-block mb-2"></i><span th:text="#{error_log.uygun_xeta_qeydi_tapilmadi}">Uyğun xəta qeydi tapılmadı</span></td></tr>
  </tbody></table></div>
  <div class="card-footer bg-white d-flex justify-content-between" th:if="${totalCount>0}"><span class="text-muted" th:text="#{error_log.page(${currentPage},${totalPages})}"></span><div class="btn-group"><a class="btn btn-sm btn-outline-primary" th:classappend="${currentPage==1}?' disabled'" th:href="@{/xetaJurnali(q=${q},nov=${nov},baslama=${baslama},bitme=${bitme},page=${currentPage-1})}" th:text="#{error_log.evvelki}">Əvvəlki</a><a class="btn btn-sm btn-outline-primary" th:classappend="${currentPage>=totalPages}?' disabled'" th:href="@{/xetaJurnali(q=${q},nov=${nov},baslama=${baslama},bitme=${bitme},page=${currentPage+1})}" th:text="#{error_log.novbeti}">Növbəti</a></div></div></div>
  <div th:each="x:${xetalar}" class="modal fade" th:id="|xeta${x.id}|" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><div><h5 class="mb-1" th:text="#{error_log.xeta_detali}">Xəta detalı</h5><code th:text="${x.xetaKodu}"></code></div><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><dl class="row mb-0 g-3"><dt class="col-sm-3" th:text="#{error_log.tarix}">Tarix</dt><dd class="col-sm-9" th:text="${#temporals.format(x.yaranmaTarixi,'dd.MM.yyyy HH:mm:ss')}"></dd><dt class="col-sm-3" th:text="#{error_log.istifadeci}">İstifadəçi</dt><dd class="col-sm-9" th:text="${x.istifadeciAdi ?: '—'}"></dd><dt class="col-sm-3" th:text="#{error_log.klinika_id}">Klinika ID</dt><dd class="col-sm-9" th:text="${x.klinikaId ?: '—'}"></dd><dt class="col-sm-3" th:text="#{error_log.sorgu}">Sorğu</dt><dd class="col-sm-9"><code th:text="|${x.httpMetod ?: ''} ${x.route ?: ''}|"></code></dd><dt class="col-sm-3" th:text="#{error_log.ip_unvan}">IP ünvan</dt><dd class="col-sm-9" th:text="${x.ipUnvan ?: '—'}"></dd><dt class="col-sm-3" th:text="#{error_log.exception_sinfi}">Exception sinfi</dt><dd class="col-sm-9"><code th:text="${x.exceptionSinfi ?: '—'}"></code></dd><dt class="col-sm-3" th:text="#{error_log.qisa_sebeb}">Qısa səbəb</dt><dd class="col-sm-9 text-break" th:text="${x.qisaAciqlama ?: '—'}"></dd></dl></div><div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal" th:text="#{error_log.bagla}">Bağla</button></div></div></div></div>
</div></body></html>
