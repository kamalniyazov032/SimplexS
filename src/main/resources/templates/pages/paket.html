<!DOCTYPE html><html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}"><body><div layout:fragment="content">
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"><div><h4 class="mb-1"><i class="ti ti-package text-primary me-2"></i><span th:text="#{packages.title}">Paketlər</span></h4><p class="text-muted mb-0" th:text="#{packages.subtitle}"></p></div><a class="btn btn-outline-primary" th:href="@{/parXidmet(paketStatusu='paket')}"><i class="ti ti-stethoscope me-1"></i><span th:text="#{packages.open_services}"></span></a></div>
<div th:if="${successMessage}" class="alert alert-success border-0 shadow-sm"><i class="ti ti-circle-check me-2"></i><span th:text="${successMessage}"></span></div><div th:if="${errorMessage}" class="alert alert-danger border-0 shadow-sm"><i class="ti ti-alert-circle me-2"></i><span th:text="${errorMessage}"></span></div>
<div class="row g-3 align-items-start"><div class="col-xl-4 col-lg-5"><div class="package-sidebar"><form method="get" th:action="@{/parPaket}" class="package-filter"><div class="row g-2"><div class="col-8"><div class="input-group"><span class="input-group-text bg-white border-end-0"><i class="ti ti-search text-muted"></i></span><input class="form-control border-start-0 ps-0" name="q" th:value="${q}" th:placeholder="#{packages.search}" autocomplete="off"></div></div><div class="col-4"><select class="form-select" name="status" onchange="this.form.submit()"><option value="aktiv" th:selected="${selectedStatus=='aktiv'}" th:text="#{common.aktiv}"></option><option value="passiv" th:selected="${selectedStatus=='passiv'}" th:text="#{common.passiv}"></option><option value="" th:selected="${selectedStatus==''}" th:text="#{common.all}"></option></select></div></div></form>
<div class="package-list"><a th:each="p:${paketler}" class="package-card" th:classappend="${selectedPaket!=null and selectedPaket.id==p.id}?' active':''" th:href="@{/parPaket(paketId=${p.id},q=${q},status=${selectedStatus})}"><span class="package-icon"><i class="ti ti-package"></i></span><span class="package-card-copy"><span class="fw-semibold text-truncate d-block" th:text="${p.ad}"></span><small class="text-muted" th:text="${p.kod}"></small></span><i class="ti ti-chevron-right text-muted"></i></a><div th:if="${#lists.isEmpty(paketler)}" class="text-center text-muted py-5"><i class="ti ti-package-off fs-2 d-block mb-2"></i><span th:text="#{packages.empty}"></span></div></div></div></div>
<div class="col-xl-8 col-lg-7"><div th:if="${selectedPaket}" class="card border-0 package-detail"><div class="card-header bg-white package-header"><div><div class="d-flex align-items-center gap-2 flex-wrap"><h5 class="mb-0" th:text="${selectedPaket.ad}"></h5><span class="badge" th:classappend="${selectedPaket.aktiv}?'bg-success-subtle text-success':'bg-danger-subtle text-danger'" th:text="${selectedPaket.aktiv}?#{common.aktiv}:#{common.passiv}"></span></div><small class="text-muted d-block mt-1" th:text="${selectedPaket.kod}"></small></div><button class="btn btn-sm btn-primary px-3" data-bs-toggle="modal" data-bs-target="#packageContents"><i class="ti ti-list-details me-1"></i><span th:text="#{packages.manage_contents}"></span></button></div>
<div class="table-responsive"><table class="table table-hover align-middle mb-0 package-table"><thead><tr><th class="ps-3"><i class="ti ti-stethoscope me-1"></i><span th:text="#{packages.service}"></span></th><th><i class="ti ti-folders me-1"></i><span th:text="#{packages.group}"></span></th><th><i class="ti ti-category me-1"></i><span th:text="#{packages.type}"></span></th><th class="text-center"><i class="ti ti-number me-1"></i><span th:text="#{packages.quantity}"></span></th></tr></thead><tbody><tr th:each="x:${terkib}"><td class="ps-3"><div class="fw-semibold" th:text="${x.xidmetAdi}"></div><small class="text-muted" th:text="${x.xidmetKodu}"></small></td><td th:text="${x.xidmetQrupuAdi}"></td><td th:text="${x.xidmetTipiAdi}"></td><td class="text-center"><span class="badge bg-primary-subtle text-primary" th:text="${x.miqdar}"></span></td></tr><tr th:if="${#lists.isEmpty(terkib)}"><td colspan="4" class="text-center text-muted py-5"><i class="ti ti-package-off fs-2 d-block mb-2"></i><span th:text="#{packages.no_services}"></span></td></tr></tbody></table></div></div><div th:unless="${selectedPaket}" class="card border-0 package-detail"><div class="card-body text-center text-muted py-5"><i class="ti ti-package fs-1 d-block mb-2"></i><span th:text="#{packages.select_hint}"></span></div></div></div></div>
<div th:if="${selectedPaket}" class="modal fade" id="packageContents" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"><div class="modal-content"><form method="post" th:action="@{/parPaket/terkib}" id="packageForm"><input type="hidden" name="paketId" th:value="${selectedPaket.id}" id="packageId"><input type="hidden" name="xidmetlerJson" id="packageJson"><div class="modal-header border-0 pb-0"><div class="d-flex gap-3 align-items-center"><span class="avatar avatar-lg bg-primary-subtle text-primary rounded-circle"><i class="ti ti-package fs-24"></i></span><div><h5 class="mb-1" th:text="#{packages.manage_contents}"></h5><small class="text-muted" th:text="|${selectedPaket.kod} · ${selectedPaket.ad}|"></small></div></div><button class="btn-close" type="button" data-bs-dismiss="modal" th:aria-label="#{common.bagla}"></button></div><div class="modal-body pt-4"><div class="row g-3"><div class="col-lg-7"><div class="border rounded overflow-hidden"><div class="p-3 bg-light"><div class="row g-2"><div class="col-md-7"><div class="input-group"><span class="input-group-text bg-white"><i class="ti ti-search"></i></span><input class="form-control" id="packageSearch" th:placeholder="#{packages.service_search}" autocomplete="off"></div></div><div class="col-md-5"><select class="form-select" id="packageGroup"><option value="" th:text="#{packages.all_groups}"></option><option th:each="g:${qruplar}" th:value="${g.id}" th:text="${g.tamYol}"></option></select></div></div></div><div id="packageCandidates" class="package-services"></div><div class="p-2 border-top text-center"><button class="btn btn-sm btn-light" type="button" id="packageMore" hidden th:text="#{packages.more}"></button></div></div></div><div class="col-lg-5"><div class="border rounded overflow-hidden"><div class="p-3 bg-light d-flex justify-content-between"><strong th:text="#{packages.selected_services}"></strong><span class="badge bg-primary" id="packageCount">0</span></div><div id="packageSelected" class="package-services"></div></div></div></div></div><div class="modal-footer border-0 pt-0"><button type="button" class="btn btn-light" data-bs-dismiss="modal"><i class="ti ti-x me-1"></i><span th:text="#{common.legv_et}"></span></button><button class="btn btn-primary"><i class="ti ti-device-floppy me-1"></i><span th:text="#{common.yadda_saxla}"></span></button></div></form></div></div></div>
<div id="packageI18n" hidden th:data-add="#{packages.add}" th:data-remove="#{packages.remove}" th:data-quantity="#{packages.quantity}" th:data-empty="#{packages.no_services}" th:data-no-results="#{packages.not_found}" th:data-error="#{packages.load_error}"></div>
<style>.package-sidebar{position:sticky;top:84px}.package-filter{padding:12px;border:1px solid var(--bs-border-color);border-radius:10px;box-shadow:0 5px 18px rgba(25,55,85,.07);margin-bottom:12px}.package-list{max-height:650px;overflow:auto;padding:1px 3px 8px 1px}.package-card{display:flex;align-items:center;gap:12px;min-height:70px;margin-bottom:10px;padding:13px 14px;color:var(--bs-body-color);text-decoration:none;background:var(--bs-body-bg);border:1px solid var(--bs-border-color);border-radius:10px;box-shadow:0 4px 14px rgba(25,55,85,.055);transition:.18s}.package-card:hover{color:var(--bs-body-color);border-color:rgba(var(--bs-primary-rgb),.45);transform:translateY(-1px)}.package-card.active{border-color:var(--bs-primary);background:rgba(var(--bs-primary-rgb),.045)}.package-icon{display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;color:var(--bs-primary);background:rgba(var(--bs-primary-rgb),.1);border-radius:9px}.package-card-copy{flex:1;min-width:0}.package-detail{overflow:hidden;box-shadow:0 7px 24px rgba(25,55,85,.09)}.package-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:15px 16px}.package-table thead th{padding:11px 8px;color:var(--bs-secondary-color);font-size:.78rem;background:var(--bs-tertiary-bg)}.package-table tbody td{padding-top:12px;padding-bottom:12px}.package-services{height:430px;overflow:auto}.package-service{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-bottom:1px solid var(--bs-border-color)}.package-service-info{flex:1;min-width:0}.package-quantity{width:78px}@media(max-width:991.98px){.package-sidebar{position:static}.package-header{flex-direction:column}.package-header button{align-self:flex-end}}</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{const modal=document.getElementById('packageContents');if(!modal)return;const t=document.getElementById('packageI18n').dataset,id=document.getElementById('packageId'),q=document.getElementById('packageSearch'),group=document.getElementById('packageGroup'),cbox=document.getElementById('packageCandidates'),sbox=document.getElementById('packageSelected'),count=document.getElementById('packageCount'),more=document.getElementById('packageMore'),chosen=new Map();let candidates=[],page=0,timer,request,initialized=false;
const empty=(box,msg)=>{const d=document.createElement('div');d.className='text-center text-muted py-5';d.textContent=msg;box.replaceChildren(d)};const info=x=>{const d=document.createElement('div');d.className='package-service-info';const a=document.createElement('div');a.className='fw-semibold text-truncate';a.textContent=x.ad??x.xidmetAdi;const m=document.createElement('small');m.className='text-muted';m.textContent=[x.kod??x.xidmetKodu,x.qrupAdi??x.xidmetQrupuAdi,x.tipAdi??x.xidmetTipiAdi].filter(Boolean).join(' · ');d.append(a,m);return d};
const renderSelected=()=>{sbox.replaceChildren();count.textContent=chosen.size;if(!chosen.size)return empty(sbox,t.empty);chosen.forEach(x=>{const row=document.createElement('div');row.className='package-service';const quantity=document.createElement('input');quantity.type='number';quantity.min='1';quantity.step='1';quantity.className='form-control form-control-sm package-quantity';quantity.title=t.quantity;quantity.value=x.miqdar||1;quantity.addEventListener('change',()=>x.miqdar=Math.max(1,Number.parseInt(quantity.value,10)||1));const remove=document.createElement('button');remove.type='button';remove.className='btn btn-sm btn-outline-danger';remove.title=t.remove;remove.innerHTML='<i class="ti ti-trash"></i>';remove.addEventListener('click',()=>{chosen.delete(String(x.xidmetId));renderSelected();renderCandidates()});row.append(info(x),quantity,remove);sbox.append(row)})};
const renderCandidates=()=>{cbox.replaceChildren();if(!candidates.length)return empty(cbox,t.noResults);candidates.forEach(x=>{const row=document.createElement('div');row.className='package-service';const add=document.createElement('button');add.type='button';add.className='btn btn-sm btn-outline-primary';add.disabled=chosen.has(String(x.id));add.title=t.add;add.innerHTML=`<i class="ti ${add.disabled?'ti-check':'ti-plus'}"></i>`;add.addEventListener('click',()=>{chosen.set(String(x.id),{xidmetId:x.id,xidmetKodu:x.kod,xidmetAdi:x.ad,xidmetQrupuAdi:x.qrupAdi,xidmetTipiAdi:x.tipAdi,miqdar:1});renderSelected();renderCandidates()});row.append(info(x),add);cbox.append(row)})};
const load=async(append=false)=>{if(!append){page=0;candidates=[];cbox.innerHTML='<div class="text-center py-5"><span class="spinner-border spinner-border-sm"></span></div>'}request?.abort();request=new AbortController();const p=new URLSearchParams({paketId:id.value,page:String(page)});if(q.value.trim())p.set('q',q.value.trim());if(group.value)p.set('qrupId',group.value);try{const response=await fetch(`/parPaket/terkib?${p}`,{signal:request.signal,headers:{Accept:'application/json'}});if(!response.ok)throw new Error();const data=await response.json();if(!append){chosen.clear();data.terkib.forEach(x=>chosen.set(String(x.xidmetId),x));renderSelected()}candidates=append?candidates.concat(data.xidmetler):data.xidmetler;more.hidden=!data.hasMore;renderCandidates()}catch(e){if(e.name!=='AbortError')empty(cbox,t.error)}};
modal.addEventListener('shown.bs.modal',()=>{if(!initialized){initialized=true;load()}});q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>load(),300)});group.addEventListener('change',()=>load());more.addEventListener('click',()=>{page++;load(true)});document.getElementById('packageForm').addEventListener('submit',()=>document.getElementById('packageJson').value=JSON.stringify([...chosen.values()].map(x=>({xidmet_id:Number(x.xidmetId),miqdar:Math.max(1,Number(x.miqdar)||1)}))))});
</script></div></body></html>
