<!DOCTYPE html>
<html lang="az" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/main}">
<body><div layout:fragment="content">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
    <div>
      <a class="text-muted text-decoration-none" th:href="@{/xidmetQiymetleri(basliqId=${qrup.basliqId})}"><i class="ti ti-arrow-left me-1"></i>Qiymət qruplarına qayıt</a>
      <h4 class="mt-2 mb-1"><i class="ti ti-currency-manat text-primary me-2"></i><span th:text="${qrup.ad}"></span></h4>
      <p class="text-muted mb-0" th:text="|${qrup.basliqAdi} • ${#temporals.format(qrup.baslamaTarixi, 'dd.MM.yyyy')} — ${#temporals.format(qrup.bitmeTarixi, 'dd.MM.yyyy')}|"></p>
    </div>
    <button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#tarifFilter"><i class="ti ti-filter me-1"></i>Filter</button>
  </div>

  <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
  <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

  <form id="bulkPriceForm" method="post" th:action="@{/xidmetQiymetleri/qiymetler}">
    <input type="hidden" name="qrupId" th:value="${qrup.id}">
    <input type="hidden" id="qiymetlerJson" name="qiymetlerJson">
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2 py-3">
        <div><h5 class="mb-1">Xidmət tarifləri</h5><small class="text-muted"><b th:text="${totalCount}"></b> xidmət tapıldı • səhifədə ən çox <span th:text="${pageSize}"></span> xidmət</small></div>
        <button id="saveChanges" class="btn btn-success" type="submit" disabled><i class="ti ti-device-floppy me-1"></i>Dəyişiklikləri yadda saxla <span id="changedCount" class="badge bg-white text-success ms-1">0</span></button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th class="ps-3" style="min-width:250px">Xidmət</th><th style="min-width:170px">Xidmət qrupu</th><th style="min-width:125px">Qiymət (₼)</th><th style="min-width:120px">Xəstə payı %</th><th style="min-width:135px">Xəstə endirimi %</th><th style="min-width:135px">Qurum endirimi %</th><th class="text-center">ƏDV</th></tr></thead>
            <tbody>
              <tr th:each="x:${xidmetler}" class="price-row" th:attr="data-service-id=${x.xidmetId}">
                <td class="ps-3"><div class="d-flex align-items-center gap-2"><span class="avatar avatar-sm bg-primary-subtle text-primary rounded"><i class="ti ti-stethoscope"></i></span><div><b th:text="${x.xidmetAdi}"></b><small class="d-block text-muted" th:text="${x.xidmetKodu}"></small></div></div></td>
                <td><span class="badge bg-light text-dark fw-normal" th:text="${x.xidmetQrupuAdi}"></span></td>
                <td><input class="form-control form-control-sm js-value js-price" type="number" step="0.01" min="0" th:value="${x.qiymet}" placeholder="0.00" aria-label="Qiymət"></td>
                <td><input class="form-control form-control-sm js-value js-patient-share" type="number" step="0.01" min="0" max="100" th:value="${x.xestePayFaizi}" placeholder="0"></td>
                <td><input class="form-control form-control-sm js-value js-patient-discount" type="number" step="0.01" min="0" max="100" th:value="${x.xesteEndirimFaizi}" placeholder="0"></td>
                <td><input class="form-control form-control-sm js-value js-org-discount" type="number" step="0.01" min="0" max="100" th:value="${x.qurumEndirimFaizi}" placeholder="0"></td>
                <td class="text-center"><div class="form-check form-switch d-inline-block"><input class="form-check-input js-value js-vat" type="checkbox" th:checked="${x.edvAktivdir}" aria-label="ƏDV aktivdir"></div></td>
              </tr>
              <tr th:if="${#lists.isEmpty(xidmetler)}"><td colspan="7" class="text-center py-5"><i class="ti ti-search-off fs-1 text-muted"></i><p class="mt-2 mb-0 text-muted">Filterə uyğun xidmət tapılmadı</p></td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer bg-white d-flex justify-content-between align-items-center" th:if="${totalCount > 0}">
        <small class="text-muted" th:text="|Səhifə ${currentPage} / ${totalPages}|"></small>
        <div class="btn-group">
          <a class="btn btn-sm btn-outline-primary" th:classappend="${currentPage==1}?' disabled'" th:href="@{/xidmetQiymetleri/qrup/{id}(id=${qrup.id},q=${q},xidmetQrupuId=${selectedXidmetQrupuId},qiymetStatus=${qiymetStatus},size=${pageSize},page=${currentPage-1})}"><i class="ti ti-chevron-left"></i> Əvvəlki</a>
          <a class="btn btn-sm btn-outline-primary" th:classappend="${currentPage==totalPages}?' disabled'" th:href="@{/xidmetQiymetleri/qrup/{id}(id=${qrup.id},q=${q},xidmetQrupuId=${selectedXidmetQrupuId},qiymetStatus=${qiymetStatus},size=${pageSize},page=${currentPage+1})}">Növbəti <i class="ti ti-chevron-right"></i></a>
        </div>
      </div>
    </div>
  </form>

  <div class="offcanvas offcanvas-top" tabindex="-1" id="tarifFilter" style="height:190px!important;min-height:190px!important;max-height:190px!important">
    <div class="offcanvas-header py-2 border-bottom"><h5 class="offcanvas-title"><i class="ti ti-filter text-primary me-2"></i>Tariflər üzrə axtarış</h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body py-3">
      <form method="get" th:action="@{/xidmetQiymetleri/qrup/{id}(id=${qrup.id})}" class="row g-2 align-items-center">
        <div class="col-lg-4"><div class="input-group"><span class="input-group-text"><i class="ti ti-search"></i></span><input class="form-control" name="q" th:value="${q}" placeholder="Xidmət kodu və ya adı"></div></div>
        <div class="col-lg-3"><select class="form-select" name="xidmetQrupuId"><option value="">Bütün xidmət qrupları</option><option th:each="g:${xidmetQruplari}" th:value="${g.id}" th:text="${g.tamYol}" th:selected="${g.id==selectedXidmetQrupuId}"></option></select></div>
        <div class="col-lg-2"><select class="form-select" name="qiymetStatus"><option value="">Bütün qiymətlər</option><option value="teyin" th:selected="${qiymetStatus=='teyin'}">Qiymət təyin edilib</option><option value="teyin_deyil" th:selected="${qiymetStatus=='teyin_deyil'}">Qiymət təyin edilməyib</option></select></div>
        <div class="col-lg-1"><select class="form-select" name="size" aria-label="Səhifə ölçüsü"><option value="20" th:selected="${pageSize==20}">20</option><option value="50" th:selected="${pageSize==50}">50</option><option value="100" th:selected="${pageSize==100}">100</option></select></div>
        <div class="col-lg-2 d-flex gap-2"><button class="btn btn-primary flex-fill"><i class="ti ti-search me-1"></i>Axtar</button><a class="btn btn-light" th:href="@{/xidmetQiymetleri/qrup/{id}(id=${qrup.id})}" title="Təmizlə"><i class="ti ti-refresh"></i></a></div>
      </form>
    </div>
  </div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const form = document.getElementById('bulkPriceForm');
  const save = document.getElementById('saveChanges');
  const count = document.getElementById('changedCount');
  const rows = [...document.querySelectorAll('.price-row')];
  const markDirty = row => { row.dataset.dirty = 'true'; row.classList.add('table-warning'); const n = rows.filter(r => r.dataset.dirty === 'true').length; count.textContent = n; save.disabled = n === 0; };
  rows.forEach(row => row.querySelectorAll('.js-value').forEach(input => {
    input.addEventListener('input', () => markDirty(row));
    input.addEventListener('change', () => markDirty(row));
  }));
  form.addEventListener('submit', function (event) {
    const dirty = rows.filter(row => row.dataset.dirty === 'true');
    if (!dirty.length) { event.preventDefault(); return; }
    const invalid = dirty.find(row => row.querySelector('.js-price').value === '' || Number(row.querySelector('.js-price').value) < 0);
    if (invalid) { event.preventDefault(); invalid.querySelector('.js-price').focus(); return; }
    const values = dirty.map(row => {
      const price = row.querySelector('.js-price');
      const number = selector => Number(row.querySelector(selector).value || 0);
      return {xidmet_id:Number(row.dataset.serviceId),qiymet:Number(price.value),xeste_pay_faizi:number('.js-patient-share'),xeste_endirim_faizi:number('.js-patient-discount'),qurum_endirim_faizi:number('.js-org-discount'),edv_aktivdir:row.querySelector('.js-vat').checked};
    });
    document.getElementById('qiymetlerJson').value = JSON.stringify(values);
    save.disabled = true;
  });
});
</script>
</div>
</body></html>
