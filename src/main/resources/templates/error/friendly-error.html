<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - SImplexS'">Sistem xətası - SImplexS</title>
    <link rel="icon"
          type="image/png"
          th:href="@{/custom/logo/icons/SS-Icon-White.png}">
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/assets/plugins/tabler-icons/tabler-icons.min.css}" rel="stylesheet">
    <link th:href="@{/assets/css/style.css}" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: linear-gradient(145deg, #f5f7fb 0%, #eef2ff 100%); }
        .error-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .error-card { width: 100%; max-width: 680px; border: 0; border-radius: 20px; box-shadow: 0 20px 60px rgba(28, 39, 76, .12); }
        .error-icon { width: 88px; height: 88px; display: inline-flex; align-items: center; justify-content: center; border-radius: 24px; font-size: 42px; }
        .reference-box { background: #f8f9fb; border: 1px dashed #cbd3df; border-radius: 12px; }
    </style>
</head>
<body>
<main class="error-wrap">
    <section class="card error-card">
        <div class="card-body p-4 p-md-5 text-center">
            <span class="error-icon bg-danger-subtle text-danger mb-4">
                <i class="ti" th:classappend="${errorIcon}"></i>
            </span>
            <div class="text-uppercase text-muted small fw-semibold mb-2" th:text="|'Xəta ${statusCode}'|">Xəta 500</div>
            <h2 class="mb-3" th:text="${errorTitle}">Sistem xətası</h2>
            <p class="text-muted fs-16 mb-2" th:text="${errorDescription}"></p>
            <p class="text-muted mb-4" th:text="${errorAction}"></p>

            <div class="reference-box p-3 mb-4">
                <div class="small text-muted mb-1"><i class="ti ti-ticket me-1"></i><span th:text="#{common.texniki_desteye_verilecek_xeta_ko}">Texniki dəstəyə veriləcək xəta kodu</span></div>
                <div class="fw-bold fs-5 text-dark user-select-all" th:text="${errorReference}">XXXXXXXX</div>
            </div>

            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <button class="btn btn-primary px-4" type="button" onclick="window.location.reload()">
                    <i class="ti ti-refresh me-1"></i><span th:text="#{common.yeniden_yoxla}">Yenidən yoxla
                </span></button>
                <button class="btn btn-light px-4" type="button" onclick="history.length > 1 ? history.back() : window.location.assign('/dashboard')">
                    <i class="ti ti-arrow-left me-1"></i><span th:text="#{common.geri_qayit}">Geri qayıt
                </span></button>
            </div>
        </div>
    </section>
</main>
</body>
</html>
