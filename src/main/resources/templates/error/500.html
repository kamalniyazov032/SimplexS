<!DOCTYPE html>
<html lang="az" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{common.sistem_xetasi_simplexs}">Sistem xətası - SImplexS</title>
    <link rel="icon"
          type="image/png"
          th:href="@{/custom/logo/icons/SS-Icon-White.png}">
    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/assets/plugins/tabler-icons/tabler-icons.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<main class="min-vh-100 d-flex align-items-center justify-content-center p-4">
    <section class="card border-0 shadow-sm text-center" style="max-width:650px;border-radius:20px">
        <div class="card-body p-5">
            <i class="ti ti-alert-triangle text-danger" style="font-size:72px"></i>
            <h2 class="mt-3" th:text="#{common.sistem_xetasi_bas_verdi}">Sistem xətası baş verdi</h2>
            <p class="text-muted" th:text="#{common.emeliyyati_yerine_yetirmek_mumkun}">Əməliyyatı yerinə yetirmək mümkün olmadı. Səhifəni yeniləyin. Problem davam edərsə sistem administratoruna və ya texniki dəstəyə müraciət edin.</p>
            <button class="btn btn-primary" onclick="window.location.reload()"><i class="ti ti-refresh me-1"></i><span th:text="#{common.yeniden_yoxla}">Yenidən yoxla</span></button>
        </div>
    </section>
</main>
